# npm: security updates only. Version updates are disabled via
# open-pull-requests-limit: 0; security PRs are driven by Dependabot alerts
# (repo setting) and auto-merged by .github/workflows/dependabot-merge.yml.
#
# docker: Dependabot has no security updates for docker, so a limit of 0 would
# never open a PR. Base images get version updates instead, so a Node security
# patch (22.23.4 -> 22.23.5) arrives as a PR. Majors (Node 22 -> 24) and Python
# minors (3.12 -> 3.13) are runtime upgrades, so a human makes those.
#
# github-actions: weekly version updates in one grouped PR. Every third-party
# action is pinned to a commit SHA with its tag in a trailing comment, so a new
# release reaches CI only through that PR, which moves the SHA and the comment
# together. The root directory covers .github/workflows only, so the composite
# actions under .github/actions are listed too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directories:
      - /packages/gp-ai/autopilot
      - /packages/gp-ai/broker
      - /packages/gp-ai/hubspot_ddhq_match/deployment
      - /packages/gp-ai/pmf_engine
      - /packages/gp-ai/serve/v1_pipeline
      - /packages/gp-api/deploy
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*python"
        update-types: ["version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]
        group-by: dependency-name
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
