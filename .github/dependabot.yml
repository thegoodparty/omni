# Security updates only. Version updates are disabled via
# open-pull-requests-limit: 0; security PRs are driven by Dependabot alerts
# (repo setting) and auto-merged by .github/workflows/dependabot-merge.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /packages/gp-ai/autopilot
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /packages/gp-ai/broker
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /packages/gp-ai/hubspot_ddhq_match/deployment
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /packages/gp-ai/pmf_engine
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /packages/gp-ai/serve/v1_pipeline
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /packages/gp-api/deploy
    schedule:
      interval: daily
    open-pull-requests-limit: 0
