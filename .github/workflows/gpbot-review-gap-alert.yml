name: gpbot review gap alert

# delegate-reviewer's approval is the only thing that satisfies the main
# ruleset's one-approval requirement on most PRs. When it reviews and nobody
# merges, gpbot-stale-pr-alert.yml eventually says so. When it never reviews at
# all, nothing says anything, and the PR cannot be merged by anyone — there is
# no approval to act on and no red check to investigate. It just stops.
#
# THIS IS NOT A BUG IN DELEGATE, and the first version of this file said it
# was. Delegate re-checks a moved head only when asked: every review it posts
# ends "Reply `delegate review` after fixing", and when the tip moves while it
# is still reviewing it says so outright. Its review on #1898 read:
#
#   the PR tip moved while this review ran (e6b042bd -> 129d2f6f) so
#   auto-approval is blocked; reply `delegate review` to re-check against
#   the new head
#
# That is a complete and accurate account of the state, delivered at 14:17:42.
# #1898 then sat for two hours anyway, through a push, a re-review request
# (impossible for an App: the REST call accepts `delegate-reviewer[bot]` and
# silently returns an empty requested_reviewers), a close/reopen, and a rebase
# force-push — because nobody read that line. It was eventually reopened as
# #1918, which was never necessary; two words in a comment would have done it.
#
# So the failure this catches is discoverability, not reliability. A PR waiting
# on `delegate review` is indistinguishable, from the outside, from a PR that is
# merely unreviewed: no approval to act on, no red check to investigate, and no
# notification after the day it opened. Five open PRs were in that state when
# this was written, across four authors.
#
# gpbot-stale-pr-alert.yml cannot catch it: it only looks at [GP-Bot] PRs, it
# waits 48h, and it deliberately EXCLUDES delegate from counting as attention,
# because it answers "did a human look?" — a different question from "is this
# waiting on a word nobody knows to say?".
#
# SO IT ASKS, AND ONLY NAMES A PERSON WHEN THERE IS SOMETHING FOR THEM TO DO.
# The first version of this file reported every gap to Slack and sent nothing
# itself, on the grounds that `delegate review` is a claim that the blockers
# were addressed and that claim is the author's to make. True — when there are
# blockers. Most of these PRs have none: delegate commented, the author fixed
# it and pushed, and the approval that would have followed was never asked for.
# There is no claim to make there, and no reason a person should be the one
# saying two fixed words.
#
# What that cost, on the run that prompted this: #1890 and #1137 were both
# reported with zero delegate threads open, so @melecia-gp was asked to do
# something already done and @app/dependabot — which cannot read Slack — was
# asked at all. Only #1877 had real blockers (three) and belonged in the
# channel. Two thirds of the message was noise addressed to the wrong actor.
#
# Delegate has no commenter filter (ops/delegate/lambdas/github.ts —
# shouldDispatchReReview checks the event, the action, PR-openness, the trigger
# regex and a repo allowlist, and nothing about who commented), so an ask from
# github-actions[bot] is honoured exactly like a human's.
#
# The objection about re-checking a head the author may still be editing
# survives, and is answered by GRACE_MINUTES: this only acts on a head that has
# been still for two hours.
#
# Still NEVER merges, closes, or approves anything, like the other two gpbot
# alerts. Posting `delegate review` is the one write it makes.

on:
  schedule:
    # Every 30 minutes on weekdays. A gap costs the author their whole
    # remaining day if it lands at 09:00 and is not noticed until tomorrow,
    # which is what the daily stale alert's cadence would mean here.
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  # Posting `delegate review`. Still no `checks`, no `contents: write` and no
  # approval scope — the one write this job makes is a comment.
  pull-requests: write

concurrency:
  group: gpbot-review-gap-alert
  cancel-in-progress: false

env:
  # Two hours, which is a deliberate compromise rather than a measurement.
  # Delegate answers a fresh PR in four to seven minutes, so anything over ~20
  # would catch a genuine stall. But most PRs in this state are waiting on an
  # author who is mid-fix on a real blocker, and telling them about it forty
  # minutes in is nagging — the fastest way to make this alert the one people
  # mute. Two hours is long enough to mean "this looks parked" and short enough
  # that it does not cost the author their afternoon, as #1898 did.
  GRACE_MINUTES: '120'
  # REST, not GraphQL, so the login carries the suffix. gpbot-stale-pr-alert.yml
  # needs the bare form for the opposite reason — see the note on its
  # BOT_REVIEWERS. Getting this wrong matches nothing and the job goes green
  # reporting no gaps, which is the failure this repo keeps re-learning.
  REVIEWER: 'delegate-reviewer[bot]'
  # Matches the CI drive's MAX_REVIEW_REQUESTS, and for the same reason: a
  # reviewer that has been asked twice against a still head and has not
  # answered is not going to answer on the third ask, and by then the problem
  # is delegate rather than the PR.
  #
  # Counted off the PR's own comments rather than tallied anywhere, exactly as
  # clickup_bot/ci_triage.py does it — see _coerce_asks there. The ask IS a
  # comment, so the comments are the ledger and an ask that failed to post is
  # an ask that does not count.
  #
  # PER HEAD, NOT PER PR, which is where this parts company with the drive. The
  # drive's PRs live for an afternoon; these can be open for weeks and take a
  # push a day, and each push is a new question — two asks for the whole life of
  # such a PR would run out in the first hour and report an active author as a
  # delegate fault forever after. #1890 is the live case: asked once, delegate
  # answered "the PR tip moved during review (a884375b -> b11ce98c)", which is
  # not a refusal and must not cost the new head its asks.
  ASK_CAP: '2'
  # The whole body of an ask, and the string the count above matches on. Both
  # ends have to agree or the cap silently resets, and delegate's own trigger
  # is a WHOLE-LINE regex (`/^\s*delegate[ \t]+review\s*$/im` in
  # ops/delegate/lambdas/github.ts), so an extra word here means it is never
  # honoured at all. This is why the reviews it posts — which contain the
  # phrase in backticks, mid-sentence — do not trigger it recursively.
  ASK_BODY: 'delegate review'

jobs:
  alert:
    name: Find PRs delegate never reviewed
    runs-on: ubuntu-latest
    env:
      # gp_ai_bot — same app as the other two gpbot alerts, because they post
      # to the same channel and a channel membership is per-app.
      SLACK_TOKEN: ${{ secrets.GPBOT_SLACK_BOT_TOKEN }}
      CHANNEL: ${{ vars.GPBOT_PR_CHANNEL_ID }}
    steps:
      - name: Find PRs with no review against their head
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cutoff="$(date -u -d "$GRACE_MINUTES minutes ago" '+%Y-%m-%dT%H:%M:%SZ')"

          # NO `commits` IN THIS QUERY. Asking for it across 200 PRs makes
          # GraphQL refuse the whole call — "requesting up to 1,000,000 possible
          # nodes which exceeds the maximum limit of 500,000" — so the head
          # commit's date is fetched per candidate below, after the cheap
          # filters have cut the list down.
          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,title,url,isDraft,headRefOid,createdAt,author,reviews,headRefName \
            > prs.json

          # Two exclusions, both of which would otherwise be false alarms:
          #
          #   - drafts, which are not asking to be reviewed yet;
          #   - anything already carrying an APPROVED review from anyone, which
          #     satisfies the ruleset and can merge regardless of delegate.
          #
          # A PR delegate reviewed as COMMENTED *at the current head* is
          # deliberately NOT a gap. That is a blocker waiting on its author, and
          # nagging about it here would make this alert the thing people mute.
          #
          # THE APPROVED EXCLUSION IS NOT COMMIT-AWARE, ON PURPOSE. The ruleset
          # sets dismiss_stale_reviews_on_push:false and require_last_push_
          # approval:false, so an approval survives a later push and keeps
          # satisfying required_approving_review_count:1. Such a PR is merge-
          # ABLE, which is the one thing this job screens for, so reporting it
          # would be a false alarm by this file's own definition. #1260 is the
          # live proof: approved at 095eb78c4, head 7cd84ad39, and GitHub calls
          # it APPROVED/CLEAN today.
          #
          # That does leave a real hole — #1260 can merge carrying an approval
          # for code nobody read, and #275, #265 and #234 are the same shape —
          # but it is a review-integrity problem, not a stuck-PR problem, and
          # the remedy is a ruleset setting rather than a Slack ping. Out of
          # scope here deliberately, not by oversight.
          #
          # `.reviews[].state` here is GraphQL's, which is why the author login
          # in it is bare while REVIEWER below carries `[bot]` — the two halves
          # of this job read two different APIs. See gpbot-stale-pr-alert.yml.
          # A THIRD EXCLUSION: PRs the CI drive owns. gpbot-ci-drive.yml reaches
          # the same decision about the same PRs with far more context — it asks
          # only once conflicts, checks and findings are settled, because an
          # approval names a commit and its own fix run is about to move the
          # head. Two automated actors asking would buy delegate runs against a
          # head that is still moving, and the drive escalates to Slack by
          # itself, so these are not reported here either. Same predicate the
          # drive uses to pick them up.
          jq -r '
            .[]
            | select(.isDraft | not)
            | select([.reviews[]? | select(.state == "APPROVED")] | length == 0)
            | select((.title | startswith("[GP-Bot]")) or (.headRefName | contains("/gp-bot_")) | not)
            | "\(.number)\t\(.headRefOid)\t\(.createdAt)\t\(.author.login // "unknown")\t\(.author.is_bot // false)\t\(.url)\t\(.title)"
          ' prs.json > candidates.tsv

          echo "checking $(wc -l < candidates.tsv) unapproved, non-draft PR(s)"

          # The per-PR call is the whole point and cannot come from `gh pr list`:
          # GraphQL's review objects do not carry the reviewed commit, and the
          # reviewed commit is the only thing that distinguishes "reviewed this
          # code" from "reviewed something this branch no longer contains".
          # That distinction is exactly what #1898 turned on — its one review
          # was stamped e6b042bda, which `git merge-base --is-ancestor` puts
          # nowhere in the branch's history at all, because a force-push had
          # orphaned it four minutes before the review was posted.
          : > blocked.txt
          : > unanswered.txt
          asked=0
          while IFS=$'\t' read -r num head created author is_bot url title; do
            [ -n "${num:-}" ] || continue

            # THE GRACE IS MEASURED FROM THE HEAD, NOT FROM `updatedAt`.
            # updatedAt bumps on every comment, and pr-preview-comment.yml
            # upserts one on each push, so a PR with any CI chatter never ages
            # past the cutoff and its gap would never be reported. #1910 is
            # exactly that shape: 50 minutes un-reviewed, updatedAt minutes old.
            #
            # The later of createdAt and the head commit's committer date is
            # what "how long has this head been waiting" actually means. The
            # commit date alone would flag a PR opened one minute ago off a
            # branch whose commits are a week old; createdAt alone would never
            # re-arm after a force-push, which is the case that started all of
            # this.
            head_date="$(gh api "repos/$REPO/commits/$head" --jq '.commit.committer.date' 2>/dev/null)" || head_date=''
            if [ -z "$head_date" ]; then
              echo "::warning::could not read the head commit of #$num; skipped this run"
              continue
            fi
            # A plain `if` rather than `[ ... ] && since=...`: the latter is an
            # AND-OR list whose test failing makes the list's status non-zero,
            # and reasoning about whether `set -e` exempts that is not worth the
            # doubt in a job whose whole value is not crying wolf.
            since="$created"
            if [ "$head_date" \> "$since" ]; then
              since="$head_date"
            fi
            if [ "$since" \> "$cutoff" ]; then
              echo "  young: #$num head has only been up since $since"
              continue
            fi
            # CAPTURED BEFORE PARSING, AND CHECKED FOR EMPTY, because the
            # failure mode of not doing so is a false accusation. A PR with no
            # reviews answers `[]`, but a call that fails answers nothing at
            # all — and `jq -s '(add // [])' ` turns nothing into `[]` too,
            # whose length is 0, which is this job's word for "delegate never
            # reviewed this". A network blip would name innocent PRs in Slack.
            # `[]` and `''` are the two cases that must not be conflated here.
            raw="$(gh api "repos/$REPO/pulls/$num/reviews" --paginate 2>/dev/null)" || raw=''
            if [ -z "$raw" ]; then
              echo "::warning::could not read reviews for #$num; skipped this run"
              continue
            fi

            # Real jq, not `gh api --jq`, which takes exactly one argument and
            # rejects `--arg` outright ("accepts 1 arg(s), received 4"). And
            # `jq -s` rather than gh's own `--slurp`, so this does not depend on
            # the runner's gh being new enough to have it: `--paginate` emits one
            # JSON array per page, slurping collects them into an array of
            # arrays, and `add` flattens.
            reviewed="$(printf '%s' "$raw" \
              | jq -s --arg r "$REVIEWER" --arg h "$head" \
                '(add // []) | [.[] | select(.user.login == $r and .commit_id == $h)] | length')"

            [ "$reviewed" = "0" ] || continue
            echo "gap: #$num ($author) head ${head:0:9}"

            # WHETHER DELEGATE IS STILL HOLDING A BLOCKER IS THE WHOLE
            # DISTINCTION, because it is what decides whether `delegate review`
            # would be a true statement. With a thread open the reply asserts
            # something only the author knows; with none open it asserts
            # nothing and asks for a verdict on code already pushed.
            #
            # GraphQL, so the login is bare (`delegate-reviewer`) where REVIEWER
            # above carries `[bot]` — the third API this one job reads. Matched
            # by prefix so both spellings count, because matching neither is
            # this repo's recurring way of going green while doing nothing.
            #
            # `isOutdated` counts as cleared: a thread against a line the branch
            # no longer has is not something the author can resolve.
            # The owner/name/num in the query are GraphQL variables, bound by
            # the -F flags below rather than by the shell, so the single quotes
            # are the point and SC2016 is wrong here.
            # shellcheck disable=SC2016
            blockers="$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$num:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$num){
                    reviewThreads(last:100){
                      nodes{ isResolved isOutdated comments(first:1){ nodes{ author{ login } } } }
                    }
                  }
                }
              }' \
              -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F num="$num" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                     | select(.isResolved == false and .isOutdated == false)
                     | select(((.comments.nodes[0].author.login) // "") | startswith("delegate-reviewer"))]
                    | length' 2>/dev/null)" || blockers=''
            if [ -z "$blockers" ]; then
              echo "::warning::could not read the review threads of #$num; skipped this run"
              continue
            fi

            if [ "$blockers" != "0" ]; then
              # The one case that is genuinely a person's. Reported with the
              # count, because "delegate is holding 3 blockers open" is a
              # different sentence from "nobody asked", and the old message
              # said the second to authors in the first situation.
              #
              # EXCEPT WHEN NOBODY IS BEHIND IT. Naming @app/dependabot implies
              # dependabot will go and fix the blocker, and it will not — #1137
              # has sat since 4 August and picked up a blocker on the very pass
              # that proved this mechanism works. A bot-authored PR with a
              # blocker open needs a person to adopt it or close it, so the line
              # says that instead of @-ing something that cannot read.
              echo "  blocked: #$num has $blockers open delegate thread(s) (author=$author is_bot=$is_bot)"
              if [ "$is_bot" = "true" ]; then
                printf '• <%s|#%s> %s — %s open, and %s cannot address them; needs a human to adopt or close it\n' \
                  "$url" "$num" "$title" "$blockers" "$author" >> blocked.txt
              else
                printf '• <%s|#%s> %s — @%s (%s open)\n' "$url" "$num" "$title" "$author" "$blockers" >> blocked.txt
              fi
              continue
            fi

            # Same slurp-and-add shape as the reviews read above, and the same
            # empty-vs-`[]` care: a PR with no comments answers `[]`, a failed
            # call answers nothing, and conflating them would read as "never
            # asked" and uncap the asking.
            raw_comments="$(gh api "repos/$REPO/issues/$num/comments" --paginate 2>/dev/null)" || raw_comments=''
            if [ -z "$raw_comments" ]; then
              echo "::warning::could not read the comments of #$num; skipped this run"
              continue
            fi
            # `$since` is the cap's scope: only asks newer than this head count
            # against it. ISO-8601 in Z compares correctly as a string, which is
            # what the `>` here relies on and what the grace comparison above
            # already relies on.
            #
            # One known skew, in the safe direction: `$since` is the head's
            # COMMITTER date, so after a rebase an ask sent before it can look
            # newer than the head it preceded and be counted against the new
            # one. That spends an ask early rather than asking too often, and
            # the unanswered bucket catches the PR either way.
            asks="$(printf '%s' "$raw_comments" \
              | jq -s --arg body "$ASK_BODY" --arg since "$since" \
                '(add // []) | [.[]
                  | select(.user.login == "github-actions[bot]")
                  | select(((.created_at) // "") > $since)
                  | select((((.body) // "") | gsub("^\\s+|\\s+$"; "")) == $body)] | length')"

            if [ "$asks" -ge "$ASK_CAP" ]; then
              # Asked twice about this head and still nothing. That is not the
              # author's problem to solve, so the line says so rather than
              # telling them to send a third.
              echo "  unanswered: #$num asked $asks time(s) about ${head:0:9}"
              printf '• <%s|#%s> %s — asked %s time(s) about this head, still no review\n' "$url" "$num" "$title" "$asks" >> unanswered.txt
              continue
            fi

            echo "  asking: #$num (ask $((asks + 1)) of $ASK_CAP)"
            if gh api -X POST "repos/$REPO/issues/$num/comments" -f body="$ASK_BODY" >/dev/null 2>&1; then
              asked=$((asked + 1))
            else
              # Nothing is spent by a failed ask — no comment, nothing to count
              # — so the next pass tries again. Warn rather than fail: one PR
              # that could not be commented on must not stop the rest, and this
              # job's remaining value is the Slack post.
              echo "::warning::could not ask for a review on #$num"
            fi
          done < candidates.tsv

          blocked_count="$(grep -c '^•' blocked.txt || true)"
          unanswered_count="$(grep -c '^•' unanswered.txt || true)"
          echo "asked $asked PR(s); $blocked_count waiting on an author; $unanswered_count unanswered after $ASK_CAP ask(s)"
          cat blocked.txt unanswered.txt

          # Only the two buckets a person can act on reach Slack. The asks do
          # not: the ask is visible on the PR, it resolves itself within
          # minutes, and announcing every one of them is how this channel
          # becomes the one people mute.
          {
            echo "count=$((blocked_count + unanswered_count))"
            echo "blocked_count=$blocked_count"
            echo "unanswered_count=$unanswered_count"
            echo 'blocked<<GAPS_EOF'
            cat blocked.txt
            echo 'GAPS_EOF'
            echo 'unanswered<<GAPS_EOF'
            cat unanswered.txt
            echo 'GAPS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Silent when there is nothing to say, for the same reason the stale
      # alert is: a recurring "0 gaps" every half hour is how a channel becomes
      # background noise.
      - name: Post to Slack
        if: steps.scan.outputs.count != '0' && env.SLACK_TOKEN != '' && env.CHANNEL != ''
        env:
          BLOCKED: ${{ steps.scan.outputs.blocked }}
          UNANSWERED: ${{ steps.scan.outputs.unanswered }}
          BLOCKED_COUNT: ${{ steps.scan.outputs.blocked_count }}
          UNANSWERED_COUNT: ${{ steps.scan.outputs.unanswered_count }}
        run: |
          set -euo pipefail

          # Two sections, because they need two different things, and the old
          # single section told everyone the wrong one. Each is omitted when
          # empty rather than printed as a zero.
          text=''
          if [ "$BLOCKED_COUNT" != "0" ]; then
            text="*${BLOCKED_COUNT} PR(s) have \`${REVIEWER}\` blockers still open against the current head*, so nobody can merge them. The bot does not send \`delegate review\` on these — that reply asserts the blockers were addressed, and only the author knows whether they were. Push the fix and the ask happens automatically."
            text="${text}"$'\n'"${BLOCKED}"
          fi
          if [ "$UNANSWERED_COUNT" != "0" ]; then
            # A plain `if`, not `[ -n "$text" ] && text=...`: that is an AND-OR
            # list whose failing test makes the list's status non-zero, which
            # `set -e` takes as the step failing. Same trap as the `since`
            # comparison in the scan step.
            if [ -n "$text" ]; then
              text="${text}"$'\n\n'
            fi
            text="${text}*${UNANSWERED_COUNT} PR(s) have been asked ${ASK_CAP}x and \`${REVIEWER}\` still has not reviewed the current head* after ${GRACE_MINUTES}m. Nothing is blocking on the author here — this one is delegate, and it needs someone to look at why."
            text="${text}"$'\n'"${UNANSWERED}"
          fi

          # chat.postMessage answers HTTP 200 when it refuses the message, so
          # the `jq -e .ok` is what actually proves delivery. Without it this
          # step goes green while nobody is told — the precise shape of the bug
          # that made #1918 necessary.
          jq -n --arg channel "$CHANNEL" --arg text "$text" \
            '{channel: $channel, text: $text}' \
            | curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_TOKEN" \
                -H 'Content-type: application/json; charset=utf-8' \
                --data @- \
            | tee /dev/stderr \
            | jq -e '.ok' > /dev/null
