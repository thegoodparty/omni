name: PR preview comment

# Posts a single, upserted comment listing the deterministic Vercel preview URL
# for each Next app. The URLs are derived from the PR number (each app's deploy
# job aliases its PR preview to <slug>-pr-<N>-good-party.vercel.app), so this
# comment can be posted immediately on open/sync without waiting on the deploys
# and without racing to edit a shared comment. This is the sole owner of the
# Next-app preview comment; gp-api posts its own (ephemeral Pulumi URL) comment.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Upsert preview comment
    runs-on: ubuntu-latest
    steps:
      - name: Upsert preview table
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.issue.number
            const marker = '<!-- vercel-previews -->'
            const apps = [
              ['gp-webapp', `https://gp-ui-pr-${pr}-good-party.vercel.app`],
              ['gp-admin', `https://gp-admin-web-pr-${pr}-good-party.vercel.app`],
              ['candidate-sites', `https://candidate-sites-pr-${pr}-good-party.vercel.app`],
            ]
            const body = [
              marker,
              '## Preview deploys',
              '',
              '| App | Preview |',
              '|-----|---------|',
              ...apps.map(([name, url]) => `| ${name} | ${url} |`),
              '',
              '> Links go live once each app\'s Vercel deploy finishes.',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              })
            }
