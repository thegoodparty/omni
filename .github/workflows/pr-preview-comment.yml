name: PR preview comment

# Creates the single preview comment on a PR and keeps its gp-api row, whose
# URL is derived from the PR number (pr-<N>.preview.goodparty.org). The Vercel
# apps have no per-PR alias, because the preview token's Developer role cannot
# assign one, so each app's deploy job writes its own generated URL into its
# row (vercel-deploy's preview-name). This workflow keeps whatever URLs are
# already in the table and only adds rows that are missing.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Cancel superseded PR runs: this workflow only writes the gp-api row, which
# is derived from the PR number alone, so every queued re-run would write the
# same thing. Keeping only the latest also means two runs never race here.
concurrency:
  group: pr-preview-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  comment:
    name: Upsert preview comment
    runs-on: ubuntu-latest
    steps:
      - name: Upsert preview table
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.issue.number
            const marker = '<!-- vercel-previews -->'

            const apps = ['gp-api', 'gp-webapp', 'gp-admin', 'candidate-sites']

            const parseRows = (body) =>
              Object.fromEntries(
                (body || '')
                  .split('\n')
                  .map((line) => line.match(/^\| ([\w-]+) \| (.*?) \| (.*?) \|$/))
                  .filter(Boolean)
                  .map((m) => [m[1], { url: m[2], sha: m[3] }]),
              )

            const render = (rows) =>
              [
                marker,
                '## Preview deploys',
                '',
                '| App | Preview | Commit |',
                '|-----|---------|--------|',
                ...apps.map(
                  (a) =>
                    `| ${a} | ${rows[a]?.url || '_not deployed yet_'} | ${rows[a]?.sha || ''} |`,
                ),
                '',
                '> Each push gets new Vercel preview URLs. This table shows the latest deploy of each app.',
              ].join('\n')

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                per_page: 100,
              },
            )
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker),
            )
            const rows = parseRows(existing?.body)
            rows['gp-api'] = { url: `https://pr-${pr}.preview.goodparty.org`, sha: '' }
            const body = render(rows)
            if (existing) {
              if (existing.body === body) return
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              })
            }
