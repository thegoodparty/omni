name: setup-smoke

# Exercises `npm run setup` end-to-end on a fresh runner: fresh clone, no
# prior npm install, no .env files anywhere, --from a fixture dir built from
# .env.example. Confirms the whole bootstrap script (ENG-11190) actually
# reaches a healthy gp-api, not just that its pieces typecheck.
#
# Stays on --from here even though the GitHub device flow (ENG-11194) is
# setup.sh's default secrets source now: CI has no human to approve an
# interactive device-flow authorization, so --from is the only path a
# runner can exercise. The device-flow helper itself is unit-tested below.
#
# Deliberately its own workflow, not folded into gp-api.yml's Validate gate:
# it is the slowest check in the repo (npm ci + docker + full migrate + a
# cold Next.js boot) and new, so it should not become a required check that
# blocks an unrelated PR on a flake while it proves itself out. Not required
# in branch protection — see docs/deployment.md for what is.

on:
  pull_request:
    paths:
      - .github/workflows/setup-smoke.yml
      - scripts/dev.sh
      - scripts/setup.sh
      - scripts/setup-config.sh
      - scripts/setup/**
      - package.json
      - package-lock.json
      - .nvmrc
      - packages/gp-api/.env.example
      - packages/gp-api/docker-compose.yml
      - packages/gp-api/src/shared/env/env.schema.ts
      - packages/gp-api/src/health/**
      - packages/gp-webapp/.env.example
      - packages/gp-webapp/env.schema.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/setup-smoke.yml
      - scripts/dev.sh
      - scripts/setup.sh
      - scripts/setup-config.sh
      - scripts/setup/**

permissions:
  contents: read

concurrency:
  group: setup-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: npm run setup --from fixture
    runs-on: ubuntu-latest
    # npm ci + docker pull postgres:16.8 + 258 migrations + seed + a cold
    # Next.js compile, all on a shared 2-core runner, THEN setup.sh's own
    # 15-minute health gate. Generous on purpose — this job is advisory, so
    # a slow pass beats a fast false failure. This is the ONE deadline: the
    # poll below runs as long as setup.sh is alive, so no second clock can
    # expire while setup.sh is still legitimately waiting.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # No submodules: true here on purpose. Leaving ai-rules/ empty lets
          # this run exercise setup.sh's own preflight submodule-init step,
          # the same path a genuinely fresh clone hits.

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # A schema-complete fixture "working checkout" for --from: every
      # required var in gp-api's and gp-webapp's schemas already has a
      # non-empty placeholder in .env.example (enforced by each package's
      # own check-env-contract.ts CI gate), so this is exactly what tickets
      # 01/03 promised setup.sh's fixture story. Its DATABASE_URL already
      # points at postgres:postgres@localhost:5432/gpdb — the same Postgres
      # setup.sh's own `docker compose up` step stands up — so nothing here
      # needs to override it for "a real local DATABASE_URL for the runner".
      - name: Build a schema-complete fixture checkout
        # The webapp fixture needs the REAL test-instance Clerk pair (same
        # Actions secrets the E2E jobs use): Clerk middleware derives its API
        # host from the publishable key, so .env.example's placeholder 500s
        # every page and the health gate below can never pass. gp-api's
        # fixture deliberately keeps placeholders — its health gate is
        # DB-only, and real keys would make every smoke run create seed
        # users in the shared Clerk test instance.
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/setup-fixture/packages/gp-api
          mkdir -p /tmp/setup-fixture/packages/gp-webapp
          cp packages/gp-api/.env.example /tmp/setup-fixture/packages/gp-api/.env
          cp packages/gp-webapp/.env.example /tmp/setup-fixture/packages/gp-webapp/.env.local
          python3 - <<'PY'
          import os
          path = '/tmp/setup-fixture/packages/gp-webapp/.env.local'
          repl = {
              'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY': os.environ['CLERK_PUBLISHABLE_KEY'],
              'CLERK_SECRET_KEY': os.environ['CLERK_SECRET_KEY'],
          }
          lines = []
          with open(path) as f:
              for line in f:
                  key = line.split('=', 1)[0].strip()
                  lines.append(f'{key}={repl[key]}\n' if key in repl else line)
          with open(path, 'w') as f:
              f.writelines(lines)
          PY

      - name: npm run setup -- --from fixture
        run: |
          set -euo pipefail
          # Its own session and process group. Teardown below ends with
          # scripts/dev.sh's `kill 0`, which signals dev.sh's whole process
          # group; started as a plain background job, that group is this
          # step's own shell, so the step killed itself (exit 143) after every
          # health check had passed. setsid keeps `kill 0` inside setup.sh's
          # tree, where it belongs.
          setsid scripts/setup.sh --from /tmp/setup-fixture >setup.log 2>&1 &
          setup_pid=$!

          api_ok=false
          webapp_ok=false
          # No deadline of its own: setup.sh's internal health gate and the
          # job's timeout-minutes bound this loop; it exits when setup.sh
          # does. A second clock here raced setup.sh's (outer started at
          # launch, inner after the npm ci/docker/migrate preamble).
          # Every probe is capped: a dev server mid-compile accepts the
          # connection and answers nothing, and an uncapped curl parked this
          # loop until the job's timeout-minutes cancelled it, after setup.sh
          # itself had already printed "ready" (run 37346283518).
          while true; do
            if [ "$api_ok" != true ] &&
              curl -fsS --max-time 5 -o /dev/null http://localhost:3000/v1/health; then
              api_ok=true
            fi
            if [ "$webapp_ok" != true ] &&
              curl -fsS --max-time 5 -o /dev/null http://localhost:4000; then
              webapp_ok=true
            fi
            if [ "$api_ok" = true ] && [ "$webapp_ok" = true ]; then
              break
            fi
            if ! kill -0 "$setup_pid" 2>/dev/null; then
              echo "scripts/setup.sh exited before both services became healthy." >&2
              break
            fi
            sleep 3
          done

          if [ "$api_ok" != true ] || [ "$webapp_ok" != true ]; then
            echo "api_ok=$api_ok webapp_ok=$webapp_ok" >&2
            echo "last codes: api=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:3000/v1/health || true) webapp=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:4000 || true)" >&2
            echo "--- tail of setup.log ---" >&2
            tail -n 200 setup.log >&2
            exit 1
          fi

          api_code="$(curl -fsS --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:3000/v1/health || true)"
          webapp_code="$(curl -fsS --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:4000 || true)"
          echo "GET /v1/health -> $api_code ; GET :4000 -> $webapp_code"
          # Same -f semantics as the poll loop above: the healthy webapp
          # answers / with a 307 to the sign-in page, so asserting a literal
          # 200 on :4000 fails a fully-working stack. -f only rejects >=400.
          if ! curl -fsS --max-time 5 http://localhost:3000/v1/health ||
            ! curl -fsS --max-time 5 -o /dev/null http://localhost:4000; then
            echo "--- tail of setup.log ---" >&2
            tail -n 200 setup.log >&2
            exit 1
          fi
          echo

          # ENG-11191: setup.sh's own final step (after these same health
          # checks, inside the script) seeds a login and prints a skip note
          # when no machine secret is configured — which is every machine in
          # this job. Poll for that note rather than killing setup_pid as
          # soon as health passes: that step still has a couple of `npx tsx`
          # calls left to run, and killing too early would race them.
          login_skip_seen=false
          for _ in $(seq 1 30); do
            if grep -q 'LOCAL_SETUP_CLERK_MACHINE_SECRET not set' setup.log; then
              login_skip_seen=true
              break
            fi
            sleep 1
          done
          if [ "$login_skip_seen" != true ]; then
            echo "setup.sh never printed the login-seeding skip note." >&2
            tail -n 200 setup.log >&2
            exit 1
          fi

          # The whole group, so nothing setup.sh started outlives the step.
          kill -TERM -- "-$setup_pid" 2>/dev/null || true
          wait "$setup_pid" 2>/dev/null || true

      # Runs after the smoke step on purpose: setup.sh's own `npm ci` has
      # installed the workspace by now, so this uses the lockfile-pinned
      # vitest instead of an unpinned registry download on a bare runner.
      - name: Unit test the setup helpers (env merge, device flow, bundle fetch)
        run: npx --no-install vitest run scripts/setup/lib

      - name: Setup log
        if: always()
        run: cat setup.log || true
