name: gp-sdk

on:
  pull_request:
    branches-ignore: [qa, master]
  push:
    branches: [develop, qa, master]

permissions:
  contents: read

concurrency:
  group: gp-sdk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  WORKSPACE: packages/gp-sdk

jobs:
  build:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-sdk
          build-contracts: "true"

      - name: Typecheck
        run: npm run typecheck -w ${{ env.WORKSPACE }}

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Format check
        run: npm run format:check -w ${{ env.WORKSPACE }}

      - name: Build SDK
        run: npm run build -w ${{ env.WORKSPACE }}

      - name: Publish note
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: |
          echo "SDK publish is intentionally not enabled in omni yet." >> "$GITHUB_STEP_SUMMARY"
          echo "Resolve external consumers and npm token naming before enabling it." >> "$GITHUB_STEP_SUMMARY"
