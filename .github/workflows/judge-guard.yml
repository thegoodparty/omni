name: Universal judge guard (shadow)

# ENG-11590 (the skeleton: trigger, concurrency, the cheap gate, the
# path-matched floor) and ENG-11591 (M2 of the Judge Case Iteration TDD:
# https://goodparty.clickup.com/90132012119/v/dc/2ky4jq2q-20493/2ky4jq2q-180433
# — the picker, which adds agents for shared-code changes the floor alone
# misses: 80 of 208 merged agent-code changes from Sep 29 to Oct 29 touched
# only shared code, and path matching picked no agent for any of them).
#
# KILL SWITCH: every job below is gated on the repository variable
# JUDGE_GUARD_ENABLED being exactly `true` (the `guard` job's own `if:`,
# combined with its other conditions). With the variable unset or set to
# anything else, this workflow stops before the path floor, the picker, or
# any check post — no model call, no spend, nothing on the PR. This is what
# let ENG-11590/11591/... merge to main with no effect on any other PR while
# the guard was being built; only a person sets the variable, never a story
# in this epic. See `packages/gp-api/src/chats/evals/judge/README.md`'s
# guard section for the same note from the judge module's side.
#
# SHADOW ONLY. This check is never added to the `main` ruleset's required
# checks by anything in this file — see the TDD's "Guard: judge agent PRs
# automatically" section for why (3 of 20 agents wired up, calibration still
# a handful of probes).
#
# WHY `pull_request_target`, UNLIKE EVERY OTHER JUDGE ENTRY POINT.
# judge-request.yml's own header explains at length why the judge carries no
# `pull_request` trigger: a sweep costs money, so it is asked for, never
# fired by opening a PR, and pointing a plan job at every PR in a public
# monorepo would be noise on hundreds of PRs that touch no agent at all. The
# guard reverses that decision on purpose — the whole point is to stop asking
# — but avoids the noise `pull_request` would cause the same way: every run
# posts exactly one check (a quiet "no agent reached" pass when nothing was
# found), and the PR only gets a comment when the final agent set — floor
# plus whatever the picker added — is non-empty.
#
# `pull_request_target` runs the workflow FILE from `main`, so a PR cannot
# change what the guard does to itself, and — see the one checkout step
# below — this workflow never checks out or runs the PR's own code. Only
# judge.yml's candidate arm does that, the same as it already does for
# `/judge --live`.
#
# ALSO `opened` AND `reopened`, not just `ready_for_review`/`synchronize`
# (decision recorded on the ENG-11590 ClickUp ticket,
# https://app.clickup.com/t/17tnw2bcqmk, 2026-11-05 — this repo carries no
# record a reviewer can check against, so no name is attached here). Most
# PRs here are opened ready for review — ship-pr's default, with no draft
# stage — so they never fire `ready_for_review` at all; without `opened`
# they would get no guard run until their next push, and a PR that merges
# off its first push is never checked. The picker is a cents-scale call
# (TDD "Guard: judge agent PRs automatically"), so unlike `/judge --live`
# there is no cheaper gate worth adding in front of it — see "ENG-11591" below.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

# THE INVARIANT EVERY JUDGE ENTRY POINT KEEPS: resolve to
# `universal-judge-pr-<pr number>`, so a guard run, a `/judge` comment and a
# manual dispatch for the same PR all contend for one slot (judge-comment.yml
# and judge-request.yml's own headers carry the long version of why — groups
# are repository-wide, so they only collide when the key is spelled the same
# way). This file only ever serves `pull_request_target`, so unlike
# judge-request.yml's `inputs.pr_number || github.run_id` (two events to
# serve) this is just the PR number the trigger already carries.
#
# GATED THE SAME WAY AS THE JOB'S OWN `if:`, not just keyed by PR number. A
# workflow run joins its concurrency group before any job `if:` is evaluated,
# so a draft or fork push that the job below skips would otherwise still join
# this group and cancel whatever already holds it — including an in-flight,
# paid `/judge --live` sweep on the same PR. judge-comment.yml's header warns
# about exactly this and falls back to a `-noop-<run_id>` group for a request
# that cannot start a run; judge-request.yml does the same with `github.
# run_id`. This mirrors that fallback with this file's own skip condition.
concurrency:
  group: >-
    ${{ (github.event.pull_request.draft == false
    && github.event.pull_request.head.repo.fork == false)
    && format('universal-judge-pr-{0}', github.event.pull_request.number)
    || format('universal-judge-noop-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # comment on the PR when the floor matches an agent
  checks: write # the "Universal judge (shadow)" check run
  id-token: write # assume the judge's AWS role for the picker's S3 ledger

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GUARD BEFORE CHECKOUT, same principle as judge.yml's own fork gate
    # (its header: "the fork check has to happen before anything from the
    # head commit is fetched, let alone run") — here as a job `if:` rather
    # than a run step, so a fork or draft PR never starts the job at all,
    # not even the checkout of main below. The mechanism differs from
    # judge.yml's `gh pr view --json isCrossRepository` because that file is
    # a `workflow_call` with no direct event payload to read; `pull_request_
    # target` hands this one the PR object directly, and reading it here is
    # one less API call for the same answer.
    #
    # `ready_for_review` only fires once a PR is no longer a draft, so this
    # never skips that event; it exists for `synchronize` on a PR still in
    # draft, and now also for `opened`/`reopened` on a PR opened (or
    # reopened) directly as a draft, both of which this workflow should
    # stay quiet on until the PR is marked ready for review.
    #
    # `vars.JUDGE_GUARD_ENABLED == 'true'` is the kill switch documented at
    # the top of this file. An unset or non-`true` variable means this job —
    # the only job in this workflow — never starts, so nothing past this
    # line ever runs: no checkout, no floor, no picker, no check post.
    if: >-
      vars.JUDGE_GUARD_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    steps:
      # Deliberately no `ref:` override. Under `pull_request_target`,
      # `actions/checkout` with no `ref:` checks out `github.sha` — the base
      # repository's own default-branch tip that triggered evaluation of
      # this workflow file — never the PR's branch or head. That is what
      # makes it safe to read an untrusted PR's diff below without ever
      # executing the PR's own code; the only thing checked out here is
      # main's own judge-path-floor.sh and its self-test.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Derive the path-matched floor
        id: floor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Self-tested before it is trusted on a real PR, same idiom as
          # detect-app-changes/action.yml: a classifier broken by an edit
          # fails this run with a clear reason instead of quietly
          # misjudging every PR after it.
          bash .github/scripts/judge-path-floor.self-test.sh

          # `gh pr diff --name-only`, not a local `git diff`: it is the PR's
          # own diff by GitHub's own definition, needs no merge-base and no
          # git history, and this checkout has neither — judge.yml's
          # `select` step picks the same tool for the same reason.
          changed="$(gh pr diff "$PR_NUMBER" --name-only)"
          agents="$(printf '%s\n' "$changed" | bash .github/scripts/judge-path-floor.sh)"

          printf '%s\n' "$changed" > /tmp/guard-changed-paths.txt
          gh pr diff "$PR_NUMBER" > /tmp/guard-diff.txt

          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          if [ -n "$agents" ]; then
            echo "::notice::floor matched: $agents"
          else
            echo "::notice::floor matched no agent; asking the picker about shared code"
          fi

      # ENG-11591: the picker always runs, floor or not — the dominant case
      # it exists for (80 of 208 merged agent-code changes from Sep 29 to
      # Oct 29 touched only shared code) is exactly the one where the floor
      # found nothing. It is a cents-scale call (TDD "Guard: judge agent PRs
      # automatically"), so there is no cheaper gate worth adding on top.
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: packages/gp-api
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api

      # `continue-on-error`, same as judge.yml's own credentials step for the
      # live sweep: a bucket this run could not reach must cost the picker
      # its failure-ledger write and alert, never the whole guard run (see
      # runPicker.ts's try/catch around that bookkeeping).
      - name: Get credentials for the guard picker's S3 ledger
        id: judge_credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-judge-sweep
          role-session-name: judge-guard-picker-${{ github.run_id }}
          aws-region: us-west-2

      - name: Run the picker
        id: picker
        env:
          GUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
          GUARD_RUN_ID: ${{ github.run_id }}
          GUARD_CHANGED_PATHS_FILE: /tmp/guard-changed-paths.txt
          GUARD_DIFF_FILE: /tmp/guard-diff.txt
          GUARD_FLOOR: ${{ steps.floor.outputs.agents }}
          # Same bucket judge.yml's live sweep writes records to (its own
          # "Choose where records are kept" step) — one judge records bucket,
          # guard ledger lines under their own `guard/` prefix.
          JUDGE_RECORDS_BUCKET: gp-agent-artifacts-dev
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # LlmService's constructor throws before `models: [PICKER_MODEL]`
          # is ever read if this is unset (runPickerCli.ts's own comment);
          # the CLI also defaults it, but set it here so this step never
          # relies on that second line of defense.
          AI_MODELS: claude-sonnet-4-6
          SLACK_APP_BOT_TOKEN: ${{ secrets.SLACK_APP_BOT_TOKEN }}
          SLACK_BOT_DEV_CHANNEL_ID: ${{ secrets.SLACK_BOT_DEV_CHANNEL_ID }}
        working-directory: packages/gp-api
        run: npx tsx src/chats/evals/judge/guard/runPickerCli.ts

      - name: Post the guard check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ steps.picker.outputs.check_title }}
          SUMMARY: ${{ steps.picker.outputs.check_summary }}
          CONCLUSION: ${{ steps.picker.outputs.check_conclusion }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            --arg conclusion "$CONCLUSION" \
            '{
              name: "Universal judge (shadow)",
              head_sha: $sha,
              status: "completed",
              conclusion: $conclusion,
              output: { title: $title, summary: $summary }
            }' | gh api --method POST "repos/$GH_REPO/check-runs" --input -

      # One comment per PR, upserted by marker+author the same way judge.yml
      # upserts its own plan comment — so repeated pushes update one comment
      # rather than piling one on per push. Only posted when the final agent
      # set is non-empty, per judge-request.yml's noise argument: a PR that
      # reaches no agent (floor or picker) already gets a quiet check only.
      - name: Upsert the guard comment
        if: steps.picker.outputs.final_agents != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FINAL_AGENTS: ${{ steps.picker.outputs.final_agents }}
          SUMMARY: ${{ steps.picker.outputs.check_summary }}
        with:
          script: |
            const marker = '<!-- universal-judge-guard -->'
            const issue_number = context.payload.pull_request.number
            const body = [
              marker,
              '## Universal judge guard (shadow)',
              '',
              `**Agents reached:** \`${process.env.FINAL_AGENTS}\``,
              '',
              process.env.SUMMARY,
            ].join('\n')

            const existing = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number, per_page: 100 },
            )
            // Author first, marker second — same reasoning as judge.yml's own
            // upsert: anyone can post this marker on a public repo, and this
            // token can edit any user's comment, so matching the marker alone
            // would adopt a stranger's comment.
            const mine = existing.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            )

            const post = async (call, args) => {
              try {
                await call({ ...context.repo, ...args })
              } catch (err) {
                if (err.status !== 403) throw err
                core.warning(
                  `could not comment on #${issue_number} (HTTP 403 — the conversation ` +
                    'is most likely locked).',
                )
              }
            }

            if (mine) {
              await post(github.rest.issues.updateComment, { comment_id: mine.id, body })
            } else {
              await post(github.rest.issues.createComment, { issue_number, body })
            }
