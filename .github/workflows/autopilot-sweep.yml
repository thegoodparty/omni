name: autopilot reconciliation sweep

# Trigger for the autopilot conductor Lambda's reconciliation sweep, which
# finds transitions no ClickUp webhook ever delivered and drives every
# in-progress epic's supervisor. See the module docstring in
# packages/gp-ai/autopilot/lambda/sweep.py for why a poller is needed at all
# (a suspended webhook stops delivering silently; a card whose tag/status
# both change in one write can suppress the delta event) and for why the
# supervisor needs its own continuous tick independent of any single
# transition.
#
# WHY THE SCHEDULE IS HERE AND NOT IN TERRAFORM: the deploy role
# (github-actions-pulumi-deploy) grants lambda:* but no `events:` action at
# all, so an aws_cloudwatch_event_rule cannot be applied — it fails
# AccessDenied and takes the whole prod/autopilot apply down with it.
# Invoking the function directly needs nothing the deploy role does not
# already have. See the equivalent comment in
# packages/gp-ai/infrastructure/modules/clickup-bot/main.tf (this workflow
# is a straight copy of .github/workflows/gpbot-sweep.yml, renamed for the
# autopilot conductor's own function and payload shape) for how to move it
# back once the deploy role is widened.
#
# The work is entirely the Lambda's. This workflow decides *when*, nothing
# else, so a bad run here can at worst skip or repeat a sweep — and
# repeating one is a no-op, because every candidate goes through the same
# dedup claim the webhook path uses.

on:
  schedule:
    # Every 15 minutes, which bounds how late a webhook-dropped transition is
    # picked up. GitHub's cron is best-effort and does run late under load;
    # that is tolerable precisely because this is a backstop with its own
    # lookback window, not the primary path. The webhook still delivers most
    # work in seconds.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Never two sweeps at once. Overlap would be survivable — the Lambda's
  # dedup claims decline the duplicates — but a queued backlog of sweeps
  # waiting on a slow one has no value: the next scheduled run covers the
  # same window.
  group: autopilot-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep for undelivered transitions
    runs-on: ubuntu-latest
    # Bounds a stall, which the concurrency group above would otherwise turn
    # into an outage: cancel-in-progress is false, so a job hung on OIDC or a
    # dark Lambda control plane holds the slot for GitHub's default six hours
    # and every sweep behind it waits. Ten minutes rather than the Lambda
    # ceiling of fifteen because this function's own timeout is 120s —
    # anything past a couple of minutes here is already a stuck runner, not
    # a slow sweep, and the sooner that surfaces the sooner the backstop is
    # working again.
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Invoke the sweep
        env:
          FUNCTION_NAME: autopilot-conductor-prod
        run: |
          set -euo pipefail

          # RequestResponse, not Event: the point of running this in CI
          # rather than on a timer inside AWS is that the outcome shows up
          # in a place someone already looks. A fire-and-forget invoke would
          # make every run green regardless of what happened.
          #
          # --cli-binary-format is stated rather than left to the default,
          # and the failure it prevents is total: CLI v2 defaults blob
          # inputs to base64, so a raw --payload is rejected outright with
          # `Invalid base64` (verified against 2.35.1). The alternative
          # spelling -- pre-encoding the JSON with `base64` and relying on
          # that default -- works today but silently sends the *encoded
          # string* as the event if a runner ever sets raw-in-base64-out in
          # config or AWS_CLI_* env, and a sweep whose event is a string
          # takes the webhook path and 401s. Saying which format this
          # payload is in leaves neither reading open.
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"autopilot_sweep": true}' \
            --cli-read-timeout 300 \
            /tmp/sweep-response.json > /tmp/sweep-meta.json

          echo "--- invoke metadata ---"
          cat /tmp/sweep-meta.json
          echo
          echo "--- handler response ---"
          cat /tmp/sweep-response.json
          echo

          # A handled exception inside the function still returns HTTP 200
          # with FunctionError set. Checking only the status code would
          # report a crashed sweep as a successful one.
          if grep -q '"FunctionError"' /tmp/sweep-meta.json; then
            echo "::error::Sweep invocation failed inside the function"
            exit 1
          fi

          # The handler answers 500 when it could not list ClickUp tasks,
          # which means this pass rescued nothing. Failing here is the whole
          # reason this job is not fire-and-forget: a sweep that silently
          # stops working returns us to dropping work with nothing to show
          # for it.
          status=$(jq -r '.statusCode // empty' /tmp/sweep-response.json)
          if [ "$status" != "200" ]; then
            echo "::error::Sweep returned statusCode=${status:-<none>}"
            exit 1
          fi

          jq -r '.body | fromjson
                 | "ticked=\(.ticked) scanned=\(.scanned) triggered=\(.triggered)"' \
            /tmp/sweep-response.json >> "$GITHUB_STEP_SUMMARY"
