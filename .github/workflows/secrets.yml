name: secrets

# Guards the write-only secret pipeline (docs/secrets.md).
#
# This workflow has NO AWS credentials and no `id-token` permission, on purpose.
# A PR-time job holding kms:Decrypt would be a read path into every secret, and
# a PR can edit the workflow that runs it — so validation is restricted to what
# is checkable from a ciphertext's shape. The only real decrypt happens in the
# release train, under a dedicated role, after merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate secret files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Catches a committed plaintext, a truncated ciphertext, a malformed
      # envelope, and stray files dropped into secrets/.
      - name: Validate secret files
        run: bash scripts/secrets/validate-secret-files.sh

      # The pipeline's only test coverage. It stubs the `aws` CLI and drives the
      # real encrypt/validate/sync scripts against a throwaway RSA-4096 keypair,
      # so a regression fails here rather than half-way through writing a prod
      # secret on the release train.
      - name: Self-test the secret pipeline
        run: bash scripts/secrets/secret-selftest.sh

      # The sync script never runs under `set -x` and never prints a value, but
      # shellcheck is what catches the next edit that would.
      - name: Shellcheck
        run: shellcheck -S warning scripts/secrets/*.sh
