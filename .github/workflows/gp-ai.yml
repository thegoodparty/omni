name: gp-ai

# Deliberately NO workflow-level path filter. promote.yml gates on workflow-run
# conclusions, and a path-filtered workflow produces no run at all for unrelated
# commits — which would force it into the awkward "gate only if a run exists"
# bucket. Instead this always runs and gates internally on the `changes` job, so
# a commit that doesn't touch packages/gp-ai costs one ~10s job and still yields
# a run concluding `success`. Same shape as gp-api.yml always running.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gp-ai-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: gp-ai-projects
  SUBTREE: packages/gp-ai

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.filter.outputs.any }}
      python: ${{ steps.filter.outputs.python }}
      infra: ${{ steps.filter.outputs.infra }}
      services: ${{ steps.services.outputs.list }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            any:
              - 'packages/gp-ai/**'
              - '.github/workflows/gp-ai.yml'
            infra:
              - 'packages/gp-ai/infrastructure/**'
              - '.github/workflows/gp-ai.yml'
            python:
              - 'packages/gp-ai/**/*.py'
              - 'packages/gp-ai/pyproject.toml'
              - 'packages/gp-ai/uv.lock'
              - 'packages/gp-ai/Makefile'
              - '.github/workflows/gp-ai.yml'
            broker:
              - 'packages/gp-ai/broker/**'
              - 'packages/gp-ai/pyproject.toml'
              - 'packages/gp-ai/uv.lock'
            pmf-engine:
              - 'packages/gp-ai/pmf_engine/**'
              - 'packages/gp-ai/shared/**'
              - 'packages/gp-ai/pyproject.toml'
              - 'packages/gp-ai/uv.lock'
            serve-analyze:
              - 'packages/gp-ai/serve/v1_pipeline/**'
              - 'packages/gp-ai/serve/hierarchical_discovery/**'
              - 'packages/gp-ai/shared/**'
              - 'packages/gp-ai/pyproject.toml'
              - 'packages/gp-ai/uv.lock'
            ddhq-matcher:
              - 'packages/gp-ai/hubspot_ddhq_match/**'
              - 'packages/gp-ai/shared/**'
              - 'packages/gp-ai/pyproject.toml'
              - 'packages/gp-ai/uv.lock'
            engineer-agent:
              - 'packages/gp-ai/engineer_agent/**'
              - 'packages/gp-ai/shared/**'
              - 'packages/gp-ai/pyproject.toml'
              - 'packages/gp-ai/uv.lock'

      # Collapse the per-service booleans into a JSON array the build matrix
      # consumes, so only changed services get a build job. An empty array
      # skips the build job entirely rather than running a no-op matrix.
      # On a main push EVERY service is built, not just the changed ones.
      # deploy-dev pins terraform to <service>-<sha>, so every service needs an
      # image at THIS commit; building only the changed ones would point the
      # others at a tag that was never pushed. ECS would fail to pull it, the
      # circuit breaker would roll back, and the deploy verification would fail
      # on every infra-only merge.
      #
      # Unchanged services are near-total cache hits (~20-30s each), so the cost
      # of this is small. PRs keep per-service filtering, where the point is fast
      # feedback and nothing is deployed.
      - name: Build service matrix
        id: services
        env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
          ALL: ${{ github.event_name == 'push' && github.ref_name == 'main' && steps.filter.outputs.any == 'true' }}
        run: |
          set -euo pipefail
          all='["broker","pmf-engine","serve-analyze","ddhq-matcher","engineer-agent"]'
          if [ "$ALL" = "true" ]; then
            list="$all"
            echo "main push: building all services so every one has an image at this SHA"
          else
            list='[]'
            for s in broker pmf-engine serve-analyze ddhq-matcher engineer-agent; do
              if [ "$(jq -r --arg s "$s" '.[$s] // "false"' <<<"$FILTERS")" = "true" ]; then
                list=$(jq -c --arg s "$s" '. + [$s]' <<<"$list")
              fi
            done
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Services to build: $list"

  validate:
    name: Validate
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gp-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      # --all-packages is load-bearing: `uv sync` at a workspace root installs
      # ONLY the root project's deps, not the members'. Without it broker's
      # playwright dep is missing and 11 tests fail with ModuleNotFoundError.
      - name: Install deps
        run: uv sync --frozen --all-packages --all-extras

      # Scope is set by extend-exclude in pyproject.toml, not here — so a local
      # `make lint` checks exactly what CI checks.
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # `make test` owns the suite list (TEST_PATHS) so CI and local runs cannot
      # drift. There is no repo-root tests/ directory.
      - name: Test
        run: make test

      # mypy is NOT a gate. It reports ~895 errors across the deployed members
      # (419 in shared alone) and none are auto-fixable, so there is no scope at
      # which it could pass today. Running it advisory-only keeps the signal
      # visible in the log without a check that can never go green. Promote it
      # to a real step, member by member, as the debt is paid down.
      - name: Type check (advisory, non-blocking)
        continue-on-error: true
        run: uv run mypy serve/v1_pipeline/ shared/

  build:
    name: Build ${{ matrix.service }}
    # Must wait on validate, not just changes. This job pushes ECR tags and
    # force-redeploys broker-dev on main, so running it in parallel with
    # validate would let a failing lint/test still land an image on dev — the
    # aggregation gate failing afterwards does not un-deploy it. Mirrors
    # gp-api.yml, where deploy needs validate.
    #
    # `skipped` is an allowed validate result: a Dockerfile-only change trips
    # no Python filter, so validate legitimately does not run. Only `failure`
    # and `cancelled` block the build.
    needs: [changes, validate]
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.services != '[]'
      && needs.validate.result != 'failure'
      && needs.validate.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve Dockerfile
        id: df
        run: |
          case "${{ matrix.service }}" in
            broker)         echo "file=packages/gp-ai/broker/Dockerfile" ;;
            pmf-engine)     echo "file=packages/gp-ai/pmf_engine/Dockerfile" ;;
            serve-analyze)  echo "file=packages/gp-ai/serve/v1_pipeline/Dockerfile" ;;
            ddhq-matcher)   echo "file=packages/gp-ai/hubspot_ddhq_match/deployment/Dockerfile" ;;
            engineer-agent) echo "file=packages/gp-ai/engineer_agent/Dockerfile" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build on PRs too (catches a broken Dockerfile before merge) but only
      # push from main — a PR pushing SHA tags would litter ECR with images for
      # commits that never land.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # context is the subtree, not the repo root: every COPY in these
          # Dockerfiles was written relative to the old repo root. Widening it
          # to '.' would both break those COPYs and drag all of omni into the
          # build.
          context: packages/gp-ai
          file: ${{ steps.df.outputs.file }}
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          # SHA-tagged and immutable — the only tag written. The mutable
          # <service>-dev tag is gone: terraform now pins the exact SHA, so a
          # moving tag would just be a second, lying source of truth.
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha,scope=gp-ai-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=gp-ai-${{ matrix.service }}
          provenance: false

  # Plans every dev root and posts one consolidated comment. PR-only: this shows
  # a reviewer what an apply would do, and nothing here applies anything.
  #
  # ONE job, not an 11-job matrix. Each root is a `background: true` step, so all
  # 11 plan concurrently on a single runner and cost a single concurrency slot
  # against the org's 60. That works because terraform init/plan is I/O-bound —
  # it spends nearly all its time blocked on S3 and the AWS APIs — so 11 of them
  # on one runner barely contend. (Do NOT copy this pattern for the image builds:
  # those are QEMU-emulated arm64 and genuinely CPU-bound.)
  #
  # Only dev is planned. dev and prod share module code, so the dev plan is the
  # review signal; planning prod too would double the work for near-zero added
  # information and would read AI_SECRETS_PROD on every infra PR.
  terraform-plan:
    name: TF plan (dev)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PLAN_DIR: /tmp/tfplans
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1.15.x, not 1.9.x: the S3 backends set `use_lockfile = true`, which needs
      # Terraform >= 1.10. Pinned to the version these plans were verified with.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Both artifacts are consumed at PLAN time (archive_file / filebase64sha256),
      # not just at apply, so they must exist before any plan runs.
      - name: Build pmf-engine lambda package
        working-directory: packages/gp-ai
        run: bash pmf_engine/scripts/build_lambda_package.sh

      - name: Build serve-analyze lambda trigger
        working-directory: packages/gp-ai/infrastructure/modules/serve-analyze-fargate/lambda-trigger
        run: |
          npm ci
          npm run build

      # Each of these records its result to files and always exits 0. `wait-all`
      # short-circuits everything after it if any background step fails, and we
      # want the comment posted even when a root errors — so the assemble step
      # below owns the pass/fail decision.
      - name: plan dev/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/agent-experiment-metadata
      - name: plan dev/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/agent-run-inputs
      - name: plan dev/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/broker broker-${{ github.sha }}
      - name: plan dev/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/campaign-plan-lambda
      - name: plan dev/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/ddhq-matcher-fargate ddhq-matcher-${{ github.sha }}
      - name: plan dev/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/engineer-agent-fargate engineer-agent-${{ github.sha }}
      - name: plan dev/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-engine-control-plane
      - name: plan dev/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-engine-fargate pmf-engine-${{ github.sha }}
      - name: plan dev/pmf-vpc-endpoints
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-vpc-endpoints
      - name: plan dev/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/serve-analyze-fargate serve-analyze-${{ github.sha }}
      - name: plan dev/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/shared-infra

      - wait-all:

      - name: Post consolidated plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const dir = process.env.PLAN_DIR
            // GitHub rejects an issue comment body over 65536 chars. The budget
            // has to be shared across ALL embedded plans, not applied per plan —
            // four 55k plans would produce a 220k body and a hard API failure.
            const MAX_BODY = 60000

            // Expected roots come from the filesystem, NOT from whatever happened
            // to land in PLAN_DIR. Trusting PLAN_DIR means a run where every plan
            // step died before writing output reports "0 roots" and exits GREEN —
            // a gate that passes because nothing was checked. Deriving the list
            // also catches the inverse: a new environments/dev/<root> directory
            // that nobody added a background step for.
            const envDir = 'packages/gp-ai/infrastructure/environments/dev'
            const expected = fs.readdirSync(envDir, { withFileTypes: true })
              .filter(d => d.isDirectory()).map(d => `dev-${d.name}`).sort()

            let produced = []
            try {
              produced = fs.readdirSync(dir).filter(f => f.endsWith('.code'))
                .map(f => f.replace(/\.code$/, ''))
            } catch (e) {
              core.setFailed(`plan output dir ${dir} unreadable (${e.code}); every plan step failed before writing output`)
              return
            }
            const missing = expected.filter(r => !produced.includes(r))
            const roots = expected

            const rows = roots.map(slug => {
              const read = ext => { try { return fs.readFileSync(`${dir}/${slug}.${ext}`, 'utf8').trim() } catch { return '' } }
              const code = read('code')
              return {
                slug,
                code: code === '' ? 'missing' : code,
                text: code === '' ? 'No plan output was produced for this root. Its background step did not run, or died before writing a result.' : read('txt'),
                destroys: parseInt(read('destroy') || '0', 10),
                replaces: parseInt(read('replace') || '0', 10),
              }
            })

            const errored = rows.filter(r => r.code !== '0' && r.code !== '2')
            const changed = rows.filter(r => r.code === '2')
            const destroying = rows.filter(r => r.destroys > 0)
            const replacing = rows.filter(r => r.replaces > 0)

            const label = r => {
              if (r.code === '0') return 'no changes'
              if (r.code === 'missing') return '**no result**'
              if (r.code !== '2') return '**error**'
              const bits = []
              if (r.destroys) bits.push(`**${r.destroys} to destroy**`)
              if (r.replaces) bits.push(`**${r.replaces} to replace**`)
              return bits.length ? bits.join(', ') : 'changes'
            }

            let head = `### Terraform plan — dev (${rows.length} roots)\n\n`
            head += `${changed.length} with changes, ${rows.length - changed.length - errored.length} clean`
            head += errored.length ? `, **${errored.length} errored**\n\n` : `\n\n`
            if (destroying.length || replacing.length) {
              head += `> [!WARNING]\n> This plan would `
              head += [destroying.length && 'destroy', replacing.length && 'replace'].filter(Boolean).join(' and ')
              head += ` resources. Neither is applied automatically — an operator must review and apply by hand.\n\n`
            }
            head += `| root | result |\n| --- | --- |\n`
            for (const r of rows) head += `| \`${r.slug.replace(/^dev-/, '')}\` | ${label(r)} |\n`

            // Share the remaining budget evenly across the plans worth showing,
            // errors first so a failure is never the thing that gets dropped.
            const show = [...errored, ...changed.filter(r => !errored.includes(r))]
            let body = head
            if (show.length) {
              const perPlan = Math.max(2000, Math.floor((MAX_BODY - head.length) / show.length) - 200)
              for (const r of show) {
                const t = r.text.length > perPlan
                  ? `…truncated, see the job log for the full plan…\n` + r.text.slice(-perPlan)
                  : r.text
                const block = `\n<details><summary><code>${r.slug}</code></summary>\n\n\`\`\`terraform\n${t}\n\`\`\`\n\n</details>\n`
                if (body.length + block.length > MAX_BODY) {
                  body += `\n_Remaining plans omitted to stay under GitHub's comment size limit; see the job log._\n`
                  break
                }
                body += block
              }
            }

            // Must paginate. listComments returns oldest-first, 100 per page, so
            // on a long-running PR the marker comment falls off page 1 and the
            // upsert silently degrades into "post a new comment every push" —
            // which then adds comments and makes itself worse.
            const marker = '<!-- gp-ai-tf-plan -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            })
            const existing = comments.find(c => c.body?.includes(marker))
            const payload = { owner: context.repo.owner, repo: context.repo.repo, body: `${marker}\n${body}` }
            if (existing) await github.rest.issues.updateComment({ ...payload, comment_id: existing.id })
            else await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number })

            core.info(`comment body: ${body.length} chars (limit ${MAX_BODY})`)
            if (missing.length) {
              core.setFailed(`no plan output for: ${missing.join(', ')} — these roots exist under ${envDir} but produced no result`)
            } else if (errored.length) {
              core.setFailed(`terraform plan failed for: ${errored.map(r => r.slug).join(', ')}`)
            }

  # Applies every dev root, then proves the deploy actually took.
  #
  # Parallel, NOT ordered. The roots read each other's terraform_remote_state and
  # that graph is CYCLIC — broker <-> pmf-engine-control-plane <-> pmf-engine-fargate
  # all read each other — so no topological order exists and sequencing would be
  # false comfort. Every root applies concurrently and the convergence check
  # below catches a stale cross-root read: if an apply consumed a value another
  # apply then changed, the re-plan is not clean and this job fails rather than
  # leaving dev half-converged.
  deploy-dev:
    name: Deploy dev
    needs: [changes, validate, build]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref_name == 'main'
      && needs.changes.result == 'success'
      && needs.changes.outputs.any == 'true'
      && needs.validate.result != 'failure'
      && needs.validate.result != 'cancelled'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gp-ai-deploy-dev
      cancel-in-progress: false
    env:
      APPLY_DIR: /tmp/tfapply
      PLAN_DIR: /tmp/tfplans
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Build pmf-engine lambda package
        working-directory: packages/gp-ai
        run: bash pmf_engine/scripts/build_lambda_package.sh

      - name: Build serve-analyze lambda trigger
        working-directory: packages/gp-ai/infrastructure/modules/serve-analyze-fargate/lambda-trigger
        run: |
          npm ci
          npm run build

      # Unlike the plan steps, these exit NON-zero on failure, so wait-all
      # short-circuits and a failed apply stops the verification that follows
      # instead of letting it report success.
      - name: apply dev/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/agent-experiment-metadata
      - name: apply dev/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/agent-run-inputs
      - name: apply dev/pmf-vpc-endpoints
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/pmf-vpc-endpoints
      - name: apply dev/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/campaign-plan-lambda
      - name: apply dev/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/pmf-engine-control-plane
      - name: apply dev/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/broker broker-${{ github.sha }}
      - name: apply dev/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/pmf-engine-fargate pmf-engine-${{ github.sha }}
      - name: apply dev/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/serve-analyze-fargate serve-analyze-${{ github.sha }}
      - name: apply dev/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/ddhq-matcher-fargate ddhq-matcher-${{ github.sha }}
      - name: apply dev/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/engineer-agent-fargate engineer-agent-${{ github.sha }}
      - name: apply dev/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/shared-infra

      - wait-all:

      # After applying, every root must plan clean. A non-clean re-plan means an
      # apply consumed a value another apply then changed — the exact failure the
      # cyclic remote_state graph allows.
      - name: reverify dev/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/agent-experiment-metadata
      - name: reverify dev/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/agent-run-inputs
      - name: reverify dev/pmf-vpc-endpoints
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-vpc-endpoints
      - name: reverify dev/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/campaign-plan-lambda
      - name: reverify dev/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-engine-control-plane
      - name: reverify dev/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/broker broker-${{ github.sha }}
      - name: reverify dev/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-engine-fargate pmf-engine-${{ github.sha }}
      - name: reverify dev/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/serve-analyze-fargate serve-analyze-${{ github.sha }}
      - name: reverify dev/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/ddhq-matcher-fargate ddhq-matcher-${{ github.sha }}
      - name: reverify dev/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/engineer-agent-fargate engineer-agent-${{ github.sha }}
      - name: reverify dev/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/shared-infra

      - wait-all:

      - name: Convergence check
        run: |
          set -uo pipefail
          bad=0
          shopt -s nullglob
          files=("$PLAN_DIR"/*.code)
          # Expected count comes from the filesystem, not a hardcoded number, so
          # adding a root without adding its reverify step is caught here.
          # ci-plan-root.sh always exits 0 by design, so wait-all succeeding only
          # proves the scripts ran — not that each wrote its result. A process
          # killed between plan and write (OOM, step timeout) would otherwise be
          # silently skipped and reported as "all 10 converged".
          expected=$(find packages/gp-ai/infrastructure/environments/dev -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::expected $expected re-plan results but found ${#files[@]}; a root produced no output and its convergence is unknown"
            for f in "${files[@]}"; do echo "  got: $(basename "$f" .code)"; done
            exit 1
          fi
          for f in "${files[@]}"; do
            root=$(basename "$f" .code)
            code=$(cat "$f")
            if [ "$code" != "0" ]; then
              echo "::error::$root did not converge (plan exit $code after apply)"
              tail -40 "$PLAN_DIR/$root.txt" || true
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "all ${#files[@]} roots converged (expected $expected)"

      # A successful apply is NOT proof the code is running: broker's
      # deployment_circuit_breaker rolls a crash-on-boot image back, the service
      # settles on the OLD revision, and the apply still reports success. This
      # reads what is actually deployed.
      - name: Verify dev is running this commit
        run: bash packages/gp-ai/infrastructure/scripts/ci-verify-deployed.sh dev ${{ github.sha }}

  # Stable aggregation gate. Branch protection and promote.yml want one name
  # whose meaning doesn't change as jobs fan in and out. `skipped` is a
  # legitimate pass here (the commit didn't touch this subtree); `failure` and
  # `cancelled` are not.
  gate:
    name: gp-ai
    needs: [changes, validate, build, terraform-plan, deploy-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check needed jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
          TF_PLAN: ${{ needs['terraform-plan'].result }}
          DEPLOY: ${{ needs['deploy-dev'].result }}
        run: |
          set -euo pipefail
          # `changes` has no `if`, so it always runs — anything other than
          # success means change detection never completed, and validate/build
          # were skipped for the wrong reason. Without this the gate would read
          # those skips as "nothing to do" and go green on a broken run.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::gp-ai changes concluded '$CHANGES'; cannot trust the skip decisions below"
            exit 1
          fi
          failed=0
          for pair in "validate:$VALIDATE" "build:$BUILD" "terraform-plan:$TF_PLAN" "deploy-dev:$DEPLOY"; do
            name=${pair%%:*}
            result=${pair#*:}
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *) echo "::error::gp-ai $name concluded '$result'"; failed=1 ;;
            esac
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "gp-ai checks satisfied"
