name: Vercel cleanup preview

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *'

concurrency:
  group: vercel-cleanup-preview
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # VERCEL_TOKEN lives only in the production environment. The preview
    # token's Developer role is not known to be able to delete deployments.
    # deployment: false keeps this job out of the production deployment
    # history that release.yml writes.
    environment:
      name: production
      deployment: false
    steps:
      - name: Delete previews of closed PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PROJECTS: >-
            ${{ vars.VERCEL_PROJECT_ID_GP_WEBAPP }}
            ${{ vars.VERCEL_PROJECT_ID_GP_ADMIN }}
            ${{ vars.VERCEL_PROJECT_ID_CANDIDATE_SITES }}
        with:
          script: |
            const api = (path, init = {}) =>
              fetch(
                `https://api.vercel.com${path}${path.includes('?') ? '&' : '?'}teamId=${process.env.VERCEL_ORG_ID}`,
                {
                  ...init,
                  headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
                },
              )

            // Retention deletes every preview after 30 days, so only newer
            // ones can still be waiting on this job.
            const since = Date.now() - 31 * 24 * 60 * 60 * 1000
            const closed = new Map()
            const isClosed = async (pr) => {
              if (!closed.has(pr)) {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr,
                })
                closed.set(pr, data.state === 'closed')
              }
              return closed.get(pr)
            }

            let deleted = 0
            for (const project of process.env.PROJECTS.split(/\s+/).filter(Boolean)) {
              const stale = []
              let until
              do {
                const res = await api(
                  `/v6/deployments?projectId=${project}&target=preview&since=${since}&limit=100${until ? `&until=${until}` : ''}`,
                )
                if (!res.ok) throw new Error(`List ${project}: ${res.status} ${await res.text()}`)
                const body = await res.json()
                for (const d of body.deployments) {
                  const pr = Number(d.meta?.prNumber)
                  if (pr && (await isClosed(pr))) stale.push(d)
                }
                until = body.pagination?.next
              } while (until)

              for (const d of stale) {
                const res = await api(`/v13/deployments/${d.uid}`, { method: 'DELETE' })
                // Vercel caps deployment deletes per window; the next run
                // picks up whatever is left.
                if (res.status === 429) {
                  core.warning(`Rate limited after ${deleted} deletes; the next run continues`)
                  await core.summary.addRaw(`Deleted ${deleted} previews of closed PRs (rate limited)`).write()
                  return
                }
                if (!res.ok && res.status !== 404) {
                  throw new Error(`Delete ${d.url}: ${res.status} ${await res.text()}`)
                }
                deleted++
              }
            }
            await core.summary.addRaw(`Deleted ${deleted} previews of closed PRs`).write()
