name: people-api

on:
  pull_request:
    branches-ignore: [qa, master]
  push:
    branches: [develop, qa, master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: people-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/people-api:${{ github.sha }}
  WORKSPACE: packages/people-api

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: people-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:people-api

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Typecheck
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc --noEmit

      # The Pulumi program under deploy/ is excluded from the main tsconfig and
      # is only otherwise compiled at deploy time — this catches type errors in
      # it before they reach the (irreversible) Deploy step.
      - name: Typecheck deploy
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc -p tsconfig.deploy.json

      - name: Test
        run: npm run test -w ${{ env.WORKSPACE }}

  # people-api has only dev/prod environments (no qa stack), so it deploys on
  # develop -> dev and master -> prod. A qa branch push is intentionally a
  # no-op here.
  deploy:
    name: Deploy
    needs: validate
    if: >-
      github.event_name == 'push'
      && contains(fromJSON('["develop", "master"]'), github.ref_name)
    runs-on: ubuntu-latest
    concurrency:
      group: people-api-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: people-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:people-api

      - name: Determine deployment context
        id: ctx
        run: |
          case "${{ github.ref_name }}" in
            develop)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "astro_external_id=${{ vars.ASTRO_ASSUME_ROLE_EXTERNAL_ID_DEV }}" >> "$GITHUB_OUTPUT" ;;
            master)
              echo "environment=prod" >> "$GITHUB_OUTPUT"
              echo "astro_external_id=${{ vars.ASTRO_ASSUME_ROLE_EXTERNAL_ID_PROD }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable, so a re-run of this job after a successful
      # push would fail trying to overwrite the tag. Same SHA means same
      # source; reuse the existing image and skip the build.
      - name: Check for existing image
        id: ecr-image
        run: |
          if aws ecr describe-images --repository-name people-api \
            --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build application
        if: steps.ecr-image.outputs.exists != 'true'
        run: npm run build -w ${{ env.WORKSPACE }}

      - name: Build and push Docker image
        if: steps.ecr-image.outputs.exists != 'true'
        run: |
          docker build -t "${IMAGE_URI}" -f packages/people-api/deploy/Dockerfile .
          docker push "${IMAGE_URI}"

      - name: Deploy (Pulumi)
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: ${{ env.WORKSPACE }}/deploy
          command: ./deploy.sh ${{ steps.ctx.outputs.environment }}
        env:
          ASTRO_ASSUME_ROLE_EXTERNAL_ID: ${{ steps.ctx.outputs.astro_external_id }}
