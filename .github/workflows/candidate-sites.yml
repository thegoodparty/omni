name: candidate-sites

on:
  pull_request:
    paths:
      - "packages/candidate-sites/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/candidate-sites.yml"
      - ".github/actions/**"
  push:
    branches: [develop, qa, master]
    paths:
      - "packages/candidate-sites/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/candidate-sites.yml"
      - ".github/actions/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: candidate-sites-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKSPACE: packages/candidate-sites

jobs:
  ci:
    name: Lint / Format / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: candidate-sites

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Format check
        run: npm run format -w ${{ env.WORKSPACE }}

      - name: Build smoke
        run: npm run build -w ${{ env.WORKSPACE }}

  deploy:
    name: Vercel deploy
    needs: ci
    if: >-
      vars.ENABLE_OMNI_VERCEL_DEPLOYS == 'true'
      && github.event_name == 'push'
      && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: candidate-sites

      # candidate-sites has no stable dev/qa domain (production fronts the
      # per-candidate custom domains), so develop/qa deploy to the preview
      # target with branch-scoped env vars and surface the generated URL;
      # master deploys to production.
      - name: Resolve deploy target
        id: ctx
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              develop)
                echo "target=preview" >> "$GITHUB_OUTPUT"
                echo "branch=develop" >> "$GITHUB_OUTPUT" ;;
              qa)
                echo "target=preview" >> "$GITHUB_OUTPUT"
                echo "branch=qa" >> "$GITHUB_OUTPUT" ;;
              master)
                echo "target=production" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Deploy to Vercel
        id: vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_CANDIDATE_SITES }}
          target: ${{ steps.ctx.outputs.target }}
          git-branch: ${{ steps.ctx.outputs.branch }}
          workspace: ${{ env.WORKSPACE }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.vercel.outputs.url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `candidate-sites Vercel preview: ${url}`
            });
