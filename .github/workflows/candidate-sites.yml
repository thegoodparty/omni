name: candidate-sites

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: candidate-sites-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  WORKSPACE: packages/candidate-sites

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: candidate-sites

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Format check
        run: npm run format -w ${{ env.WORKSPACE }}

      # Type gate was missing: the package has a tsconfig but no typecheck was
      # run in CI (Build smoke has `eslint.ignoreDuringBuilds` and Next does not
      # hard-fail the build on type errors here). Generate Next's route types
      # first, then tsc --noEmit (mirrors gp-webapp's Typecheck app step).
      - name: Next typegen
        working-directory: ${{ env.WORKSPACE }}
        run: npx next typegen

      - name: Typecheck
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc --noEmit

      - name: Build smoke
        run: npm run build -w ${{ env.WORKSPACE }}

  deploy:
    name: Deploy
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push'
          && github.ref_name == 'main')
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: candidate-sites

      # candidate-sites has no stable dev domain (production fronts the
      # per-candidate custom domains), so main deploys to the preview target
      # with branch-scoped env vars and surfaces the generated URL; production
      # is handled by automated promotion (promote.yml).
      - name: Resolve deploy target
        id: ctx
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              main)
                echo "target=preview" >> "$GITHUB_OUTPUT"
                echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Deploy to Vercel
        id: vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_CANDIDATE_SITES }}
          target: ${{ steps.ctx.outputs.target }}
          git-branch: ${{ steps.ctx.outputs.branch }}
          pr-alias: ${{ github.event_name == 'pull_request' && format('candidate-sites-pr-{0}-good-party.vercel.app', github.event.pull_request.number) || '' }}
