name: gp-api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Scoped per-PR only. On main this resolves to github.run_id — unique per run,
# so pushes never serialize here: lint/typecheck/test share no state across
# commits, and a shared group made every merge wait a full CI cycle for the
# previous one before it even checked out. Deploys are still serialized, by the
# deploy job's own gp-api-deploy-<ref> group.
concurrency:
  group: gp-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/gp-api:${{ github.sha }}
  WORKSPACE: packages/gp-api

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      shadow-db:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prisma"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Typecheck
        run: npm run types -w ${{ env.WORKSPACE }}

      # The Pulumi program under deploy/ is excluded from the main tsconfig and
      # is only otherwise compiled (transpile-only, via tsx) at deploy time, so
      # type errors in it never surface until deploy. route-types is generated
      # above by setup-node-workspace, so deploy/ imports of it resolve here.
      - name: Typecheck deploy
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc -p tsconfig.deploy.json

      - name: Check Prisma migrations
        working-directory: ${{ env.WORKSPACE }}
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/schema/migrations \
            --to-schema-datamodel ./prisma/schema \
            --shadow-database-url "postgresql://prisma:prisma@localhost:5432/shadow" \
            --exit-code

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'

      - name: Test
        run: npm run test -w ${{ env.WORKSPACE }} -- --shard=${{ matrix.shard }}/2

  # Empty aggregation gate. The main branch ruleset requires a status check
  # named exactly "Validate"; this job preserves that name while the real work
  # fans out across the checks + sharded test jobs. It is green iff all of its
  # needs succeeded, so it gates merge on Checks plus every Test shard.
  # `if: always()` + the explicit failure step matter: without them a failed
  # need leaves this job SKIPPED, and the ruleset treats a skipped required
  # check as satisfied, so auto-merge lands red PRs.
  validate:
    name: Validate
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.checks.result != 'success' || needs.test.result != 'success'
        run: |
          echo "checks=${{ needs.checks.result }} test=${{ needs.test.result }}"
          exit 1
      - run: echo "checks + all test shards passed"

  # Intentionally no needs: validate — the preview deploy runs in parallel with
  # validation so the webapp e2e (which waits on this job) starts sooner. A
  # preview stack of code that fails validate is acceptable; the PR can't merge.
  preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Keyed on the full preview stack name so deploy, teardown
    # (gp-api-teardown-preview.yml), and the cron cleanup destroy
    # (gp-api-cleanup-preview.yml) all serialize on the same stack and never
    # run concurrent Pulumi operations against it.
    concurrency:
      group: gp-api-preview-gp-api-pr-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable, so a re-run of this job after a successful
      # push would fail trying to overwrite the tag. Same SHA means same
      # source; reuse the existing image and skip the build.
      - name: Check for existing image
        id: ecr-image
        run: |
          if aws ecr describe-images --repository-name gp-api \
            --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build application
        if: steps.ecr-image.outputs.exists != 'true'
        run: npm run build -w ${{ env.WORKSPACE }}

      - name: Set up Docker Buildx
        if: steps.ecr-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.ecr-image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/gp-api/deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_URI }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=gp-api
          cache-to: type=gha,mode=max,scope=gp-api

      - name: Deploy preview stack (Pulumi)
        id: pulumi
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: ${{ env.WORKSPACE }}
          command: |
            npm run infra deploy preview
            cd deploy
            SERVICE_URL=$(pulumi stack output serviceUrl 2>/dev/null || echo "")
            echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
          CANDIDATE_PASSWORD: ${{ secrets.CANDIDATE_PASSWORD }}

      - name: Add preview summary
        if: steps.pulumi.outputs.service_url != ''
        run: echo "gp-api preview deployed to ${{ steps.pulumi.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"
