name: gp-api

on:
  pull_request:
    paths:
      - "packages/gp-api/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gp-api.yml"
      - ".github/actions/**"
  push:
    branches: [develop, qa, master]
    paths:
      - "packages/gp-api/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gp-api.yml"
      - ".github/actions/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: gp-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-west-2
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/gp-api:${{ github.sha }}
  WORKSPACE: packages/gp-api

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      shadow-db:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prisma"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: "true"
          prisma-generate-script: generate:prisma:gp-api
          route-types: "true"

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Typecheck
        run: npm run types -w ${{ env.WORKSPACE }}

      - name: Test
        run: npm run test -w ${{ env.WORKSPACE }} -- --coverage

      - name: Check Prisma migrations
        working-directory: ${{ env.WORKSPACE }}
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/schema/migrations \
            --to-schema-datamodel ./prisma/schema \
            --shadow-database-url "postgresql://prisma:prisma@localhost:5432/shadow" \
            --exit-code

  deploy:
    name: Deploy
    needs: validate
    if: >-
      github.event_name == 'push'
      && contains(fromJSON('["develop", "qa", "master"]'), github.ref_name)
    runs-on: ubuntu-latest
    concurrency:
      group: gp-api-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      environment: ${{ steps.ctx.outputs.environment }}
      service_url: ${{ steps.pulumi.outputs.service_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: "true"
          prisma-generate-script: generate:prisma:gp-api
          route-types: "true"

      - name: Determine deployment context
        id: ctx
        run: |
          case "${{ github.ref_name }}" in
            develop) echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
            qa) echo "environment=qa" >> "$GITHUB_OUTPUT" ;;
            master) echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build application
        run: npm run build -w ${{ env.WORKSPACE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/gp-api/deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_URI }}
          cache-from: type=gha,scope=gp-api
          cache-to: type=gha,mode=max,scope=gp-api

      - name: Deploy (Pulumi)
        id: pulumi
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: ${{ env.WORKSPACE }}
          command: |
            npm run infra deploy ${{ steps.ctx.outputs.environment }}
            cd deploy
            SERVICE_URL=$(pulumi stack output serviceUrl 2>/dev/null || echo "")
            echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Add deploy summary
        if: steps.pulumi.outputs.service_url != ''
        run: echo "gp-api ${{ steps.ctx.outputs.environment }} deployed to ${{ steps.pulumi.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Deploy PR preview
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: gp-api-deploy-pr-${{ github.event.number }}
      cancel-in-progress: false
    outputs:
      environment: dev
      service_url: ${{ steps.pulumi.outputs.service_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: "true"
          prisma-generate-script: generate:prisma:gp-api
          route-types: "true"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build application
        run: npm run build -w ${{ env.WORKSPACE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/gp-api/deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_URI }}
          cache-from: type=gha,scope=gp-api
          cache-to: type=gha,mode=max,scope=gp-api

      - name: Deploy preview stack (Pulumi)
        id: pulumi
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: ${{ env.WORKSPACE }}
          command: |
            npm run infra deploy preview
            cd deploy
            SERVICE_URL=$(pulumi stack output serviceUrl 2>/dev/null || echo "")
            echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
          CANDIDATE_PASSWORD: ${{ secrets.CANDIDATE_PASSWORD }}

      - name: Add preview summary
        if: steps.pulumi.outputs.service_url != ''
        run: echo "gp-api preview deployed to ${{ steps.pulumi.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/3)
    needs: [preview, deploy]
    if: >-
      always()
      && (needs.preview.result == 'success' || needs.deploy.result == 'success')
      && (github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref_name == 'develop'))
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ENVIRONMENT: ${{ needs.preview.outputs.environment || needs.deploy.outputs.environment }}
      API_BASE_URL: ${{ needs.preview.outputs.service_url || needs.deploy.outputs.service_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: "true"
          prisma-generate-script: generate:prisma:gp-api
          route-types: "true"

      - name: Install Playwright browsers
        working-directory: ${{ env.WORKSPACE }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ${{ env.WORKSPACE }}
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
          CANDIDATE_PASSWORD: ${{ secrets.CANDIDATE_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CANDIDATE_ID: ${{ env.ENVIRONMENT == 'qa' && secrets.QA_CANDIDATE_ID || secrets.DEV_CANDIDATE_ID }}
          CAMPAIGN_SLUG: ${{ env.ENVIRONMENT == 'qa' && secrets.QA_CAMPAIGN_SLUG || secrets.DEV_CAMPAIGN_SLUG }}
        run: >-
          npx playwright test
          --config=e2e-tests/playwright.config.ts
          --shard=${{ matrix.shard }}/3
          --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-api-blob-report-${{ matrix.shard }}
          path: ${{ env.WORKSPACE }}/blob-report
          retention-days: 1
          if-no-files-found: ignore

  e2e-merge:
    name: E2E Tests merge
    needs: [preview, deploy, e2e]
    if: >-
      always()
      && (needs.preview.result == 'success' || needs.deploy.result == 'success')
      && (github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref_name == 'develop'))
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.WORKSPACE }}/all-blob-reports
          pattern: gp-api-blob-report-*
          merge-multiple: true

      - name: Merge reports into HTML + JSON
        working-directory: ${{ env.WORKSPACE }}
        run: >-
          npx playwright merge-reports
          --config=e2e-tests/playwright.config.ts
          ./all-blob-reports

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-api-playwright-report-${{ github.sha }}
          path: |
            ${{ env.WORKSPACE }}/e2e-tests/playwright-report
            ${{ env.WORKSPACE }}/e2e-tests/test-results
          if-no-files-found: ignore
