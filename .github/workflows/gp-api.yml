name: gp-api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

# No workflow-level group, deliberately. It was keyed per-PR with cancel off,
# which made a new push wait out the whole previous run — including its
# multi-minute `pulumi up` — before it could even check out. This workflow
# cannot simply flip that to cancel-in-progress either: a workflow-level group
# cancels every job, and killing `preview` mid-Pulumi strands the state lock and
# the stack's ALB (the case destroy-preview-stack retries around).
#
# So concurrency lives on the jobs instead. The cheap ones supersede a
# superseded PR run; `preview` keeps its own group, keyed on the stack it
# mutates, and is never cancelled.

env:
  AWS_REGION: us-west-2
  ECR_REPO: 333022194791.dkr.ecr.us-west-2.amazonaws.com/gp-api
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/gp-api:${{ github.sha }}
  WORKSPACE: packages/gp-api

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # Lint/typecheck/migration-diff share no state across commits, so a
    # superseded PR run is pure waste. On main the key falls back to run_id,
    # which is unique per run — the group never matches, so nothing cancels.
    concurrency:
      group: gp-api-checks-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      shadow-db:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prisma"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'

      - name: Lint
        env:
          # typescript-eslint builds a full type-aware program over
          # `{src,apps,libs,test}/**/*.ts` and peaks right at Node's default
          # ~4GB heap, so whether a run survives is luck rather than a
          # property of the diff: measured locally, `main` itself OOMs at
          # 4096MB and passes at 5120MB, which means every PR has been one
          # file away from exit 134 and the ones that hit it looked like
          # ordinary red. First observed here on run 36821761791.
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Typecheck
        run: npm run types -w ${{ env.WORKSPACE }}

      # The Pulumi program under deploy/ is excluded from the main tsconfig and
      # is only otherwise compiled (transpile-only, via tsx) at deploy time, so
      # type errors in it never surface until deploy. route-types is generated
      # above by setup-node-workspace, so deploy/ imports of it resolve here.
      - name: Typecheck deploy
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc -p tsconfig.deploy.json

      - name: Check env contract
        run: npm run check:env-contract -w ${{ env.WORKSPACE }}

      - name: Check Prisma migrations
        working-directory: ${{ env.WORKSPACE }}
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/schema/migrations \
            --to-schema-datamodel ./prisma/schema \
            --shadow-database-url "postgresql://prisma:prisma@localhost:5432/shadow" \
            --exit-code

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Keyed on the shard as well: a group shared across the matrix would have
    # the two shards cancelling each other on every run.
    concurrency:
      group: gp-api-test-${{ matrix.shard }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'

      - name: Test
        run: npm run test -w ${{ env.WORKSPACE }} -- --shard=${{ matrix.shard }}/2

  # Empty aggregation gate. The main branch ruleset requires a status check
  # named exactly "Validate"; this job preserves that name while the real work
  # fans out across the checks + sharded test jobs. It is green iff all of its
  # needs succeeded, so it gates merge on Checks plus every Test shard.
  # `if: always()` + the explicit failure step matter: without them a failed
  # need leaves this job SKIPPED, and the ruleset treats a skipped required
  # check as satisfied, so auto-merge lands red PRs.
  validate:
    name: Validate
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.checks.result != 'success' || needs.test.result != 'success'
        run: |
          echo "checks=${{ needs.checks.result }} test=${{ needs.test.result }}"
          exit 1
      - run: echo "checks + all test shards passed"

  # Intentionally no needs: validate — the preview deploy runs in parallel with
  # validation so the webapp e2e (which waits on this job) starts sooner. A
  # preview stack of code that fails validate is acceptable; the PR can't merge.
  preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Keyed on the full preview stack name so deploy, teardown
    # (gp-api-teardown-preview.yml), and the cron cleanup destroy
    # (gp-api-cleanup-preview.yml) all serialize on the same stack and never
    # run concurrent Pulumi operations against it.
    #
    # cancel-in-progress stays false even though the check jobs above now
    # cancel. A superseded preview has to be allowed to finish its `pulumi up`:
    # killed mid-operation it leaves a state lock behind, and the stack's ALB
    # sits stranded against the account's ELB quota until the next cron destroy
    # clears the lock and retries.
    concurrency:
      group: gp-api-preview-gp-api-pr-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Base images come from ECR Public. Anonymous pulls there are limited
      # per IP and shared runners hit 429s; logged in, the limit is per
      # account.
      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # ECR tags are immutable, so a re-run of this job after a successful
      # push would fail trying to overwrite the tag. Same SHA means same
      # source; reuse the existing image and skip the build.
      - name: Check for existing image
        id: ecr-image
        run: |
          if aws ecr describe-images --repository-name gp-api \
            --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # SWC emit only. `npm run build` also runs a full `tsc --noEmit`, which
      # took ~80s of this job and changes nothing in dist/. The Checks job
      # already type-checks the same commit and gates merge through Validate,
      # so here it only delayed the preview. Contracts were built by
      # setup-node-workspace above, so `npm run build`'s rebuild is skipped too.
      - name: Build application
        if: steps.ecr-image.outputs.exists != 'true'
        working-directory: ${{ env.WORKSPACE }}
        run: npx nest build

      - name: Set up Docker Buildx
        if: steps.ecr-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          # The runner is thrown away after the job; tearing the builder down
          # cost 10-20s of post-job time for nothing.
          cleanup: false
          driver-opts: |
            image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      # The layer cache lives in ECR, not the GitHub Actions cache. This repo's
      # Actions cache sits over its 10GB cap, so the ~600MB dependency layer was
      # evicted within minutes and most builds reinstalled it from scratch.
      # The tag is keyed on everything the `npm ci` layer depends on. gp-api's
      # tags are immutable, so the first build for a key writes it and every
      # later one only reads it.
      - name: Pick Docker layer cache
        id: docker-cache
        if: steps.ecr-image.outputs.exists != 'true'
        run: |
          TAG="buildcache-${{ hashFiles('package-lock.json', 'package.json', 'packages/gp-api/package.json', 'packages/contracts/package.json', 'packages/nest-common/package.json', 'packages/gp-api/deploy/Dockerfile') }}"
          echo "from=type=registry,ref=${{ env.ECR_REPO }}:$TAG" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name gp-api --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "to=" >> "$GITHUB_OUTPUT"
          else
            echo "to=type=registry,ref=${{ env.ECR_REPO }}:$TAG,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.ecr-image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/gp-api/deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_URI }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: ${{ steps.docker-cache.outputs.from }}
          cache-to: ${{ steps.docker-cache.outputs.to }}

      - name: Deploy preview stack (Pulumi)
        id: pulumi
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: ${{ env.WORKSPACE }}
          command: |
            npm run infra deploy preview
            cd deploy
            SERVICE_URL=$(pulumi stack output serviceUrl 2>/dev/null || echo "")
            echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}

      # This step, not Pulumi, is what waits for the rollout. The preview's ECS
      # service does not wait for steady state (see service.ts): ECS marked a
      # deployment complete ~40s after the new task was already serving, and
      # that lag sat on every preview deploy. Polling the commit the preview
      # reports is the direct signal anyway.
      #
      # It also catches the case Pulumi cannot. Pulumi compares its own resource
      # spec, so after a rollout that never finished, the next `pulumi up` finds
      # nothing to change and exits 0 against a service that never rolled over.
      # Without this step that surfaces ~20m later as a gp-webapp "E2E Wait"
      # failure blaming a deploy that reported green, which sends you
      # re-running the one job that cannot fix it.
      - name: Verify the preview is serving this commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SERVICE_URL: ${{ steps.pulumi.outputs.service_url }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          BASE="${SERVICE_URL:-https://pr-${PR_NUMBER}.preview.goodparty.org}"
          BASE="${BASE%/}"
          echo "Confirming $BASE is serving $EXPECTED_SHA"
          got=""
          # 10 minutes, the same budget Pulumi's steady-state wait had. A
          # first deploy runs every migration before the app starts, so it is
          # the slow case.
          deadline=$((SECONDS + 600))
          i=0
          while [ $SECONDS -lt $deadline ]; do
            i=$((i + 1))
            # --max-time keeps a hung container (accepted TCP, no response) from
            # parking the runner: `|| true` only catches non-zero exits, not a
            # curl that never returns, and this job sets no timeout-minutes.
            got="$(curl -fsS --max-time 8 "$BASE/v1/version" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$got" = "$EXPECTED_SHA" ]; then
              echo "preview serving $EXPECTED_SHA after ${SECONDS}s"
              exit 0
            fi
            # The deployment circuit breaker marks a crash-looping rollout
            # FAILED; stop there rather than wait out the budget.
            if [ $((i % 6)) -eq 0 ]; then
              state="$(aws ecs describe-services \
                --cluster "gp-pr-${PR_NUMBER}-fargateCluster" \
                --services "gp-api-pr-${PR_NUMBER}" \
                --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" \
                --output text 2>/dev/null || true)"
              if [ "$state" = "FAILED" ]; then
                echo "::error::The gp-api preview's ECS rollout failed (circuit breaker): its new task keeps stopping. Check the task's logs in CloudWatch; push a fix to redeploy."
                exit 1
              fi
            fi
            echo "  attempt $i: serving ${got:-<unreachable>}"
            sleep 5
          done
          echo "The service never rolled over to this commit."
          echo "Re-running this job will not help: Pulumi compares its own resource"
          echo "spec, which this run already updated, so it exits 0 without"
          echo "re-rolling. Push a commit (an empty one is enough) so the image tag"
          echo "changes and ECS is given a genuinely new task definition."
          echo "::error::gp-api preview is serving ${got:-nothing} but this run built $EXPECTED_SHA; ECS did not roll over. Re-running this job is a no-op. Push a commit to force a new image tag and a fresh rollout."
          exit 1

      - name: Add preview summary
        if: steps.pulumi.outputs.service_url != ''
        run: echo "gp-api preview deployed to ${{ steps.pulumi.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"
