name: gp-webapp

on:
  pull_request:
    branches-ignore: [qa, master]
  push:
    branches: [develop, qa, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gp-webapp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  WORKSPACE: packages/gp-webapp

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
          build-contracts: 'true'

      - name: Next typegen
        working-directory: ${{ env.WORKSPACE }}
        run: npx next typegen

      - name: Typecheck app
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc --noEmit

      - name: Typecheck e2e
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc --noEmit --project e2e-tests/tsconfig.json

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Test
        run: npm run test -w ${{ env.WORKSPACE }}

  deploy:
    name: Deploy
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push'
          && contains(fromJSON('["develop", "qa", "master"]'), github.ref_name))
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
          build-contracts: 'true'

      # develop -> dev.goodparty.org, qa -> qa.goodparty.org (preview target +
      # branch-scoped env vars, then aliased); master -> production; PRs get a
      # generic preview with no alias.
      - name: Resolve deploy target
        id: ctx
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"
            # Full-stack: gp-api deploys a per-PR preview stack on every PR, so
            # always bake the per-PR backend into the webapp preview.
            echo "api_base=https://pr-${{ github.event.pull_request.number }}.preview.goodparty.org" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.ref_name }}" in
              develop)
                echo "target=preview" >> "$GITHUB_OUTPUT"
                echo "branch=develop" >> "$GITHUB_OUTPUT"
                echo "alias=dev.goodparty.org" >> "$GITHUB_OUTPUT" ;;
              qa)
                echo "target=preview" >> "$GITHUB_OUTPUT"
                echo "branch=qa" >> "$GITHUB_OUTPUT"
                echo "alias=qa.goodparty.org" >> "$GITHUB_OUTPUT" ;;
              master)
                echo "target=production" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Deploy to Vercel
        id: vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GP_WEBAPP }}
          target: ${{ steps.ctx.outputs.target }}
          git-branch: ${{ steps.ctx.outputs.branch }}
          alias-domain: ${{ steps.ctx.outputs.alias }}
          pr-alias: ${{ github.event_name == 'pull_request' && format('gp-ui-pr-{0}-good-party.vercel.app', github.event.pull_request.number) || '' }}
          api-base: ${{ steps.ctx.outputs.api_base }}

  # The Storybook styleguide (packages/styleguide) ships to its own
  # Vercel project, served at style.goodparty.org. Only on merges to develop —
  # it's a single-environment site. vercel build runs the project's configured
  # `build-storybook` on the runner against the installed workspace deps (same
  # as the webapp's next build), then deploys --prebuilt to the project's
  # production target, which Vercel serves at its production domain.
  deploy-styleguide:
    name: Deploy styleguide
    if: >-
      github.event_name == 'push' && github.ref_name == 'develop'
      && vars.VERCEL_PROJECT_ID_STYLEGUIDE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
          build-contracts: 'true'

      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_STYLEGUIDE }}
          target: production

  # Run the Playwright suite against the freshly deployed preview, sharded
  # across runners to cut wall-clock. Three jobs:
  #   e2e-wait  — gates once on gp-api's (slow) deploy, so the shards don't each
  #               idle on the same multi-minute poll.
  #   e2e-shard — fans the suite across 4 runners via Playwright --shard; each
  #               emits a blob report artifact.
  #   e2e       — merges the shard blobs into one HTML report + results.json,
  #               publishes to S3, upserts the PR comment, and fails iff any
  #               shard failed. This is the single required status check the
  #               develop ruleset gates on ("E2E"); keep its name stable.
  # Runs on PRs and on develop pushes (the dev deploy), not qa/master. The one
  # @dev-only polls test (analyze pipeline; needs AWS OIDC + Slack) runs only on
  # the develop push; the rest only need Clerk test keys.
  e2e-wait:
    name: E2E Wait
    needs: [deploy]
    if: >-
      needs.deploy.outputs.url != ''
      && (github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref_name == 'develop'))
    runs-on: ubuntu-latest
    # Exposes whether this develop commit's gp-api deploy was superseded by a
    # newer merge. When true, the shards (and the E2E fail-gate) skip cleanly
    # instead of hard-failing on a healthy dev stack.
    outputs:
      skip: ${{ steps.wait.outputs.skip }}
    # Generous budget: this gate waits on gp-api's (slow) deploy. The poll
    # itself can spend ~28 min in sleeps alone on the slow path (149x10s +
    # 17x10s), before gh-api/curl latency and runner provisioning — so keep the
    # 45-min headroom the single-job version had. It fails fast if gp-api's
    # deploy fails, so the full budget is only ever spent when gp-api is
    # genuinely still deploying.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      # Full-stack: the webapp is built against this PR's gp-api stack (or, on
      # develop, gp-api-dev), and gp-api runs on every PR/push. Wait until that
      # deploy of THIS commit is done before testing. gp-api's validate+build+ECS path is much
      # slower than the webapp deploy, so a blind timer off the (fast) webapp
      # deploy can't cover it. Instead wait on gp-api's existing Deploy job
      # finishing for this commit (terminal signal, fail fast), then confirm the
      # edge is serving it via /v1/version. Liveness alone is not enough on branch
      # builds, where dev is always up on the prior commit.
      #
      # The gp-api run is keyed to the source commit (PR head, or the pushed
      # commit) — distinct from github.sha, which on a PR is the merge commit.
      # gp-api tags its image with github.sha, so /v1/version reports that.
      - name: Wait for gp-api deploy
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
          JOB_NAME: ${{ github.event_name == 'pull_request' && 'Deploy PR preview' || 'Deploy' }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          # On develop, gp-api's deploy concurrency group (gp-api-deploy-develop)
          # serializes deploys and drops the older *pending* run when a newer
          # push queues. So a rapid second merge can cancel the first commit's
          # gp-api deploy run (cancelled while pending => the run has no Deploy
          # job at all), and the edge ends up serving the newer commit. Neither
          # is a real failure for the older commit: the newer commit's gp-api
          # deploy + E2E cover the current dev stack. Detect that "superseded"
          # case and skip cleanly instead of hard-failing. A genuinely failed
          # deploy (Deploy job conclusion=failure/timed_out) is NOT superseded
          # and still fails E2E.
          superseded() {
            [ "$IS_PUSH" = "true" ] || return 1
            local latest
            latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=develop&event=push&per_page=30" \
              --jq '[.workflow_runs[] | select(.name=="gp-api")] | sort_by(.run_started_at) | last | .id // empty')
            # Our commit's gp-api develop run is no longer the newest develop
            # gp-api run => a later merge superseded it.
            [ -n "$latest" ] && [ -n "$run_id" ] && [ "$latest" != "$run_id" ]
          }

          echo "Waiting for gp-api '$JOB_NAME' job on $RUN_SHA"
          for i in $(seq 1 150); do
            runs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RUN_SHA")
            run_id=$(jq -r '[.workflow_runs[] | select(.name=="gp-api")] | sort_by(.run_started_at) | last | .id // empty' <<<"$runs_json")
            run_conclusion=$(jq -r '[.workflow_runs[] | select(.name=="gp-api")] | sort_by(.run_started_at) | last | .conclusion // ""' <<<"$runs_json")
            job_conclusion=""
            if [ -n "$run_id" ]; then
              job_conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                --jq "[.jobs[] | select(.name==\"$JOB_NAME\")] | first | .conclusion // \"\"")
            fi
            echo "  attempt $i/150: gp-api run=${run_id:-<none>} run_conclusion=${run_conclusion:-<running>} '$JOB_NAME' conclusion=${job_conclusion:-<running>}"

            # Deploy job for our commit finished successfully.
            [ "$job_conclusion" = "success" ] && break

            # A real, non-superseded deploy failure must still fail E2E.
            case "$job_conclusion" in
              failure|timed_out|skipped)
                echo "::error::gp-api '$JOB_NAME' did not succeed ($job_conclusion)"
                exit 1 ;;
            esac

            # Cancelled run/job: tolerate ONLY if a newer develop gp-api deploy
            # superseded ours (rapid back-to-back merge); otherwise it's a real
            # failure and must fail E2E.
            if [ "$run_conclusion" = "cancelled" ] || [ "$job_conclusion" = "cancelled" ]; then
              if superseded; then
                echo "::notice::gp-api deploy for $RUN_SHA was superseded by a newer develop commit; skipping E2E for this commit."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::gp-api '$JOB_NAME' was cancelled and no newer develop deploy superseded it"
              exit 1
            fi

            if [ "$i" = 150 ]; then
              echo "::error::timed out waiting for gp-api '$JOB_NAME' on $RUN_SHA"
              exit 1
            fi
            sleep 10
          done

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            API_BASE="https://pr-${{ github.event.pull_request.number }}.preview.goodparty.org"
          else
            API_BASE="https://gp-api-dev.goodparty.org"
          fi
          echo "Confirming $API_BASE is serving $EXPECTED_SHA"
          for i in $(seq 1 18); do
            got="$(curl -fsS "$API_BASE/v1/version" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)"
            [ "$got" = "$EXPECTED_SHA" ] && { echo "gp-api serving $EXPECTED_SHA"; exit 0; }
            sleep 10
          done
          # Our commit never appeared on the edge. On develop this is expected
          # when a newer commit already deployed over dev (same supersession as
          # above) — the serialized deploy moves dev forward, never back to our
          # SHA — so skip cleanly rather than failing on a stale exact-SHA check.
          if superseded; then
            echo "::notice::$API_BASE is serving a newer commit than $EXPECTED_SHA; skipping E2E for this superseded commit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::gp-api deploy succeeded but $API_BASE not serving $EXPECTED_SHA"
          exit 1

  e2e-shard:
    name: E2E Shard (${{ matrix.shard }})
    needs: [deploy, e2e-wait]
    # Skip when the wait gate determined this develop commit was superseded by a
    # newer merge (the newer commit's gp-api deploy + E2E cover the current dev
    # stack), so there's nothing meaningful to test for this SHA.
    if: >-
      needs.deploy.outputs.url != ''
      && needs.e2e-wait.outputs.skip != 'true'
      && (github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref_name == 'develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One failing shard must not cancel the others — we want the full result
      # set and a complete merged report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      id-token: write
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The @dev-only polls test (develop push only) drives the analyze
      # pipeline and needs AWS; we don't know which shard it lands in, so all
      # shards configure OIDC creds.
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/web-app-e2e-tests
          aws-region: us-west-2

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp

      - name: Install Playwright browsers
        working-directory: ${{ env.WORKSPACE }}/e2e-tests
        run: npx playwright install --with-deps chromium

      # Each shard runs its file subset and emits a blob report the E2E summary
      # job merges; --reporter=blob deliberately overrides the config's
      # list/html/json reporters for the shard run.
      # --config must be an ABSOLUTE path: Playwright resolves a relative
      # --config (and the implicit config search) against the nearest
      # package.json dir, which here is packages/gp-webapp — one level above
      # e2e-tests — so it silently runs with NO config (no baseURL, no
      # globalSetup/clerkSetup) unless we point at the file explicitly.
      # @dev-only specs run only on the post-merge develop e2e (warm dev stack +
      # live pipelines: SQS analyze round-trip, Stripe webhook). Exclude them on
      # PRs, where an ephemeral per-PR preview can't drive those pipelines. See
      # e2e-tests/CLAUDE.md.
      - name: Run Playwright tests
        working-directory: ${{ env.WORKSPACE }}/e2e-tests
        run: >-
          npx playwright test --config="$PWD/playwright.config.ts" tests/
          --shard=${{ matrix.shard }}/4 --reporter=blob
          ${{ github.event_name == 'pull_request' && '--grep-invert @dev-only' || '' }}
        env:
          TEST_RUN_NAME: 'E2E Tests - PR Preview'
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Pin the blob output explicitly. Playwright's default resolves
          # `blob-report` against the nearest package.json dir — here
          # packages/gp-webapp, NOT e2e-tests (the same monorepo gotcha
          # e2e-tests/CLAUDE.md documents for --config) — so the default would
          # land outside the path we upload from. An absolute dir is immune to
          # that resolution and to the step's cwd.
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/${{ env.WORKSPACE }}/e2e-tests/blob-report

      - name: Upload shard blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: ${{ env.WORKSPACE }}/e2e-tests/blob-report
          retention-days: 7

  # Merge the shard blob reports, publish, comment, and gate the merge.
  # always(): run even when a shard failed (so the report + comment still post),
  # but the gate keeps it skipped on qa/master like the shards. On PRs it
  # upserts a results comment and publishes the HTML report to S3.
  e2e:
    name: E2E
    needs: [deploy, e2e-wait, e2e-shard]
    if: >-
      always()
      && needs.deploy.outputs.url != ''
      && (github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref_name == 'develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/web-app-e2e-tests
          aws-region: us-west-2

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp

      # Only when the shards actually ran. Skipping this (and merge/comment
      # below) when they were skipped/cancelled keeps the result-producing
      # chain uniform and the skipped path obvious — the fail-gate is the
      # signal then. (download-artifact@v4 with a pattern does not error on zero
      # matches, so this guard is for coherence, not to avoid a step failure.)
      - name: Download shard blob reports
        if: >-
          needs.e2e-shard.result == 'success'
          || needs.e2e-shard.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: ${{ env.WORKSPACE }}/e2e-tests/blob-report

      # Merge the per-shard blobs into the same outputs a single run produced:
      # playwright-report/ (HTML, for S3) and test-results/results.json (for the
      # comment). The merge config emits only those two reporters and omits the
      # main config's BASE_URL throw + globalSetup (no browser launches here).
      # Only when the shards actually ran (success or failure → blobs exist).
      # If they were skipped/cancelled (e.g. e2e-wait failed), there are no
      # blobs to merge — skip straight to the controlled fail-gate below rather
      # than letting merge-reports error on an empty input.
      # Absolute --config and input dir: merge-reports resolves its input via
      # path.resolve(process.cwd(), dir), so a relative arg is cwd-sensitive;
      # absolute paths are not. The merged html + json land in the config's
      # dir (e2e-tests) — exactly where the S3/parse steps below look.
      - name: Merge shard reports
        if: >-
          needs.e2e-shard.result == 'success'
          || needs.e2e-shard.result == 'failure'
        working-directory: ${{ env.WORKSPACE }}/e2e-tests
        run: >-
          npx playwright merge-reports
          --config="${{ github.workspace }}/${{ env.WORKSPACE }}/e2e-tests/playwright.merge.config.ts"
          "${{ github.workspace }}/${{ env.WORKSPACE }}/e2e-tests/blob-report"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gp-webapp-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORKSPACE }}/e2e-tests/playwright-report
            ${{ env.WORKSPACE }}/e2e-tests/test-results
          retention-days: 30

      # Publish the HTML report to S3 so it's viewable via URL, not just a
      # downloadable GH artifact. Keyed by PR number (when in PR context) and
      # run id + attempt so re-runs and concurrent runs never collide. Same
      # bucket/region the standalone gp-webapp workflow used.
      - name: Publish report to S3
        if: always()
        id: report
        working-directory: ${{ env.WORKSPACE }}/e2e-tests
        run: |
          PREFIX="${{ github.event.pull_request.number || github.ref_name }}"
          REPORT_PATH="gp-webapp/${PREFIX}/${{ github.run_id }}/${{ github.run_attempt }}"
          if [ -d playwright-report ]; then
            aws s3 sync playwright-report/ \
              "s3://gp-playwright-reports/${REPORT_PATH}/" \
              --no-progress
            echo "url=https://gp-playwright-reports.s3.us-west-2.amazonaws.com/${REPORT_PATH}/index.html" >> "$GITHUB_OUTPUT"
          else
            echo "playwright-report/ not found; skipping S3 upload"
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse test results
        if: always()
        id: results
        working-directory: ${{ env.WORKSPACE }}/e2e-tests
        shell: bash
        run: |
          if [ -f "test-results/results.json" ]; then
            TOTAL=$(jq '[.. | .specs? // empty | .[]] | length' test-results/results.json 2>/dev/null || echo 0)
            FAILED=$(jq '[.. | .specs? // empty | .[] | select(.ok == false)] | length' test-results/results.json 2>/dev/null || echo 0)
            PASSED=$(jq '[.. | .specs? // empty | .[] | select(.ok == true)] | length' test-results/results.json 2>/dev/null || echo 0)
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
            if [ "$FAILED" -gt 0 ]; then
              NAMES=$(jq -r '[.. | .specs? // empty | .[] | select(.ok == false) | .title] | .[:10] | .[]' test-results/results.json 2>/dev/null | sed 's/^/- /')
              [ -z "$NAMES" ] && NAMES="- $FAILED test(s) failed but names could not be parsed"
              {
                echo "failed_tests<<EOF"
                echo "$NAMES"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            else
              echo "failed_tests=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed_tests=- results.json not found (tests may not have run)" >> "$GITHUB_OUTPUT"
          fi

      # Upsert a single results comment (mirrors the pr-preview-comment pattern:
      # a stable marker + find-and-update) so re-runs don't pile up duplicates.
      - name: Comment results on PR
        # Skip when the shards never ran (skipped/cancelled) — there are no
        # results to report and a 0/0/0 comment would be misleading; the red
        # E2E check from the fail-gate below is the signal in that case.
        if: >-
          ${{ always() && github.event_name == 'pull_request'
          && (needs.e2e-shard.result == 'success'
              || needs.e2e-shard.result == 'failure') }}
        uses: actions/github-script@v8
        env:
          REPORT_URL: ${{ steps.report.outputs.url }}
          TOTAL: ${{ steps.results.outputs.total }}
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
          FAILED_TESTS: ${{ steps.results.outputs.failed_tests }}
          TEST_OUTCOME: ${{ needs.e2e-shard.result }}
        with:
          script: |
            const pr = context.issue.number
            const marker = '<!-- gp-webapp-e2e-results -->'

            const failed = parseInt(process.env.FAILED || '0', 10)
            const passed = parseInt(process.env.PASSED || '0', 10)
            const total = parseInt(process.env.TOTAL || '0', 10)
            const failedTests = process.env.FAILED_TESTS || ''
            const reportUrl = process.env.REPORT_URL || ''
            const previewUrl = process.env.BASE_URL || ''
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const ok = failed === 0 && process.env.TEST_OUTCOME === 'success'
            const status = ok ? '✅' : '❌'

            const lines = [
              marker,
              `## ${status} gp-webapp E2E results`,
              '',
              `**Preview:** ${previewUrl || '(unknown)'}`,
              '',
              '| Result | Count |',
              '|--------|-------|',
              `| ✅ Passed | ${passed} |`,
              `| ❌ Failed | ${failed} |`,
              `| 📊 Total | ${total} |`,
            ]
            if (failed > 0 && failedTests) {
              lines.push('', '**Failed tests:**', failedTests)
            }
            const links = []
            if (reportUrl) links.push(`[View HTML report](${reportUrl})`)
            links.push(`[View workflow run](${runUrl})`)
            lines.push('', links.join(' | '))
            const body = lines.join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            })
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              })
            }

      # Surface the same results + HTML-report link on the run's Summary page.
      # The PR comment above only fires on pull_request events, so post-merge
      # develop pushes (which have no PR to comment on) had no link to the
      # Playwright report. The job summary shows up under the run — reachable
      # from the "E2E" check's Details on any run, including failed develop runs.
      - name: Write E2E summary
        if: >-
          ${{ always()
          && (needs.e2e-shard.result == 'success'
              || needs.e2e-shard.result == 'failure') }}
        env:
          REPORT_URL: ${{ steps.report.outputs.url }}
          TOTAL: ${{ steps.results.outputs.total }}
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
          FAILED_TESTS: ${{ steps.results.outputs.failed_tests }}
          TEST_OUTCOME: ${{ needs.e2e-shard.result }}
        run: |
          status="✅"
          if [ "${FAILED:-0}" != "0" ] || [ "$TEST_OUTCOME" != "success" ]; then
            status="❌"
          fi
          {
            echo "## ${status} gp-webapp E2E results"
            echo ""
            echo "**Preview:** ${BASE_URL:-(unknown)}"
            echo ""
            echo "| Result | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed | ${PASSED:-0} |"
            echo "| ❌ Failed | ${FAILED:-0} |"
            echo "| 📊 Total | ${TOTAL:-0} |"
            echo ""
            if [ "${FAILED:-0}" != "0" ] && [ -n "$FAILED_TESTS" ]; then
              echo "**Failed tests:**"
              echo "$FAILED_TESTS"
              echo ""
            fi
            if [ -n "$REPORT_URL" ]; then
              echo "[View HTML report]($REPORT_URL)"
            else
              echo "_HTML report not published (no playwright-report/ artifact)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Make the required "E2E" check red exactly when a shard had a failure (or
      # was skipped because the gp-api gate failed). always() so an earlier
      # report/comment step failing can't mask a shard failure. The one tolerated
      # non-success is a superseded develop commit (e2e-wait set skip=true): the
      # shards are intentionally skipped and the newer commit's E2E covers dev, so
      # don't fail the gate in that case.
      - name: Fail if any shard did not pass
        if: >-
          ${{ always()
          && needs.e2e-shard.result != 'success'
          && needs.e2e-wait.outputs.skip != 'true' }}
        run: |
          echo "::error::E2E shards result: ${{ needs.e2e-shard.result }}"
          exit 1
