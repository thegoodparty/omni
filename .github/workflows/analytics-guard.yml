name: Analytics guard

# DATA-2432. No path filters: this becomes a required check, and a required job that a
# path filter skips leaves every unrelated PR waiting on it forever. The job decides
# inside itself what to run.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: analytics-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Set here rather than as repo variables: neither value is sensitive, a change is a
# reviewed one-line PR, and a PR editing these lines runs against its own copy, so the
# guard can never block the PR that turns it down.
env:
  # block | warn | off
  GOVERNANCE_GUARD_MODE: block
  # Who is cc'd on the PR comment when the guard itself errors.
  GOVERNANCE_GUARD_ALERT: '@datawithtristan'

jobs:
  guard:
    name: Analytics guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A setup failure is mechanical, so it must not fail the check: the guard step then
      # cannot find uv, its exit normalises to 1, and the comment says it could not run.
      - name: Set up uv
        id: setup_uv
        if: env.GOVERNANCE_GUARD_MODE != 'off'
        continue-on-error: true
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install deps
        id: install_deps
        if: env.GOVERNANCE_GUARD_MODE != 'off'
        continue-on-error: true
        working-directory: packages/runbooks/scripts/python
        run: uv sync --frozen

      - name: Run the guard
        id: guard
        if: env.GOVERNANCE_GUARD_MODE != 'off'
        working-directory: packages/runbooks/scripts/python
        run: |
          set +e
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          uv run governance_guard.py check --base "$base" --head HEAD \
            --markdown "$RUNNER_TEMP/guard.md" --summary "$RUNNER_TEMP/guard-full.md" \
            --json "$RUNNER_TEMP/guard.json"
          code=$?
          # Normalise. Only 0 (clean) and a 2 that guard.json itself confirms as a real
          # block are trusted. Everything else collapses to 1 (guard error): argparse's
          # and uv's own exit code is also 2 with no guard.md ever written, a 0 with no
          # guard.md means the process died before writing anything, and any other exit
          # is unanticipated. A mechanical failure must never read as "clean" or "blocks
          # merge" on a check that forks and Dependabot PRs hit with a read-only token.
          if [ "$code" = "2" ] && ! jq -e '.status == "block"' "$RUNNER_TEMP/guard.json" > /dev/null 2>&1; then
            code=1
          elif [ "$code" = "0" ] && [ ! -f "$RUNNER_TEMP/guard.md" ]; then
            code=1
          elif [ "$code" != "0" ] && [ "$code" != "2" ]; then
            code=1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The summary always gets the full report (the comment is capped) or the error,
          # so the result is readable even when the comment could not be posted.
          if [ -f "$RUNNER_TEMP/guard-full.md" ]; then
            cat "$RUNNER_TEMP/guard-full.md" >> "$GITHUB_STEP_SUMMARY"
          else
            # shellcheck disable=SC2016 # literal markdown backticks, not an expansion
            printf '### Analytics guard\n\nThe guard could not run, so nothing was checked.\n\n```\n%s\n```\n' \
              "$(jq -r '.error // "unknown"' "$RUNNER_TEMP/guard.json" 2>/dev/null || echo unknown)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post or update the guard comment
        if: env.GOVERNANCE_GUARD_MODE != 'off'
        # Never fails the job: a comment is a courtesy, not the check. The Verdict step
        # below is the only place a decision gets made.
        continue-on-error: true
        run: |
          set -uo pipefail
          code='${{ steps.guard.outputs.code }}'
          body="$RUNNER_TEMP/comment.md"
          if [ "$code" = "0" ]; then
            cp "$RUNNER_TEMP/guard.md" "$body" || echo "::warning::could not read guard.md for a clean result"
          elif [ "$code" = "2" ]; then
            cp "$RUNNER_TEMP/guard.md" "$body" || echo "::warning::could not read guard.md for a blocking result"
            if [ "$GOVERNANCE_GUARD_MODE" != "block" ]; then
              sed -i 's/^\*\*Blocks merge\*\*$/**Would block merge (shadow mode, not enforced yet)**/' "$body" \
                || echo "::warning::could not rewrite the shadow-mode line"
            fi
          else
            # shellcheck disable=SC2016 # literal markdown backticks, not an expansion
            printf '<!-- analytics-guard -->\n### Analytics guard\n\nThe guard could not run on this PR, so it passed without checking. %s\n\n```\n%s\n```\n' \
              "${GOVERNANCE_GUARD_ALERT:+cc $GOVERNANCE_GUARD_ALERT}" "$(jq -r '.error // "unknown"' "$RUNNER_TEMP/guard.json" 2>/dev/null || echo unknown)" > "$body"
          fi
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- analytics-guard -->"))][0].id // empty' 2>/dev/null | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@"$body" > /dev/null \
              || echo "::warning::could not update the existing analytics guard comment"
          elif [ "$code" != "0" ] || grep -q '^\*\*Warnings\*\*' "$body" 2>/dev/null; then
            gh pr comment "$PR" --body-file "$body" || echo "::warning::could not post the analytics guard comment"
          fi

      - name: Analytics guard is off
        if: env.GOVERNANCE_GUARD_MODE == 'off'
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "::warning::Analytics guard is OFF (GOVERNANCE_GUARD_MODE=off); nothing was checked."
          body="$RUNNER_TEMP/off.md"
          # shellcheck disable=SC2016 # literal markdown backticks, not an expansion
          printf '<!-- analytics-guard -->\n### Analytics guard\n\nThe guard is turned off for this PR (`GOVERNANCE_GUARD_MODE=off`). Nothing was checked.\n' > "$body"
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- analytics-guard -->"))][0].id // empty' 2>/dev/null | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@"$body" > /dev/null \
              || echo "::warning::could not update the existing analytics guard comment"
          fi

      - name: Runbooks tests (only when the runbooks package changed)
        if: ${{ !cancelled() && env.GOVERNANCE_GUARD_MODE != 'off' }}
        working-directory: packages/runbooks/scripts/python
        env:
          SEM_ANCHORS_NO_GH: "1"
        run: |
          if [ "${{ steps.setup_uv.outcome }}" != "success" ] || [ "${{ steps.install_deps.outcome }}" != "success" ]; then
            echo "::warning::could not install the runbooks Python environment; suite not run"
            exit 0
          fi
          base='${{ steps.guard.outputs.base }}'
          if [ -z "$base" ]; then
            echo "::warning::no merge base; running the runbooks suite anyway"
          elif [ -z "$(git diff --name-only "$base" HEAD -- .)" ]; then
            echo "No runbooks changes; skipping the suite."
            exit 0
          fi
          # Collection first and separately: one unimportable file once silenced this
          # whole suite for a month, and a collection error must not read as a test result.
          if ! uv run pytest --collect-only -q > "$RUNNER_TEMP/collect.log" 2>&1; then
            echo "::error::pytest could not collect the runbooks suite. Fix the import error below before trusting any result."
            tail -40 "$RUNNER_TEMP/collect.log"
            exit 1
          fi
          uv run pytest -q

      - name: Verdict
        if: ${{ !cancelled() && env.GOVERNANCE_GUARD_MODE != 'off' }}
        run: |
          code='${{ steps.guard.outputs.code }}'
          case "$code" in
            0) echo "Analytics guard: clean." ;;
            1) echo "::warning::Analytics guard could not run; passing without checking (see PR comment)." ;;
            2) if [ "$GOVERNANCE_GUARD_MODE" = "block" ]; then
                 echo "::error::Analytics guard found blocking problems. The PR comment (or this job's summary) says exactly what to add."
                 exit 1
               fi
               echo "::warning::Analytics guard would block this PR (shadow mode)." ;;
            *) echo "::warning::Analytics guard exited $code; treating as a guard error and passing." ;;
          esac
