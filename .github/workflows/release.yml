name: release

# The release train. One serialized pipeline per commit reaching main:
#   await-checks -> deploy every service to dev -> E2E against dev -> promote
#   the SAME commit to prod -> record the production Deployment.
#
# Serialization is the whole point. The concurrency group below runs one train
# at a time and never cancels the in-flight one; a burst of merges queues, and
# GitHub keeps only the latest queued run (older queued runs are superseded),
# so the train always finishes a commit and then jumps to the newest waiting
# commit. Because every dev deploy happens inside this one run, main cannot move
# underneath a deploy or the E2E: one fixed SHA flows dev -> E2E -> prod. That
# is what removes the deploy/E2E/promote races that a per-service, per-push
# topology used to hit under load.
#
# Checks and image builds still live in the per-service workflows (they run on
# every commit and need no serialization); the train only owns the shared-env
# deploys, the E2E, and the promotion. await-checks waits for those per-service
# check workflows to go green for this SHA before any deploy.
#
# Safety: freeze-switch gated (vars.PROMOTION_FROZEN skips the prod stage; dev +
# E2E still run). Forward-only (ECS deployment circuit breaker auto-reverts a
# crash-on-boot image; no rollback here). Break glass: workflow_dispatch with
# force=true skips the checks gate, the E2E, and the freeze and promotes a given
# SHA straight to prod. See docs/deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to run the train for (defaults to the current main tip)
        required: false
      force:
        description: Break glass — skip the checks gate, E2E, and freeze; promote straight to prod
        required: false
        type: boolean
        default: false

concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  AWS_REGION: us-west-2

jobs:
  await-checks:
    name: Await checks
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      force: ${{ steps.force.outputs.force }}
      frozen: ${{ steps.freeze.outputs.frozen }}
    steps:
      - name: Resolve break-glass force flag
        id: force
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "::warning::FORCE run: skipping the checks gate, E2E, and freeze; promoting straight to prod."
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check freeze switch
        id: freeze
        env:
          FROZEN: ${{ vars.PROMOTION_FROZEN }}
        run: |
          if [ "${{ steps.force.outputs.force }}" = "true" ]; then
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$FROZEN" = "true" ]; then
            echo "::notice::Promotion is frozen (vars.PROMOTION_FROZEN=true). Dev + E2E still run; the prod stage is skipped."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target SHA
        id: resolve
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            SHA="$INPUT_SHA"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $SHA"

      - name: Wait for dev checks to go green
        if: steps.force.outputs.force != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Per-service check workflows whose green-ness gates a deploy. None is
          # path-filtered, so each has a run for THIS SHA. gp-ai builds its
          # images here; gp-api/election-api build inside the train's dev stage.
          # contracts/gp-sdk/styleguide/prototypes are omitted deliberately —
          # contracts/gp-sdk are transitively covered (a service build fails if
          # they do), and a broken styleguide/prototypes fails its own deploy
          # job in the train's dev stage.
          REQUIRED="gp-api.yml election-api.yml gp-webapp.yml gp-admin.yml candidate-sites.yml publish-experiments.yml gp-ai.yml"
          DEADLINE=$(( $(date +%s) + 60*60 ))

          while :; do
            pending=0
            failed=""
            for wf in $REQUIRED; do
              # `// empty` so a not-yet-registered run yields an empty string (not
              # base64 of a null-valued object), so the no-run guard below fires.
              run=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&event=push&per_page=1" \
                --jq '.workflow_runs[0] // empty | {status, conclusion} | @base64' 2>/dev/null || echo "")
              if [ -z "$run" ]; then
                pending=$((pending+1)); continue # run not registered yet — keep waiting
              fi
              decoded=$(echo "$run" | base64 --decode)
              status=$(echo "$decoded" | jq -r '.status')
              conclusion=$(echo "$decoded" | jq -r '.conclusion')
              if [ "$status" != "completed" ]; then
                pending=$((pending+1))
              elif [ "$conclusion" != "success" ]; then
                failed="$failed $wf($conclusion)"
              fi
            done

            if [ -n "$failed" ]; then
              echo "::error::Dev checks failed for $SHA:$failed. Not deploying."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All required dev checks are green for $SHA."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for dev checks on $SHA ($pending still pending)."
              exit 1
            fi
            echo "Waiting: $pending required workflow(s) not yet complete for $SHA..."
            sleep 30
          done

  # ── Dev stage ───────────────────────────────────────────────────────────
  # Deploy every service to dev at the resolved SHA. Skipped on force (break
  # glass goes straight to prod). Each job needs await-checks to have SUCCEEDED
  # (checks green); the explicit `if` drops the implicit success() of needs, so
  # the result check is spelled out.

  dev-gp-api:
    name: Dev gp-api
    needs: await-checks
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: gp-api-deploy-dev
      cancel-in-progress: false
    env:
      IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/gp-api:${{ needs.await-checks.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: packages/gp-api
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Check for existing image
        id: ecr-image
        run: |
          if aws ecr describe-images --repository-name gp-api \
            --image-ids imageTag=${{ needs.await-checks.outputs.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build application
        if: steps.ecr-image.outputs.exists != 'true'
        run: npm run build -w packages/gp-api
      - name: Set up Docker Buildx
        if: steps.ecr-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        if: steps.ecr-image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/gp-api/deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_URI }}
          build-args: |
            GIT_SHA=${{ needs.await-checks.outputs.sha }}
          cache-from: type=gha,scope=gp-api
          cache-to: type=gha,mode=max,scope=gp-api
      - name: Deploy (Pulumi)
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: packages/gp-api
          command: npm run infra deploy dev
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dev-election-api:
    name: Dev election-api
    needs: await-checks
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: election-api-deploy-dev
      cancel-in-progress: false
    env:
      IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/election-api:${{ needs.await-checks.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: election-api
          workspace: packages/election-api
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:election-api
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Check for existing image
        id: ecr-image
        run: |
          if aws ecr describe-images --repository-name election-api \
            --image-ids imageTag=${{ needs.await-checks.outputs.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build application
        if: steps.ecr-image.outputs.exists != 'true'
        run: npm run build -w packages/election-api
      - name: Build and push Docker image
        if: steps.ecr-image.outputs.exists != 'true'
        run: |
          docker build -t "${IMAGE_URI}" -f packages/election-api/deploy/Dockerfile .
          docker push "${IMAGE_URI}"
      - name: Deploy (Pulumi)
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: packages/election-api/deploy
          command: ./deploy.sh dev

  dev-gp-webapp:
    name: Dev gp-webapp
    needs: await-checks
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
          build-contracts: 'true'
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GP_WEBAPP }}
          target: preview
          git-branch: main
          alias-domain: dev.goodparty.org

  dev-styleguide:
    name: Dev styleguide
    needs: await-checks
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
      && vars.VERCEL_PROJECT_ID_STYLEGUIDE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
          build-contracts: 'true'
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_STYLEGUIDE }}
          target: production

  dev-candidate-sites:
    name: Dev candidate-sites
    needs: await-checks
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: candidate-sites
      # No stable dev domain (production fronts the per-candidate custom
      # domains), so main deploys to the preview target with branch-scoped env
      # vars; production is the prod stage below.
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_CANDIDATE_SITES }}
          target: preview
          git-branch: main

  dev-prototypes:
    name: Dev prototypes
    needs: await-checks
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
      && vars.VERCEL_PROJECT_ID_PROTOTYPES != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: prototypes
      # prototypes is a single-environment public surface — deploy straight to
      # its production target on every main push.
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_PROTOTYPES }}
          target: production

  dev-gp-ai:
    name: Dev gp-ai
    needs: await-checks
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: gp-ai-deploy-dev
      cancel-in-progress: false
    env:
      APPLY_DIR: /tmp/tfapply
      PLAN_DIR: /tmp/tfplans
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Build pmf-engine lambda package
        working-directory: packages/gp-ai
        run: bash pmf_engine/scripts/build_lambda_package.sh

      - name: Build serve-analyze lambda trigger
        working-directory: packages/gp-ai/infrastructure/modules/serve-analyze-fargate/lambda-trigger
        run: |
          npm ci
          npm run build

      - name: apply dev/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/agent-experiment-metadata
      - name: apply dev/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/agent-run-inputs
      - name: apply dev/pmf-vpc-endpoints
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/pmf-vpc-endpoints
      - name: apply dev/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/campaign-plan-lambda
      - name: apply dev/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/pmf-engine-control-plane
      - name: apply dev/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/broker broker-${{ needs.await-checks.outputs.sha }}
      - name: apply dev/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/pmf-engine-fargate pmf-engine-${{ needs.await-checks.outputs.sha }}
      - name: apply dev/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/serve-analyze-fargate serve-analyze-${{ needs.await-checks.outputs.sha }}
      - name: apply dev/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/ddhq-matcher-fargate ddhq-matcher-${{ needs.await-checks.outputs.sha }}
      - name: apply dev/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/engineer-agent-fargate engineer-agent-${{ needs.await-checks.outputs.sha }}
      - name: apply dev/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh dev/shared-infra

      - wait-all:

      - name: reverify dev/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/agent-experiment-metadata
      - name: reverify dev/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/agent-run-inputs
      - name: reverify dev/pmf-vpc-endpoints
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-vpc-endpoints
      - name: reverify dev/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/campaign-plan-lambda
      - name: reverify dev/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-engine-control-plane
      - name: reverify dev/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/broker broker-${{ needs.await-checks.outputs.sha }}
      - name: reverify dev/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/pmf-engine-fargate pmf-engine-${{ needs.await-checks.outputs.sha }}
      - name: reverify dev/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/serve-analyze-fargate serve-analyze-${{ needs.await-checks.outputs.sha }}
      - name: reverify dev/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/ddhq-matcher-fargate ddhq-matcher-${{ needs.await-checks.outputs.sha }}
      - name: reverify dev/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/engineer-agent-fargate engineer-agent-${{ needs.await-checks.outputs.sha }}
      - name: reverify dev/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh dev/shared-infra

      - wait-all:

      - name: Convergence check
        run: |
          set -uo pipefail
          bad=0
          shopt -s nullglob
          files=("$PLAN_DIR"/*.code)
          expected=$(find packages/gp-ai/infrastructure/environments/dev -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::expected $expected re-plan results but found ${#files[@]}; a root produced no output and its convergence is unknown"
            for f in "${files[@]}"; do echo "  got: $(basename "$f" .code)"; done
            exit 1
          fi
          for f in "${files[@]}"; do
            root=$(basename "$f" .code)
            code=$(cat "$f")
            if [ "$code" != "0" ]; then
              echo "::error::$root did not converge (plan exit $code after apply)"
              tail -40 "$PLAN_DIR/$root.txt" || true
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "all ${#files[@]} roots converged (expected $expected)"

      - name: Verify dev is running this commit
        run: bash packages/gp-ai/infrastructure/scripts/ci-verify-deployed.sh dev ${{ needs.await-checks.outputs.sha }}

  # ── E2E stage ───────────────────────────────────────────────────────────
  # Confirm dev is serving this SHA (the serialized deploy above just put it
  # there and nothing else can move dev mid-run), then run the Playwright suite
  # against dev.goodparty.org sharded across runners. No e2e-wait poll: the dev
  # deploys are `needs`, so they are already done.

  verify-dev:
    name: Verify dev serving
    needs: [await-checks, dev-gp-api, dev-gp-webapp]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
      && needs.dev-gp-api.result == 'success'
      && needs.dev-gp-webapp.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm gp-api-dev is serving the SHA
        env:
          SHA: ${{ needs.await-checks.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            got="$(curl -fsS https://gp-api-dev.goodparty.org/v1/version 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)"
            [ "$got" = "$SHA" ] && { echo "gp-api-dev serving $SHA"; exit 0; }
            echo "  attempt $i/18: serving ${got:-<none>}, want $SHA"
            sleep 10
          done
          echo "::error::gp-api-dev not serving $SHA after deploy"
          exit 1

  e2e-shard:
    name: E2E Shard (${{ matrix.shard }})
    # Barrier for the whole prod-bound batch: every service that gets promoted
    # must have deployed to dev first (verify-dev covers gp-api + gp-webapp).
    # A failure here skips the shards -> E2E goes red -> the prod stage is
    # blocked, so prod is all-or-nothing across these services. prototypes and
    # styleguide are single-env and not promoted, so their dev failures are not
    # in this barrier and cannot block prod.
    needs:
      [
        await-checks,
        verify-dev,
        dev-election-api,
        dev-candidate-sites,
        dev-gp-ai,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      id-token: write
    env:
      BASE_URL: https://dev.goodparty.org
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      # The @dev-only polls test drives the analyze pipeline and needs AWS; we
      # don't know which shard it lands in, so all shards configure OIDC creds.
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/web-app-e2e-tests
          aws-region: us-west-2
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
      - name: Install Playwright browsers
        working-directory: packages/gp-webapp/e2e-tests
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: packages/gp-webapp/e2e-tests
        run: >-
          npx playwright test --config="$PWD/playwright.config.ts" tests/
          --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          TEST_RUN_NAME: 'E2E Tests - dev'
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/packages/gp-webapp/e2e-tests/blob-report
      - name: Upload shard blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: packages/gp-webapp/e2e-tests/blob-report
          retention-days: 7

  e2e:
    name: E2E
    needs: [await-checks, e2e-shard]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.force != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BASE_URL: https://dev.goodparty.org
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::333022194791:role/web-app-e2e-tests
          aws-region: us-west-2
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
      - name: Download shard blob reports
        if: >-
          needs.e2e-shard.result == 'success'
          || needs.e2e-shard.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: packages/gp-webapp/e2e-tests/blob-report
      - name: Merge shard reports
        if: >-
          needs.e2e-shard.result == 'success'
          || needs.e2e-shard.result == 'failure'
        working-directory: packages/gp-webapp/e2e-tests
        run: >-
          npx playwright merge-reports
          --config="${{ github.workspace }}/packages/gp-webapp/e2e-tests/playwright.merge.config.ts"
          "${{ github.workspace }}/packages/gp-webapp/e2e-tests/blob-report"
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gp-webapp-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/gp-webapp/e2e-tests/playwright-report
            packages/gp-webapp/e2e-tests/test-results
          retention-days: 30
      - name: Publish report to S3
        if: always()
        id: report
        working-directory: packages/gp-webapp/e2e-tests
        run: |
          REPORT_PATH="gp-webapp/main/${{ github.run_id }}/${{ github.run_attempt }}"
          if [ -d playwright-report ]; then
            aws s3 sync playwright-report/ \
              "s3://gp-playwright-reports/${REPORT_PATH}/" \
              --no-progress
            echo "url=https://gp-playwright-reports.s3.us-west-2.amazonaws.com/${REPORT_PATH}/index.html" >> "$GITHUB_OUTPUT"
          else
            echo "playwright-report/ not found; skipping S3 upload"
            echo "url=" >> "$GITHUB_OUTPUT"
          fi
      - name: Parse test results
        if: always()
        id: results
        working-directory: packages/gp-webapp/e2e-tests
        shell: bash
        run: |
          if [ -f "test-results/results.json" ]; then
            TOTAL=$(jq '[.. | .specs? // empty | .[]] | length' test-results/results.json 2>/dev/null || echo 0)
            FAILED=$(jq '[.. | .specs? // empty | .[] | select(.ok == false)] | length' test-results/results.json 2>/dev/null || echo 0)
            PASSED=$(jq '[.. | .specs? // empty | .[] | select(.ok == true)] | length' test-results/results.json 2>/dev/null || echo 0)
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Write E2E summary
        if: >-
          always()
          && (needs.e2e-shard.result == 'success'
              || needs.e2e-shard.result == 'failure')
        env:
          REPORT_URL: ${{ steps.report.outputs.url }}
          TOTAL: ${{ steps.results.outputs.total }}
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
          TEST_OUTCOME: ${{ needs.e2e-shard.result }}
        run: |
          status="✅"
          if [ "${FAILED:-0}" != "0" ] || [ "$TEST_OUTCOME" != "success" ]; then
            status="❌"
          fi
          {
            echo "## ${status} gp-webapp E2E results (dev)"
            echo ""
            echo "**Base:** ${BASE_URL}"
            echo ""
            echo "| Result | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed | ${PASSED:-0} |"
            echo "| ❌ Failed | ${FAILED:-0} |"
            echo "| 📊 Total | ${TOTAL:-0} |"
            echo ""
            if [ -n "$REPORT_URL" ]; then
              echo "[View HTML report]($REPORT_URL)"
            else
              echo "_HTML report not published (no playwright-report/ artifact)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any shard did not pass
        if: always() && needs.e2e-shard.result != 'success'
        run: |
          echo "::error::E2E shards result: ${{ needs.e2e-shard.result }}"
          exit 1

  # ── Prod stage ──────────────────────────────────────────────────────────
  # Promote the SAME SHA to prod. Runs when the E2E passed and promotion is not
  # frozen, or on a force break-glass. Backends repoint prod at the image the
  # dev stage already built (SHA-tagged, immutable). Not atomic across services:
  # a single failure leaves prod mixed until the next promotion or a re-run.

  prod-gp-api:
    name: Promote gp-api
    needs: [await-checks, e2e]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gp-api-deploy-prod
      cancel-in-progress: false
    env:
      IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/gp-api:${{ needs.await-checks.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: packages/gp-api
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy (Pulumi)
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: packages/gp-api
          command: npm run infra deploy prod
        env:
          GITHUB_TOKEN: ${{ github.token }}

  prod-election-api:
    name: Promote election-api
    needs: [await-checks, e2e]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: election-api-deploy-prod
      cancel-in-progress: false
    env:
      IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/election-api:${{ needs.await-checks.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: election-api
          workspace: packages/election-api
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:election-api
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy (Pulumi)
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: packages/election-api/deploy
          command: ./deploy.sh prod

  prod-gp-webapp:
    name: Promote gp-webapp
    needs: [await-checks, e2e]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
          build-contracts: 'true'
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GP_WEBAPP }}
          target: production

  prod-gp-admin:
    name: Promote gp-admin
    needs: [await-checks, e2e]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-admin
          build-contracts: 'true'
      - name: Build SDK
        run: npm run build -w packages/gp-sdk
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GP_ADMIN }}
          target: production

  prod-candidate-sites:
    name: Promote candidate-sites
    needs: [await-checks, e2e]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: candidate-sites
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_CANDIDATE_SITES }}
          target: production

  prod-publish-experiments:
    name: Promote experiment manifests
    needs: [await-checks, e2e]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install runtime deps
        working-directory: packages/runbooks/scripts/python
        run: uv sync --frozen
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-pulumi-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish manifests to S3
        working-directory: packages/runbooks/scripts/python
        run: uv run python publish_experiments.py --env=prod

  prod-gp-ai-images:
    name: Check gp-ai images
    needs: [await-checks, e2e]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check for a full image set
        id: check
        env:
          SHA: ${{ needs.await-checks.outputs.sha }}
        run: |
          set -euo pipefail
          found=0; missing=0; absent=""
          # KEEP IN SYNC with the "Build service matrix" step in gp-ai.yml.
          for s in broker pmf-engine serve-analyze ddhq-matcher engineer-agent; do
            if aws ecr describe-images --repository-name gp-ai-projects \
                 --image-ids "imageTag=$s-$SHA" --region "$AWS_REGION" >/dev/null 2>&1; then
              found=$((found+1))
            else
              missing=$((missing+1)); absent="$absent $s"
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "All 5 gp-ai images present for $SHA; promoting gp-ai."
          elif [ "$found" -eq 0 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No gp-ai images for $SHA. gp-ai.yml builds all five on every main push, so for a recent main commit this is UNEXPECTED and means the build failed or never pushed — investigate. It is only expected for a workflow_dispatch of a SHA predating unconditional builds. Skipping gp-ai promotion."
          else
            echo "::error::Partial gp-ai image set for $SHA ($found present,$absent missing). A build failed; refusing to promote a mixed set."
            exit 1
          fi

  prod-gp-ai:
    name: Promote gp-ai
    needs: [await-checks, e2e, prod-gp-ai-images]
    if: >-
      always() && needs.await-checks.result == 'success'
      && needs.await-checks.outputs.frozen != 'true'
      && (needs.await-checks.outputs.force == 'true' || needs.e2e.result == 'success')
      && needs.prod-gp-ai-images.result == 'success'
      && needs.prod-gp-ai-images.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gp-ai-deploy-prod
      cancel-in-progress: false
    env:
      APPLY_DIR: /tmp/tfapply
      PLAN_DIR: /tmp/tfplans
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.await-checks.outputs.sha }}
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Build pmf-engine lambda package
        working-directory: packages/gp-ai
        run: bash pmf_engine/scripts/build_lambda_package.sh

      - name: Build serve-analyze lambda trigger
        working-directory: packages/gp-ai/infrastructure/modules/serve-analyze-fargate/lambda-trigger
        run: |
          npm ci
          npm run build

      - name: apply prod/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/agent-experiment-metadata
      - name: apply prod/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/agent-run-inputs
      - name: apply prod/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/campaign-plan-lambda
      - name: apply prod/clickup-bot
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/clickup-bot
      - name: apply prod/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/pmf-engine-control-plane
      - name: apply prod/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/broker broker-${{ needs.await-checks.outputs.sha }}
      - name: apply prod/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/pmf-engine-fargate pmf-engine-${{ needs.await-checks.outputs.sha }}
      - name: apply prod/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/serve-analyze-fargate serve-analyze-${{ needs.await-checks.outputs.sha }}
      - name: apply prod/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/ddhq-matcher-fargate ddhq-matcher-${{ needs.await-checks.outputs.sha }}
      - name: apply prod/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/engineer-agent-fargate engineer-agent-${{ needs.await-checks.outputs.sha }}
      - name: apply prod/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/shared-infra

      - wait-all:

      - name: reverify prod/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/agent-experiment-metadata
      - name: reverify prod/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/agent-run-inputs
      - name: reverify prod/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/campaign-plan-lambda
      - name: reverify prod/clickup-bot
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/clickup-bot
      - name: reverify prod/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/pmf-engine-control-plane
      - name: reverify prod/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/broker broker-${{ needs.await-checks.outputs.sha }}
      - name: reverify prod/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/pmf-engine-fargate pmf-engine-${{ needs.await-checks.outputs.sha }}
      - name: reverify prod/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/serve-analyze-fargate serve-analyze-${{ needs.await-checks.outputs.sha }}
      - name: reverify prod/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/ddhq-matcher-fargate ddhq-matcher-${{ needs.await-checks.outputs.sha }}
      - name: reverify prod/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/engineer-agent-fargate engineer-agent-${{ needs.await-checks.outputs.sha }}
      - name: reverify prod/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/shared-infra

      - wait-all:

      - name: Convergence check
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=("$PLAN_DIR"/*.code)
          expected=$(find packages/gp-ai/infrastructure/environments/prod -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::expected $expected re-plan results but found ${#files[@]}; a root produced no output and its convergence is unknown"
            for f in "${files[@]}"; do echo "  got: $(basename "$f" .code)"; done
            exit 1
          fi
          bad=0
          for f in "${files[@]}"; do
            root=$(basename "$f" .code)
            code=$(cat "$f")
            if [ "$code" != "0" ]; then
              echo "::error::$root did not converge (plan exit $code after apply)"
              tail -40 "$PLAN_DIR/$root.txt" || true
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "all ${#files[@]} roots converged (expected $expected)"

      - name: Verify prod is running the promoted commit
        run: bash packages/gp-ai/infrastructure/scripts/ci-verify-deployed.sh prod ${{ needs.await-checks.outputs.sha }}

  finalize:
    name: Record prod deployment
    needs:
      [
        await-checks,
        prod-gp-api,
        prod-election-api,
        prod-gp-webapp,
        prod-gp-admin,
        prod-candidate-sites,
        prod-publish-experiments,
        prod-gp-ai-images,
        prod-gp-ai,
      ]
    # Explicit `if` drops the implicit success() of needs, so each prod deploy's
    # result is checked — otherwise a partial promotion records a false success.
    # gp-ai may legitimately skip (no image set on a force of an old SHA), which
    # is why it and its image gate accept skipped; the frozen/e2e gate on the
    # first line still blocks the "nothing promoted" case.
    if: |
      always() &&
      needs.await-checks.result == 'success' &&
      needs.await-checks.outputs.frozen != 'true' &&
      needs.prod-gp-api.result == 'success' &&
      needs.prod-election-api.result == 'success' &&
      needs.prod-gp-webapp.result == 'success' &&
      needs.prod-gp-admin.result == 'success' &&
      needs.prod-candidate-sites.result == 'success' &&
      needs.prod-publish-experiments.result == 'success' &&
      (needs.prod-gp-ai-images.result == 'success' || needs.prod-gp-ai-images.result == 'skipped') &&
      (needs.prod-gp-ai.result == 'success' || needs.prod-gp-ai.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record production deployment for the promoted SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.await-checks.outputs.sha }}
        run: |
          dep_id=$(jq -n --arg ref "$SHA" '{
              ref: $ref,
              environment: "production",
              production_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Automated promotion"
            }' | gh api "repos/$REPO/deployments" --input - --jq '.id')
          gh api "repos/$REPO/deployments/$dep_id/statuses" \
            -f state=success -f environment=production \
            -f description="Promoted to prod"
