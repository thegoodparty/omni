name: prototypes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Cancel superseded PR runs: a new push makes the in-flight result irrelevant,
# and while cancel was off the new run also queued behind it. The Vercel preview
# is re-aliased by the next run, so a killed deploy self-heals. Never on main.
concurrency:
  group: prototypes-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKSPACE: packages/prototypes

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: prototypes

      - name: Next typegen
        working-directory: ${{ env.WORKSPACE }}
        run: npx next typegen

      - name: Typecheck app
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Test
        run: npm run test -w ${{ env.WORKSPACE }}

      - name: Build
        working-directory: ${{ env.WORKSPACE }}
        run: npx next build

  deploy:
    name: Deploy
    if: >-
      vars.VERCEL_PROJECT_ID_PROTOTYPES != ''
      && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: prototypes

      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_PROTOTYPES }}
          target: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          pr-alias: ${{ github.event_name == 'pull_request' && format('prototypes-pr-{0}-good-party.vercel.app', github.event.pull_request.number) || '' }}
