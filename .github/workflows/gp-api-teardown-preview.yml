name: gp-api teardown preview

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    types: [closed]

env:
  WORKSPACE: packages/gp-api

# Serialize on the preview stack name (shared with the deploy job in gp-api.yml
# and the cron cleanup destroy in gp-api-cleanup-preview.yml) so a teardown
# never runs a Pulumi operation against the stack while a deploy or a cron
# destroy is mid-flight on it.
concurrency:
  group: gp-api-preview-gp-api-pr-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api

      # The preview deploy role, not the admin deploy role: this runs on a
      # pull_request event, so the workflow comes from the pull request. Step 7
      # of thegoodparty/ops docs/deploy-role-trust.md.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-preview-deploy
          aws-region: us-west-2

      - name: Drop preview database
        # The database lives on the shared Aurora cluster (not Pulumi-managed)
        # and must be dropped via a SQL op from inside the VPC, so it runs as a
        # one-off ECS task.
        #
        # The task is the preview's own task definition, in the preview's own
        # cluster. It already carries everything the drop needs: DB_USER and
        # DB_PASSWORD (GP_API_DEV, the shared cluster's master password), and
        # the runner passes the shared cluster endpoint as DB_HOST. It is also
        # all the preview deploy role can run, since that role holds nothing on
        # the dev cluster or the dev task definition.
        #
        # A drop task still running when the wait gives up is stopped, so it
        # cannot hold the cluster open and fail the destroy below with
        # ClusterContainsTasksException; drop-preview-db.ts also bounds its own
        # connect and statement time, and uses DROP ... WITH (FORCE), so the
        # still-running preview app can't block the drop. A preview that never
        # deployed has no task definition to run, and the cron's orphan sweep
        # in gp-api-cleanup-preview.yml is the backstop for its database.
        run: |
          PR="${{ github.event.number }}"
          ECS_CLUSTER="gp-pr-${PR}-fargateCluster"
          TASK_DEF_FAMILY="gp-pr-${PR}-fargateCluster-gp-api-pr-${PR}"
          CONTAINER="gp-api-pr-${PR}"

          CLUSTER_ENDPOINT=$(aws rds describe-db-clusters \
            --db-cluster-identifier gp-api-preview-shared-db \
            --query 'DBClusters[0].Endpoint' \
            --output text 2>/dev/null || true)

          if [ -z "$CLUSTER_ENDPOINT" ] || [ "$CLUSTER_ENDPOINT" = "None" ]; then
            echo "Shared preview cluster not found; skipping DB drop."
            exit 0
          fi

          CLUSTER_STATUS=$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' \
            --output text 2>/dev/null || true)

          if [ "$CLUSTER_STATUS" != "ACTIVE" ] || \
            ! aws ecs describe-task-definition \
              --task-definition "$TASK_DEF_FAMILY" >/dev/null 2>&1; then
            echo "No preview cluster or task definition for PR #${PR}; skipping DB drop."
            exit 0
          fi

          echo "Running drop-preview-db for PR #${PR} against ${CLUSTER_ENDPOINT}..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF_FAMILY" \
            --launch-type FARGATE \
            --network-configuration \
              "awsvpcConfiguration={
                subnets=[subnet-053357b931f0524d4,subnet-0bb591861f72dcb7f],
                securityGroups=[sg-01de8d67b0f0ec787],
                assignPublicIp=DISABLED
              }" \
            --overrides "{
              \"containerOverrides\": [{
                \"name\": \"${CONTAINER}\",
                \"command\": [\"npx\",\"tsx\",\"scripts/drop-preview-db.ts\"],
                \"environment\": [
                  {\"name\":\"DB_HOST\",\"value\":\"${CLUSTER_ENDPOINT}\"},
                  {\"name\":\"PR_NUMBER\",\"value\":\"${PR}\"}
                ]
              }]
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "run-task failed or returned no task ARN; aborting DB drop."
            exit 1
          fi

          echo "Waiting for drop task ${TASK_ARN} to complete..."
          if ! aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"; then
            echo "Drop task did not stop in time; stopping it so the destroy is not blocked."
            aws ecs stop-task --cluster "$ECS_CLUSTER" --task "$TASK_ARN" >/dev/null || true
            exit 1
          fi

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query \
              "tasks[0].containers[?name=='${CONTAINER}'].exitCode" \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            # Fail loudly so the failure() Slack alert fires and orphaned
            # databases don't pile up unnoticed. Destroy still runs (always())
            # so the ALB is reclaimed regardless.
            echo "drop-preview-db task exited '${EXIT_CODE}'; check ECS logs."
            exit 1
          fi

      - name: Destroy preview stack
        # always(): the DB-drop step above is allowed to fail, but the stack
        # must still be destroyed so the ALB is reclaimed (ELB quota).
        if: always()
        uses: ./.github/actions/destroy-preview-stack
        with:
          stack-name: gp-api-pr-${{ github.event.number }}
          working-directory: ${{ env.WORKSPACE }}/deploy

      - name: Notify Slack on teardown failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3
        with:
          status: failure
          fields: repo,workflow,job
          text: >-
            gp-api preview teardown failed for PR #${{ github.event.number }}.
            Its load balancer may still be holding ELB quota — check the run.
