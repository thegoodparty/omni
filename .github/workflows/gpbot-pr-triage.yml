name: gpbot PR triage

# Puts the human currently on bug duty on every [GP-Bot] PR and tells the owning
# team it exists.
#
# The bot opens PRs nobody asked for, against tickets no reviewer has read. Ten
# bot PRs died silently in the archived gp-webapp repo because "someone will
# look at it" is not an owner. This assigns one.
#
# THIS WORKFLOW MUST NEVER MERGE ANYTHING.
# The repo has allow_auto_merge enabled, and delegate-reviewer approves every
# PR — including bot PRs — which satisfies the main ruleset's one-approval
# requirement. The only thing keeping a human in the loop is that nothing
# calls merge. Do not add `gh pr merge`, and do not add `--auto`: the agreed
# contract is that a bot may approve but a human decides what actually lands.

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gpbot-pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Assign and announce
    # Gate on bot authorship two ways because the two signals come from
    # different places: the branch prefix is set by the agent's git commands,
    # the title prefix by its gh call. Either alone has been wrong before.
    if: >-
      startsWith(github.event.pull_request.title, '[GP-Bot]')
      || contains(github.event.pull_request.head.ref, '/gp-bot_')
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env` block is not visible to
    # that step's `if` condition, so the Slack guard below would always be
    # true and the step would fail on an empty channel instead of skipping.
    env:
      # gp_ai_bot, not the analytics app behind SLACK_APP_BOT_TOKEN. Slack
      # refuses chat.postMessage with not_in_channel unless the app is either a
      # member of the channel or holds chat:write.public, and the analytics app
      # is a member of #product-analytics only — it cannot reach #bugs, which is
      # where the humans who triage these PRs actually are.
      SLACK_TOKEN: ${{ secrets.GPBOT_SLACK_BOT_TOKEN }}
      CHANNEL: ${{ vars.GPBOT_PR_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/gpbot-reviewers.json
          sparse-checkout-cone-mode: false

      # Resolve the owning group from the ClickUp list the ticket lives in.
      # The list is not on the PR, so it is recovered from the custom_id that
      # prefixes the branch name (`ENG-1234/gp-bot_...`).
      #
      # Every failure here degrades to defaultGroup rather than failing the
      # job: an unassigned bot PR that nobody hears about is the exact outcome
      # this workflow exists to prevent, so a ClickUp hiccup must not cause it.
      - name: Resolve owning group
        id: owner
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          roster=.github/gpbot-reviewers.json

          custom_id="${HEAD_REF%%/*}"
          if [[ ! "$custom_id" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
            echo "branch '$HEAD_REF' carries no ClickUp custom_id; using default group"
            custom_id=""
          fi
          echo "custom_id=$custom_id" >> "$GITHUB_OUTPUT"

          list_id=""
          task_name=""
          if [ -n "$custom_id" ] && [ -n "${CLICKUP_API_TOKEN:-}" ]; then
            # custom_task_ids + team_id are both required to look a task up by
            # its ENG-1234 form rather than the opaque internal id.
            #
            # Captured once and read twice. The name is what tells a
            # release-train fix apart from an ordinary bug fix — see the
            # merge-decision step at the end of this job — and a second GET for
            # one field would double this workflow's ClickUp calls on every bot
            # PR.
            task="$(curl -sS --max-time 20 \
              -H "Authorization: $CLICKUP_API_TOKEN" \
              "https://api.clickup.com/api/v2/task/${custom_id}?custom_task_ids=true&team_id=90132012119" || true)"
            if jq -e . <<<"$task" >/dev/null 2>&1; then
              list_id="$(jq -r '.list.id // empty' <<<"$task")"
              task_name="$(jq -r '.name // empty' <<<"$task")"
            else
              echo "::warning::ClickUp did not return readable JSON for $custom_id; routing by default group and unable to tell whether this is a release-train fix"
            fi
          fi

          # THE VERDICT TRAVELS, NOT THE TITLE. The later step only needs to
          # know whether this came from a release-train failure, and a ticket
          # name is arbitrary prose from a system anyone can type into: putting
          # it in GITHUB_OUTPUT means picking a heredoc delimiter that the
          # title is trusted not to contain, for no gain. Deciding here leaves
          # nothing to escape.
          #
          # `[release]` is the prefix gpbot-release-failure-triage.yml puts on
          # every ticket it files, and nothing else writes it.
          case "$task_name" in
            '[release]'*) echo "from_release_ticket=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "from_release_ticket=false" >> "$GITHUB_OUTPUT" ;;
          esac

          group="$(jq -r --arg l "$list_id" '.listRouting[$l] // .defaultGroup' "$roster")"
          echo "resolved list='${list_id:-unknown}' -> group='$group'"
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "slack_group_id=$(jq -r --arg g "$group" '.groups[$g].slackGroupId // empty' "$roster")" >> "$GITHUB_OUTPUT"

      # Who is on bug duty right now. @serve-bugs / @win-bugs are two-week
      # rotations holding one person at a time, so the group's membership is the
      # answer and reading it here means a handoff needs no commit anywhere.
      #
      # This replaced a round-robin over a hand-listed pool. Round-robin keyed on
      # the PR number is stateless and never drifts, but it answers the wrong
      # question: it picked whoever the arithmetic landed on, which was almost
      # never the person actually holding the rotation, and pulled in people who
      # do not review app code at all.
      #
      # usergroups.users.list needs `usergroups:read`, which the gp_ai_bot token
      # does not carry yet, so today this resolves to nothing and the
      # announcement goes out with the group mention alone — still the right
      # person, just without the GitHub request.
      - name: Resolve the on-call reviewer
        id: oncall
        if: env.SLACK_TOKEN != '' && steps.owner.outputs.slack_group_id != ''
        env:
          GROUP_ID: ${{ steps.owner.outputs.slack_group_id }}
        run: |
          # Deliberately not `-e`. Every call below is checked by hand and
          # degrades to "no individual assignee", because failing here would
          # take the announcement down with it — an unheard-of bot PR is the
          # exact outcome this workflow exists to prevent.
          set -uo pipefail
          roster=.github/gpbot-reviewers.json

          members="$(curl -sS --max-time 20 -G https://slack.com/api/usergroups.users.list \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            --data-urlencode "usergroup=$GROUP_ID")"
          if [ "$(jq -r '.ok // false' <<<"$members")" != "true" ]; then
            echo "::warning::cannot read Slack group $GROUP_ID ($(jq -r '.error // "no response"' <<<"$members")); announcing to the group with no individual assignee"
            exit 0
          fi

          mentions=""
          logins=""
          # Everyone the group returns is used rather than one being chosen. The
          # group holds one person, and the only expected exception is a brief
          # two-person overlap at handoff — picking between them would put back
          # the arbitrary selection this step exists to remove.
          for uid in $(jq -r '.users[]? | select(. != "")' <<<"$members"); do
            mentions="${mentions:+$mentions }<@${uid}>"

            # Slack is the authority on the address, and a profile email is not
            # always stored lower-case (Jack@goodparty.org is live today), so
            # normalise before matching against the roster's keys.
            email="$(curl -sS --max-time 20 -G https://slack.com/api/users.info \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              --data-urlencode "user=$uid" \
              | jq -r '.user.profile.email // empty' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$email" ]; then
              echo "::warning::no readable email for Slack user $uid, so no GitHub login can be reached"
              continue
            fi

            login="$(jq -r --arg e "$email" '.githubLogins[$e] // empty' "$roster")"
            if [ -z "$login" ]; then
              echo "::warning::$email is on bug duty but has no githubLogins entry in $roster; add one to get GitHub review requests"
              continue
            fi
            logins="${logins:+$logins,}$login"
          done

          echo "on-call: ${mentions:-<none>} -> ${logins:-<no github login>}"
          echo "mentions=$mentions" >> "$GITHUB_OUTPUT"
          echo "reviewers=$logins" >> "$GITHUB_OUTPUT"

      - name: Request review
        if: steps.oncall.outputs.reviewers != ''
        uses: actions/github-script@v7
        env:
          REVIEWERS: ${{ steps.oncall.outputs.reviewers }}
        with:
          script: |
            const reviewers = process.env.REVIEWERS.split(',').filter(Boolean)
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers,
              })
            } catch (e) {
              // A login that has lost repo access, or the bot's own account,
              // makes this 422. Announcing the PR still has value, so warn
              // instead of failing and let the Slack step run.
              core.warning(`could not request review from ${reviewers.join(', ')}: ${e.message}`)
            }

      # Degrades quietly when the channel variable is unset, so this workflow
      # can merge before the channel decision is made.
      - name: Announce in Slack
        if: env.SLACK_TOKEN != '' && env.CHANNEL != ''
        env:
          GROUP_ID: ${{ steps.owner.outputs.slack_group_id }}
          MENTIONS: ${{ steps.oncall.outputs.mentions }}
          REVIEWERS: ${{ steps.oncall.outputs.reviewers }}
          CUSTOM_ID: ${{ steps.owner.outputs.custom_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          mention=""
          [ -n "$GROUP_ID" ] && mention="<!subteam^${GROUP_ID}> "
          ticket=""
          [ -n "$CUSTOM_ID" ] && ticket=" (<https://app.clickup.com/t/${CUSTOM_ID}|${CUSTOM_ID}>)"

          # <!subteam^...> above already notifies the one person on duty, so
          # these lines only have to report what happened on GitHub. Naming
          # someone is worth a real <@id> and not bold text, which notifies
          # nobody; $MENTIONS is built only from ids Slack returned, so it can
          # never be the literal `<@>` an empty variable would produce.
          if [ -n "$REVIEWERS" ]; then
            reviewer_line="Review requested from ${MENTIONS}."
          elif [ -n "$MENTIONS" ]; then
            reviewer_line="${MENTIONS} is on duty but has no GitHub login on file, so no review was requested."
          else
            reviewer_line="Whoever is on bug duty could not be resolved — please pick this up."
          fi

          # jq -n builds the payload so a PR title containing quotes or
          # backslashes cannot break out of the JSON.
          #
          # chat.postMessage answers 200 even when it refuses the message, so
          # -f proves nothing: a revoked token or a channel the app was never
          # invited to arrives as {"ok": false, "error": ...}. Without the -e
          # check this step goes green while the owning group is never pinged,
          # and an unnoticed bot PR is precisely the failure being designed out.
          jq -n \
            --arg channel "$CHANNEL" \
            --arg text "${mention}A bot PR is open${ticket}: <${PR_URL}|${PR_TITLE}>. ${reviewer_line} Bot approval does not merge it — closing it is a fine outcome if the fix is wrong." \
            '{channel: $channel, text: $text}' \
            | curl -sSf -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_TOKEN" \
                -H 'Content-type: application/json; charset=utf-8' \
                --data @- \
            | tee /dev/stderr \
            | jq -e '.ok' > /dev/null

      # A SECOND, LOUDER ASK FOR THE ONE CLASS OF BOT PR NOBODY SHOULD MERGE ON
      # MOMENTUM: a fix to the release train itself.
      #
      # The announcement above goes to the PR channel and asks the owning group
      # to review. That is right for an ordinary bug fix and not enough here.
      # release.yml is the only path to prod, so a wrong change to it does not
      # break a feature, it stops every deploy — and the people who need to
      # weigh that are the ones already watching #bot-urgent, where the failure
      # that produced this PR was reported in the first place. Posting it there
      # puts the fix in the same thread of attention as the outage.
      #
      # TWO INDEPENDENT SIGNALS, because each catches what the other misses:
      #
      #   - the ClickUp ticket's name begins `[release]`, which is exactly what
      #     gpbot-release-failure-triage.yml files and nothing else does. This
      #     is provenance: the PR exists because the train went red.
      #   - the diff touches release.yml. This is blast radius, and it holds
      #     however the PR came to be — a ticket filed by hand, an agent that
      #     wandered into the file, a human's branch that happens to carry the
      #     bot prefix.
      #
      # Neither is sufficient alone. A release-failure ticket can be fixed
      # entirely outside release.yml (the Sep 17 convergence bug could equally
      # have been fixed in ci-plan-root.sh), and a PR from any other ticket can
      # still edit the train.
      - name: Ask for a human merge decision on release-train fixes
        id: merge_decision
        env:
          FROM_RELEASE_TICKET: ${{ steps.owner.outputs.from_release_ticket }}
          CUSTOM_ID: ${{ steps.owner.outputs.custom_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URGENT_CHANNEL: ${{ vars.SLACK_URGENT_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          from_release_ticket="${FROM_RELEASE_TICKET:-false}"

          # `--paginate` because a fix can arrive alongside a large formatting
          # pass, and release.yml sitting on page two would read as untouched.
          touches_train=false
          files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename' 2>/dev/null)" || files=''
          if [ -z "$files" ]; then
            # Unknown, not "no". Said out loud because the quiet version of
            # this is a pipeline change merged without the ask.
            echo "::warning::could not read the files on #$PR_NUMBER, so this could not be checked for release-pipeline changes"
          elif grep -qx '.github/workflows/release.yml' <<<"$files"; then
            touches_train=true
          fi

          echo "from a [release] ticket: $from_release_ticket; touches release.yml: $touches_train"
          if [ "$from_release_ticket" != "true" ] && [ "$touches_train" != "true" ]; then
            echo "ordinary bot PR; the announcement above is the whole ask"
            exit 0
          fi

          # LOUD, not degrading. Everywhere else in this job a missing
          # credential drops to a warning, because an announcement is better
          # late than never and the PR is still visible on GitHub. This one is
          # different: it is the step that puts a human in front of a change to
          # the only path to prod, and a green run that skipped it reads as
          # "asked and answered". Same rule as release-failure-alert.yml.
          if [ -z "${SLACK_TOKEN:-}" ] || [ -z "${URGENT_CHANNEL:-}" ]; then
            echo "::error::GPBOT_SLACK_BOT_TOKEN or SLACK_URGENT_CHANNEL_ID unset — #$PR_NUMBER changes the release train and nobody was asked to decide on it. Failing loudly."
            exit 1
          fi

          # A whole sentence per branch rather than a shared trailing clause.
          # The clause that used to be shared ("which is the only path to
          # prod") attached to the wrong noun in the ticket-only case, where
          # the nearest one is the failure.
          if [ "$from_release_ticket" = "true" ] && [ "$touches_train" = "true" ]; then
            why="It came from a release-train failure and it edits \`release.yml\`, the only path to prod."
          elif [ "$from_release_ticket" = "true" ]; then
            why="It came from a release-train failure, and the train is the only path to prod."
          else
            why="It edits \`release.yml\`, the only path to prod."
          fi
          ticket=""
          [ -n "$CUSTOM_ID" ] && ticket=" (<https://app.clickup.com/t/${CUSTOM_ID}|${CUSTOM_ID}>)"

          text=$(jq -rn --arg why "$why" --arg t "$ticket" --arg u "$PR_URL" --arg title "$PR_TITLE" \
            '":rotating_light: A bot PR needs a human merge decision: <\($u)|\($title)>\($t).\n\($why) A wrong change here stops every deploy rather than breaking one feature, so this wants a read from someone who knows the train.\nNothing will merge it automatically. Review it, or close it — closing is a fine outcome if the fix is wrong."')

          # Same normalisation as release-failure-alert.yml: always exactly one
          # JSON object, so a proxy error page cannot kill the step with a jq
          # parse error as its only account of what went wrong.
          slack() {
            local resp
            resp=$(curl -sS --max-time 20 -X POST "https://slack.com/api/$1" \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-type: application/json; charset=utf-8" --data @-) || resp=''
            if jq -e . <<<"$resp" >/dev/null 2>&1; then printf '%s' "$resp"
            else jq -nc --arg ep "$1" --arg body "${resp:0:200}" '{ok: false, error: ($ep + " answered something that is not JSON: " + $body)}'
            fi
          }
          error_of() { jq -r 'if .ok then "" else (.error // "unknown") end' <<<"$1"; }

          payload=$(jq -n --arg c "$URGENT_CHANNEL" --arg t "$text" '{channel: $c, text: $t}')
          resp=$(printf '%s' "$payload" | slack chat.postMessage)
          err=$(error_of "$resp")

          # The one failure this can fix itself, on a public channel. #bot-urgent
          # had no app in it at all until 2026-09-17, and the join needs
          # `channels:join`, which gp_ai_bot does not hold yet — so this usually
          # reports rather than repairs. Kept because the day the scope lands it
          # starts working, and because the error text is the instruction.
          if [ "$err" = "not_in_channel" ]; then
            join=$(jq -nc --arg c "$URGENT_CHANNEL" '{channel: $c}' | slack conversations.join)
            if [ "$(jq -r '.ok // false' <<<"$join")" != "true" ]; then
              echo "::error::Not in $URGENT_CHANNEL and could not join it ($(error_of "$join")). Invite @gp_ai_bot to #bot-urgent, or grant the app channels:join. NOBODY WAS ASKED TO DECIDE on a PR that changes the release train."
              exit 1
            fi
            resp=$(printf '%s' "$payload" | slack chat.postMessage)
            err=$(error_of "$resp")
          fi

          if [ -n "$err" ]; then
            echo "::error::Slack rejected the merge-decision request: $err. #$PR_NUMBER changes the release train and nobody was asked to decide on it."
            exit 1
          fi
          echo "asked #bot-urgent to decide on #$PR_NUMBER"
