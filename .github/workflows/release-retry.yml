name: release-retry

# Re-runs the jobs of a release run that failed only because GitHub lost a hosted
# runner or never started a job (ENG-11537, ENG-11530, ENG-11624). At most 2
# retries per run; never for a real failure; never once a newer release run
# exists. The rules live in .github/scripts/release-retry.sh, and its fixture test
# in .github/scripts/release-retry.self-test.sh.

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  retry:
    name: Retry lost-runner jobs
    # cancelled too: a job stopped by timeout-minutes concludes cancelled, and
    # so does its run. The script tells that apart from a manual cancel.
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Self-tested before it is trusted on a real run, the same idiom
      # judge-guard.yml and judge-comment.yml use for their scripts: a
      # classifier broken by an edit fails here with a clear reason instead of
      # quietly declining to retry the next lost release (ENG-11624).
      - name: Self-test the classifier
        run: bash .github/scripts/release-retry.self-test.sh

      - name: Retry if the run only lost or never started its jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bash .github/scripts/release-retry.sh
