name: promote

# Automated prod promotion (single-trunk). Rides the same push:main event as the
# rest of CI, waits for THIS commit's required dev checks (E2E + every prod-bound
# service deploy) to go green on dev, confirms dev is actually serving the commit,
# then deploys the SAME commit to prod by reusing the composite deploy actions
# with prod inputs. A final job records a GitHub Deployment (environment
# `production`) at the promoted SHA — the source of truth for what shipped.
# There is no qa and no master. Break glass: workflow_dispatch with force=true
# skips the gate and freeze and promotes anyway (see docs/deployment.md).
#
# Safety: freeze-switch gated (vars.PROMOTION_FROZEN), forward-only (ECS
# deployment circuit breaker auto-reverts a crash-on-boot image; no rollback
# here). See docs/deployment.md and
# docs/automated-prod-promotion-design.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to promote (defaults to the current main tip)
        required: false
      force:
        description: Break glass — skip the dev-green gate, serving check, and freeze
        required: false
        type: boolean
        default: false

# Only one promotion at a time. A burst of merges queues here; the superseded
# check in the gate lets the older ones bail so prod converges to the newest
# green commit. Never cancel-in-progress: a cancelled deploy can orphan a Pulumi
# state lock.
concurrency:
  group: promote-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  AWS_REGION: us-west-2

jobs:
  gate:
    name: Promotion gate
    runs-on: ubuntu-latest
    outputs:
      promote: ${{ steps.decide.outputs.promote }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve break-glass force flag
        id: force
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "::warning::FORCE promotion: bypassing the dev-green gate, serving check, and freeze switch."
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check freeze switch
        id: freeze
        env:
          FROZEN: ${{ vars.PROMOTION_FROZEN }}
        run: |
          if [ "${{ steps.force.outputs.force }}" = "true" ]; then
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$FROZEN" = "true" ]; then
            echo "::notice::Promotion is frozen (vars.PROMOTION_FROZEN=true). Skipping."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target SHA
        id: resolve
        if: steps.freeze.outputs.frozen != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            SHA="$INPUT_SHA"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Promotion candidate: $SHA"

      - name: Wait for dev checks to go green (bail if superseded)
        id: wait
        if: steps.freeze.outputs.frozen != 'true' && steps.force.outputs.force != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Workflow runs whose green-ness gates a prod ship. These have no path
          # filters, so they run on every main push. E2E lives inside gp-webapp.yml.
          # Every workflow here runs on every push to main (none is path-filtered),
          # so each has a run for the commit. E2E lives inside gp-webapp.yml.
          REQUIRED="gp-api.yml election-api.yml gp-webapp.yml gp-admin.yml candidate-sites.yml publish-experiments.yml gp-ai.yml"
          # Budget must exceed a slow-but-healthy E2E path: E2E Wait (45m job
          # timeout) + shards (30m) + summary (15m). 120m clears it with margin.
          DEADLINE=$(( $(date +%s) + 120*60 ))

          while :; do
            # Superseded check (push only): if a newer commit is main's tip, this
            # older commit's promotion is moot — the newer one's run handles it.
            if [ "$EVENT" = "push" ]; then
              TIP=$(gh api "repos/$REPO/commits/main" --jq '.sha')
              if [ "$TIP" != "$SHA" ]; then
                echo "::notice::$SHA was superseded by $TIP on main. Skipping this promotion."
                echo "superseded=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            pending=0
            failed=""
            for wf in $REQUIRED; do
              # `// empty` so a not-yet-registered run yields an empty string (not
              # base64 of a null-valued object), so the no-run guard below fires.
              run=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&event=push&per_page=1" \
                --jq '.workflow_runs[0] // empty | {status, conclusion} | @base64' 2>/dev/null || echo "")
              if [ -z "$run" ]; then
                pending=$((pending+1)); continue # run not registered yet — keep waiting
              fi
              decoded=$(echo "$run" | base64 --decode)
              status=$(echo "$decoded" | jq -r '.status')
              conclusion=$(echo "$decoded" | jq -r '.conclusion')
              if [ "$status" != "completed" ]; then
                pending=$((pending+1))
              elif [ "$conclusion" != "success" ]; then
                failed="$failed $wf($conclusion)"
              fi
            done

            if [ -n "$failed" ]; then
              echo "::error::Dev checks failed for $SHA:$failed. Not promoting."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All required dev checks are green for $SHA."
              echo "superseded=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for dev checks on $SHA ($pending still pending)."
              exit 1
            fi
            echo "Waiting: $pending required workflow(s) not yet complete for $SHA..."
            sleep 30
          done

      - name: Confirm dev is serving this commit
        id: serving
        if: steps.freeze.outputs.frozen != 'true' && steps.wait.outputs.superseded != 'true' && steps.force.outputs.force != 'true'
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          SERVING=$(curl -fsS https://gp-api-dev.goodparty.org/v1/version | jq -r '.commit')
          if [ "$SERVING" != "$SHA" ]; then
            echo "::error::Dev is serving $SERVING, not the candidate $SHA. Not promoting."
            exit 1
          fi
          echo "Dev is serving $SHA."

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.force.outputs.force }}" = "true" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.freeze.outputs.frozen }}" = "true" ]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.wait.outputs.superseded }}" = "true" ]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Prod deploys ──────────────────────────────────────────────────────────
  # Each job mirrors the service's former master-branch deploy, calling the same
  # composite action with prod inputs, against the promoted SHA. Images were
  # already built + pushed (SHA-tagged, immutable) by the dev deploy, so backends
  # just repoint prod at the existing image. Not atomic across services: a single
  # failure leaves prod mixed until the next promotion or a manual re-run.

  gp-api:
    name: Promote gp-api
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gp-api-deploy-prod
      cancel-in-progress: false
    env:
      IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/gp-api:${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api
          workspace: packages/gp-api
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:gp-api
          route-types: 'true'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy (Pulumi)
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: packages/gp-api
          command: npm run infra deploy prod
        env:
          GITHUB_TOKEN: ${{ github.token }}

  election-api:
    name: Promote election-api
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: election-api-deploy-prod
      cancel-in-progress: false
    env:
      IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/election-api:${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: election-api
          workspace: packages/election-api
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:election-api
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy (Pulumi)
        uses: ./.github/actions/pulumi-deploy
        with:
          working-directory: packages/election-api/deploy
          command: ./deploy.sh prod

  gp-webapp:
    name: Promote gp-webapp
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-webapp
          build-contracts: 'true'
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GP_WEBAPP }}
          target: production

  gp-admin:
    name: Promote gp-admin
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-admin
          build-contracts: 'true'
      - name: Build SDK
        run: npm run build -w packages/gp-sdk
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GP_ADMIN }}
          target: production

  candidate-sites:
    name: Promote candidate-sites
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
        with:
          app: candidate-sites
      - name: Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_CANDIDATE_SITES }}
          target: production

  publish-experiments:
    name: Promote experiment manifests
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Install runtime deps
        working-directory: packages/runbooks/scripts/python
        run: uv sync --frozen
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-pulumi-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish manifests to S3
        working-directory: packages/runbooks/scripts/python
        run: uv run python publish_experiments.py --env=prod

  # Records the promotion as a GitHub Deployment in the `production` environment,
  # at the PROMOTED SHA (needs.gate.outputs.sha) — not github.sha, which differs on
  # a workflow_dispatch that passes a custom sha (incl. force). We create it via the
  # API rather than a job-level `environment:` for two reasons the auto-create can't
  # satisfy: it must record the promoted sha, and the auto-create needs the same
  # deployments:write anyway. `needs` every deploy job, so a Deployment is recorded
  # only when the whole promotion succeeded — the source of truth for what shipped
  # (post_release_summary.py reads it).

  # Does a full set of gp-ai images exist for the promoted commit?
  #
  # gp-ai.yml builds all five on every main push, so the normal answer is yes and
  # this is a safety net rather than routine control flow. It still earns its
  # place for two cases:
  #
  #   workflow_dispatch of an older SHA — commits predating unconditional builds
  #   have no images, and pinning terraform to tags that were never pushed would
  #   make ECS fail the pull, trip the circuit breaker, and churn prod task
  #   definitions for nothing. This is the ONLY legitimate zero-image case; on a
  #   recent main push it means the build failed, hence a warning not a notice.
  #
  #   a PARTIAL set — one build failed. That is NOT a skip: promoting would
  #   leave prod running a mix of new and stale services, so it fails loudly.
  gp-ai-images:
    name: Check gp-ai images
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for a full image set
        id: check
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          found=0; missing=0; absent=""
          # KEEP IN SYNC with the "Build service matrix" step in gp-ai.yml, which
          # holds the same five names. A service added there but not here is
          # never image-checked, so promotion would pin terraform to a tag that
          # may not exist and let ECS fail the pull in prod.
          for s in broker pmf-engine serve-analyze ddhq-matcher engineer-agent; do
            if aws ecr describe-images --repository-name gp-ai-projects \
                 --image-ids "imageTag=$s-$SHA" --region "$AWS_REGION" >/dev/null 2>&1; then
              found=$((found+1))
            else
              missing=$((missing+1)); absent="$absent $s"
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "All 5 gp-ai images present for $SHA; promoting gp-ai."
          elif [ "$found" -eq 0 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No gp-ai images for $SHA. gp-ai.yml builds all five on every main push, so for a recent main commit this is UNEXPECTED and means the build failed or never pushed — investigate. It is only expected for a workflow_dispatch of a SHA predating unconditional builds. Skipping gp-ai promotion."
          else
            echo "::error::Partial gp-ai image set for $SHA ($found present,$absent missing). A build failed; refusing to promote a mixed set."
            exit 1
          fi

  gp-ai:
    name: Promote gp-ai
    needs: [gate, gp-ai-images]
    if: needs.gate.outputs.promote == 'true' && needs.gp-ai-images.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gp-ai-deploy-prod
      cancel-in-progress: false
    env:
      APPLY_DIR: /tmp/tfapply
      PLAN_DIR: /tmp/tfplans
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Both artifacts are consumed at PLAN time, so they must exist before any
      # root is planned or applied.
      - name: Build pmf-engine lambda package
        working-directory: packages/gp-ai
        run: bash pmf_engine/scripts/build_lambda_package.sh

      - name: Build serve-analyze lambda trigger
        working-directory: packages/gp-ai/infrastructure/modules/serve-analyze-fargate/lambda-trigger
        run: |
          npm ci
          npm run build

      # Same SHA-pinned images dev already proved — nothing is rebuilt here, the
      # tags are the artifacts the dev deploy verified. Parallel rather than
      # ordered for the same reason as dev: the roots' remote_state graph is
      # cyclic, so no topological order exists and the convergence pass below is
      # what actually catches a stale cross-root read.
      - name: apply prod/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/agent-experiment-metadata
      - name: apply prod/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/agent-run-inputs
      - name: apply prod/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/campaign-plan-lambda
      - name: apply prod/clickup-bot
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/clickup-bot
      - name: apply prod/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/pmf-engine-control-plane
      - name: apply prod/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/broker broker-${{ needs.gate.outputs.sha }}
      - name: apply prod/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/pmf-engine-fargate pmf-engine-${{ needs.gate.outputs.sha }}
      - name: apply prod/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/serve-analyze-fargate serve-analyze-${{ needs.gate.outputs.sha }}
      - name: apply prod/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/ddhq-matcher-fargate ddhq-matcher-${{ needs.gate.outputs.sha }}
      - name: apply prod/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/engineer-agent-fargate engineer-agent-${{ needs.gate.outputs.sha }}
      - name: apply prod/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-apply-root.sh prod/shared-infra

      - wait-all:

      - name: reverify prod/agent-experiment-metadata
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/agent-experiment-metadata
      - name: reverify prod/agent-run-inputs
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/agent-run-inputs
      - name: reverify prod/campaign-plan-lambda
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/campaign-plan-lambda
      - name: reverify prod/clickup-bot
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/clickup-bot
      - name: reverify prod/pmf-engine-control-plane
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/pmf-engine-control-plane
      - name: reverify prod/broker
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/broker broker-${{ needs.gate.outputs.sha }}
      - name: reverify prod/pmf-engine-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/pmf-engine-fargate pmf-engine-${{ needs.gate.outputs.sha }}
      - name: reverify prod/serve-analyze-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/serve-analyze-fargate serve-analyze-${{ needs.gate.outputs.sha }}
      - name: reverify prod/ddhq-matcher-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/ddhq-matcher-fargate ddhq-matcher-${{ needs.gate.outputs.sha }}
      - name: reverify prod/engineer-agent-fargate
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/engineer-agent-fargate engineer-agent-${{ needs.gate.outputs.sha }}
      - name: reverify prod/shared-infra
        background: true
        run: bash packages/gp-ai/infrastructure/scripts/ci-plan-root.sh prod/shared-infra

      - wait-all:

      - name: Convergence check
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=("$PLAN_DIR"/*.code)
          expected=$(find packages/gp-ai/infrastructure/environments/prod -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::expected $expected re-plan results but found ${#files[@]}; a root produced no output and its convergence is unknown"
            for f in "${files[@]}"; do echo "  got: $(basename "$f" .code)"; done
            exit 1
          fi
          bad=0
          for f in "${files[@]}"; do
            root=$(basename "$f" .code)
            code=$(cat "$f")
            if [ "$code" != "0" ]; then
              echo "::error::$root did not converge (plan exit $code after apply)"
              tail -40 "$PLAN_DIR/$root.txt" || true
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "all ${#files[@]} roots converged (expected $expected)"

      # A successful apply is not proof prod is running the promoted commit:
      # broker's circuit breaker rolls a bad image back and the service settles
      # on the OLD revision while the apply still reports success.
      - name: Verify prod is running the promoted commit
        run: bash packages/gp-ai/infrastructure/scripts/ci-verify-deployed.sh prod ${{ needs.gate.outputs.sha }}

  finalize:
    name: Record prod deployment
    needs:
      [
        gate,
        gp-api,
        election-api,
        gp-webapp,
        gp-admin,
        candidate-sites,
        publish-experiments,
        gp-ai-images,
        gp-ai,
      ]
    # An explicit `if` drops the implicit success() of `needs`, so check each
    # deploy job's result — otherwise a partial promotion records a false success.
    #
    # gp-ai needs BOTH clauses. A skipped gp-ai is legitimate on its own (nothing
    # to promote), but it is also what happens when gp-ai-images does not produce
    # outputs — whether it FAILED (partial image set) or was CANCELLED (runner
    # timeout, infra). Either way gp-ai's `if` is false and it skips, and
    # accepting that skip alone would record a successful production deployment
    # precisely when the image gate never cleared.
    #
    # Allowlist rather than `!= 'failure'`: the negative form lets `cancelled`
    # through. gp-ai-images can only legitimately be `skipped` when promotion is
    # off entirely, which the first clause already blocks.
    if: |
      needs.gate.outputs.promote == 'true' &&
      needs.gp-api.result == 'success' &&
      needs.election-api.result == 'success' &&
      needs.gp-webapp.result == 'success' &&
      needs.gp-admin.result == 'success' &&
      needs.candidate-sites.result == 'success' &&
      (needs.publish-experiments.result == 'success' || needs.publish-experiments.result == 'skipped') &&
      (needs.gp-ai-images.result == 'success' || needs.gp-ai-images.result == 'skipped') &&
      (needs.gp-ai.result == 'success' || needs.gp-ai.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record production deployment for the promoted SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          dep_id=$(jq -n --arg ref "$SHA" '{
              ref: $ref,
              environment: "production",
              production_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: "Automated promotion"
            }' | gh api "repos/$REPO/deployments" --input - --jq '.id')
          gh api "repos/$REPO/deployments/$dep_id/statuses" \
            -f state=success -f environment=production \
            -f description="Promoted to prod"
