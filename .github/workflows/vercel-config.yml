name: vercel-config

# Applies packages/vercel-config to Vercel. Not part of the release train: a
# settings change has no build to verify on dev first, so it applies on the
# push that merges it. The dispatch re-runs a failed apply from main.
on:
  push:
    branches: [main]
    paths:
      - 'packages/vercel-config/**'
      - '.github/workflows/vercel-config.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never cancel an apply mid-run: it would strand the state lock.
concurrency:
  group: vercel-config
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  WORKSPACE: packages/vercel-config

jobs:
  deploy:
    name: Apply Vercel config
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # VERCEL_TOKEN, the train's production deploy token, lives only in the
    # production environment. A job in an environment presents
    # `repo:thegoodparty/omni:environment:production` as its OIDC subject, so
    # the role below has to trust that subject (packages/vercel-config/AGENTS.md).
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: vercel-config
          workspace: ${{ env.WORKSPACE }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Pulumi
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          pulumi-version: '^3'

      - name: Restore Pulumi plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-vercel-config-${{ runner.os }}-${{ hashFiles('packages/vercel-config/package.json') }}

      - name: Install Pulumi plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('@pulumiverse/vercel/package.json').version")
          pulumi plugin install resource vercel "$VERSION" --server github://api.github.com/pulumiverse

      - name: Apply
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run infra -w ${{ env.WORKSPACE }} -- deploy
