name: release-failure-alert

# The release train (release.yml) is the only path to prod, so a failed run
# means prod is not shipping — and the Sep 2026 incident (ENG-11106/11107)
# showed a red train can sit unnoticed for days: ~20 consecutive failed runs
# before a human happened to look. This posts one Slack message to #bot-urgent
# per failed run, and one when the train goes green again.
#
# A separate workflow_run listener rather than a job inside release.yml: the
# train's job graph changes often (the autopilot roots alone added several
# jobs in one week), and a notify job wired via `needs:` silently stops
# observing any job someone forgets to list. Listening for the run's terminal
# conclusion can't drift.
#
# The message names the phase that died because the train's failure shape is
# easy to misread: a failed "Dev <service>" job SKIPS the E2E shards and the
# run's red gate job is still named "E2E" — during the Sep incident that got
# a deploy-role IAM failure triaged as an e2e problem.
#
# THE RECOVERY NOTICE IS THE ONLY EDGE-GATED HALF, and the asymmetry is load
# bearing. A green run posts only when the run before it was red, or the channel
# would get a message per merge. Every red run still posts unconditionally:
# repetition is the only thing that keeps a multi-day outage visible, and
# suppressing red -> red would rebuild exactly the silence this workflow exists
# to break. Because the state lookup is consulted on the green path alone, a bug
# in it can cost a missing or spurious recovery notice and can never swallow an
# alert. Anything that wants red -> red quiet needs a heartbeat to replace the
# repetition first; workflow_run cannot be that heartbeat, since a red train
# with nothing merging behind it produces no further events to listen to.
#
# State is re-derived from the GitHub API on every run rather than stored. A
# cached red/green flag drifts once and then lies forever; re-deriving means a
# missed event self-corrects on the next run. `cancelled` and `skipped` runs are
# TRANSPARENT to that lookup rather than green, because the train coalesces
# merge bursts into cancellations (see release.yml's concurrency note) and
# counting one as a state would read red -> cancelled -> red as a spurious
# recovery followed by a spurious alert. Only runs on main count, in the lookup
# and in the run being judged: run numbers are per workflow rather than per
# branch, so a green break-glass dispatch off a feature branch would otherwise
# slot into the sequence and clear a main that never went green.
#
# The lookup reads ONE page, so the page size is the horizon, and the two ways
# it can come back without a predecessor are not the same thing. A short page is
# all the history there is and means the train was never red. A full page means
# the horizon ran out first, which the train's own supersession makes possible:
# a merge burst cancels every queued run but the newest, so a long outage can
# bury the last decisive run under cancellations. The first case stays quiet;
# the second posts without an outage length, because dropping a real recovery is
# worse than not knowing how long it lasted.
#
# NO `concurrency:` GROUP HERE, deliberately. Serializing these listeners looks
# like the fix for two runs finishing at once, but a group with
# cancel-in-progress: false keeps only ONE pending run and cancels the
# previously pending one. That is the same supersession release.yml relies on to
# coalesce a merge burst, and here it would silently drop an alert. The green
# path is written to tolerate any execution order instead: it holds the notice
# back only when a NEWER decisive run is already red (the train is red again, so
# a recovery notice would be a lie), and posts past newer GREEN runs, which see
# green -> green and stay quiet, so deferring to them would mean nobody ever
# says it recovered.
#
# THIS WORKFLOW HAS NO QUIET FAILURE PATH, because it shipped with one and
# that path hid the alert completely. It also shipped carrying
# `secrets.SLACK_APP_BOT_TOKEN` — the ANALYTICS app, a member of
# #product-analytics and nothing else — so Slack answered `not_in_channel` to
# every alert it ever produced: all 18 the train earned between 2026-09-14 and
# 2026-09-17, each one downgraded to a `::warning::` on the theory that a red
# alert run beside every red release run would be noise. The train then sat red
# from 2026-09-16 15:07Z with nobody told, which is the exact incident this
# workflow exists for, while every one of its own runs was green.
#
# Three things follow, and none of them is optional:
#   - the app is gp_ai_bot, the one the humans' channels actually contain (see
#     the job's env block, and the same warning in gpbot-pr-triage.yml);
#   - a `not_in_channel` it can fix — a public channel it has not joined — it
#     fixes, rather than waiting to be noticed;
#   - a message it cannot deliver fails the run, which is the only signal left
#     that this alert exists at all.
#
# #1909 reached the second point independently and landed first, by having the
# analytics app self-join #bot-urgent. That is replaced here rather than kept:
# joining fixes the membership but leaves the posting app wrong, and the repo
# already standardises these channels on gp_ai_bot. It also kept the
# `::warning::` downgrade, so an undeliverable alert stayed green — the half of
# the bug that made the original silence last three days.

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  actions: read

jobs:
  notify:
    name: Alert on a failed or recovered release run
    # Every terminal conclusion that means the run did not succeed, except
    # 'cancelled' — that is the train coalescing a burst of merges
    # (release.yml's concurrency note) and is routine, not an incident — plus
    # 'success', which reaches the edge check below and usually stops there.
    if: contains(fromJson('["failure","timed_out","startup_failure","success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          # gp_ai_bot, the app every gpbot workflow carries — and NOT
          # secrets.SLACK_APP_BOT_TOKEN, which is what this shipped with. That
          # one is the analytics app: a member of #product-analytics only, so
          # it cannot post here at all. The two secrets differ by one word and
          # the wrong one is the one whose name reads like "the Slack app",
          # which is how this was picked; gpbot-pr-triage.yml has carried a
          # comment warning about precisely this swap since August.
          SLACK_TOKEN: ${{ secrets.GPBOT_SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.SLACK_URGENT_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          # Ahead of the green path's early exits on purpose, so every
          # successful release run exercises this too: the secret or the channel
          # var going missing now surfaces on the next recovery rather than
          # waiting for the next outage to discover it.
          if [ -z "$SLACK_TOKEN" ] || [ -z "$CHANNEL_ID" ]; then
            echo "::error::GPBOT_SLACK_BOT_TOKEN or SLACK_URGENT_CHANNEL_ID unset — cannot post release train state to Slack. Failing loudly."
            exit 1
          fi

          if [ "$CONCLUSION" = "success" ]; then
            # workflow_run fires for ANY completed release run, and release.yml
            # takes a workflow_dispatch that can be aimed at a branch other than
            # main (that is the break-glass path). Run numbers are sequential per
            # WORKFLOW rather than per branch, so such a run slots straight into
            # the sequence the state query below reads, and a green dispatch off
            # a feature branch would clear a main that is still red. Only main
            # reaches prod, so only main can say the train is shipping.
            #
            # Read from env rather than interpolated inline: a branch name is
            # attacker-shaped input, and `${{ }}` in the middle of a script is
            # how it becomes a shell injection.
            if [ "$HEAD_BRANCH" != "main" ]; then
              echo "::notice::Run #$RUN_NUMBER was on '$HEAD_BRANCH' rather than main, so it says nothing about whether prod is shipping."
              exit 0
            fi

            case "$RUN_NUMBER" in
              ''|*[!0-9]*)
                echo "::error::workflow_run.run_number was '$RUN_NUMBER', so the red/green edge cannot be resolved and recoveries would go unreported. Failing loudly."
                exit 1
                ;;
            esac

            # One page is the whole lookback, so the page size IS the horizon.
            # 100 is the endpoint's maximum. Named once and used for both the
            # request and the fullness test below, which have to agree.
            LOOKBACK=100
            page=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=completed&branch=main&per_page=$LOOKBACK")

            # The RAW count, read before the decisive filter throws the
            # cancelled runs away, because whether the page came back full is
            # what gives an absent predecessor its meaning further down.
            fetched=$(jq -r '.workflow_runs | length' <<<"$page")

            # Decisive runs only. Dropping cancelled/skipped here is what makes
            # them transparent rather than a state of their own.
            runs=$(jq -c '[.workflow_runs[]
                           | {n: .run_number, c: .conclusion}
                           | select(.c == "success" or .c == "failure" or .c == "timed_out" or .c == "startup_failure")]' <<<"$page")

            prev=$(jq -r --argjson n "$RUN_NUMBER" \
              '[.[] | select(.n < $n)] | sort_by(.n) | last | .c // "none"' <<<"$runs")

            if [ "$prev" = "success" ]; then
              echo "::notice::The train was already green before run #$RUN_NUMBER; nothing to clear."
              exit 0
            fi

            # NO PREDECESSOR MEANS TWO DIFFERENT THINGS and the page size is
            # what separates them. A SHORT page is the whole completed history
            # of this workflow, so there was never a red run to clear and
            # saying "recovered" would invent an outage. A FULL page means the
            # lookback ran out before it found one, and the reason it can is
            # the train's own supersession: a burst of merges cancels every
            # queued run but the newest, so a long outage can bury the last
            # decisive run under cancellations. Reading that as "nothing to
            # clear" would drop a real recovery, which is the single thing this
            # path must never do, so a full page posts without a length instead.
            if [ "$prev" = "none" ] && [ "$fetched" -lt "$LOOKBACK" ]; then
              echo "::notice::No decisive release run on main precedes #$RUN_NUMBER anywhere in this workflow's completed history, so there is no red state to clear."
              exit 0
            fi

            if [ "$(jq -r --argjson n "$RUN_NUMBER" 'any(.[]; .n > $n and .c != "success")' <<<"$runs")" = "true" ]; then
              echo "::notice::A release run newer than #$RUN_NUMBER has already failed, so the train is red again and this recovery notice would be stale. That run's own alert stands."
              exit 0
            fi

            # How long the outage ran, in runs. Left empty when the predecessor
            # fell outside the lookback: the notice then says so rather than
            # claiming a length it cannot count, and "0 failed runs" is exactly
            # the nonsense that would otherwise print.
            streak=""
            if [ "$prev" != "none" ]; then
              streak=$(jq -r --argjson n "$RUN_NUMBER" \
                '[.[] | select(.n < $n)] | sort_by(.n) | reverse | map(.c)
                 | (index("success") // length)' <<<"$runs")
            fi

            if [ -n "$streak" ]; then
              recovered="Recovered after $streak failed run(s)."
            else
              recovered="The outage ran longer than the last $LOOKBACK completed runs, so its length is unknown."
            fi

            text=$(jq -rn \
              --arg url "$RUN_URL" \
              --arg title "$RUN_TITLE" \
              --arg sha "${HEAD_SHA:0:9}" \
              --arg recovered "$recovered" \
              '":large_green_circle: Release train is green again. Prod is shipping.\nRun: <\($url)|\($title)> (\($sha))\n\($recovered)"')
            undelivered="THE RECOVERY NOTICE WAS NOT SENT."
          else
            # timed_out jobs conclude "timed_out", not "failure" — both count.
            failed=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")')

            # Phase, in pipeline order: a failed dev deploy skips the E2E
            # shards, so it wins the classification even though the "E2E" gate
            # job also reports failure in that case. A startup_failure run
            # schedules no jobs at all, so the job-name case has nothing to
            # match on.
            if [ "$CONCLUSION" = "startup_failure" ]; then
              phase="runner startup failure (no jobs ran)"
            else
              # "Dev " before "Verify dev serving": verify-dev only needs
              # gp-api + gp-webapp, so it can fail alongside another parallel
              # Dev job — and the deploy failure is then the real story.
              case "$failed" in
                *"Await checks"*) phase="checks gate (pre-deploy checks failed)" ;;
                *"Dev "*)    phase="dev deploy (E2E shards were skipped, not run)" ;;
                *"Verify dev serving"*) phase="dev serving verification (dev did not converge to the deployed SHA)" ;;
                *"E2E"*)     phase="E2E against dev" ;;
                *"Promote"*|*"Record prod"*|*"Check gp-ai"*) phase="prod promotion" ;;
                *)           phase="unknown — read the run" ;;
              esac
            fi

            text=$(jq -rn \
              --arg phase "$phase" \
              --arg failed "${failed:-none reported}" \
              --arg url "$RUN_URL" \
              --arg title "$RUN_TITLE" \
              --arg sha "${HEAD_SHA:0:9}" \
              '":red_circle: Release train failed at: \($phase). Prod is not shipping until a run goes green.\nRun: <\($url)|\($title)> (\($sha))\nFailed jobs: \($failed)"')
            undelivered="THE ALERT WAS NOT SENT and prod is not shipping."
          fi

          payload=$(jq -n --arg c "$CHANNEL_ID" --arg t "$text" '{channel: $c, text: $t}')

          # `-sS` rather than the `-sf` this used to carry: every Slack refusal
          # worth reading arrives as HTTP 200 with `ok:false`, and `-f` throws
          # the body away on the ones that do not — which is the error string
          # the decision below is made on.
          #
          # ALWAYS PRINTS ONE JSON OBJECT, so nothing downstream has to wonder.
          # A proxy error page or a dropped connection is not JSON, and feeding
          # it to jq kills this step under `set -e` with a parse error for its
          # only output — red, correctly, but saying nothing about the alert it
          # just failed to deliver. Normalising here is what lets the checks
          # below be written once and read as the reasons they are.
          slack() {
            local resp
            resp=$(curl -sS --max-time 20 -X POST "https://slack.com/api/$1" \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-type: application/json; charset=utf-8" \
              --data @-) || resp=''
            if jq -e . <<<"$resp" >/dev/null 2>&1; then
              printf '%s' "$resp"
            else
              # jq assembles the stand-in so a body carrying quotes or
              # backslashes cannot break the one object this promises to print.
              jq -nc --arg ep "$1" --arg body "${resp:0:200}" \
                '{ok: false, error: ($ep + " answered something that is not JSON: " + $body)}'
            fi
          }
          error_of() { jq -r 'if .ok then "" else (.error // "unknown") end' <<<"$1"; }

          resp=$(printf '%s' "$payload" | slack chat.postMessage)
          err=$(error_of "$resp")

          # THE ONE FAILURE THIS CAN FIX ITSELF. `not_in_channel` on a public
          # channel needs no invitation — joining is a call this app can make —
          # and waiting for a human to notice is what cost three days. Reactive
          # rather than an unconditional join before the post, because the alert
          # is the fast half of the pair and the healthy path should stay one
          # round trip. (gpbot-dev-test-triage.yml joins up front instead: it
          # also has to READ the channel, so it needs membership before its
          # first call rather than after a refused one.)
          if [ "$err" = "not_in_channel" ]; then
            join=$(jq -nc --arg c "$CHANNEL_ID" '{channel: $c}' | slack conversations.join)
            if [ "$(jq -r '.ok // false' <<<"$join")" != "true" ]; then
              echo "::error::Not in $CHANNEL_ID and could not join it ($(error_of "$join")). Grant the app the channels:join scope, or invite it to #bot-urgent by hand. $undelivered"
              exit 1
            fi
            echo "::notice::The app was not in $CHANNEL_ID; joined it and re-sent the message."
            resp=$(printf '%s' "$payload" | slack chat.postMessage)
            err=$(error_of "$resp")
          fi

          # Everything else — a bad token, a deleted channel, a rate limit, a
          # join that Slack accepted but that did not take — is a human who was
          # never told about a train that is not shipping. A red run here is the
          # only remaining signal that this alert exists at all.
          if [ -n "$err" ]; then
            echo "::error::Slack rejected the message: $err. $undelivered"
            exit 1
          fi
