name: release-failure-alert

# The release train (release.yml) is the only path to prod, so a failed run
# means prod is not shipping — and the Sep 2026 incident (ENG-11106/11107)
# showed a red train can sit unnoticed for days: ~20 consecutive failed runs
# before a human happened to look. This posts one Slack message to #bot-urgent
# per failed run.
#
# A separate workflow_run listener rather than a job inside release.yml: the
# train's job graph changes often (the autopilot roots alone added several
# jobs in one week), and a notify job wired via `needs:` silently stops
# observing any job someone forgets to list. Listening for the run's terminal
# conclusion can't drift.
#
# The message names the phase that died because the train's failure shape is
# easy to misread: a failed "Dev <service>" job SKIPS the E2E shards and the
# run's red gate job is still named "E2E" — during the Sep incident that got
# a deploy-role IAM failure triaged as an e2e problem.
#
# THIS WORKFLOW HAS NO QUIET FAILURE PATH, because it shipped with one and
# that path hid the alert completely. It also shipped carrying
# `secrets.SLACK_APP_BOT_TOKEN` — the ANALYTICS app, a member of
# #product-analytics and nothing else — so Slack answered `not_in_channel` to
# every alert it ever produced: all 18 the train earned between 2026-09-14 and
# 2026-09-17, each one downgraded to a `::warning::` on the theory that a red
# alert run beside every red release run would be noise. The train then sat red
# from 2026-09-16 15:07Z with nobody told, which is the exact incident this
# workflow exists for, while every one of its own runs was green.
#
# Three things follow, and none of them is optional:
#   - the app is gp_ai_bot, the one every other gpbot workflow posts with (see
#     the job's env block, and the same warning in gpbot-pr-triage.yml);
#   - a `not_in_channel` it can fix — a public channel it has not joined — it
#     fixes, rather than waiting to be noticed;
#   - an alert it cannot deliver fails the run, which is the only signal left
#     that this alert exists at all.
#
# #1909 reached the second point independently and landed first, by having the
# analytics app self-join #bot-urgent. That is replaced here rather than kept:
# joining fixes the membership but leaves the posting app wrong, and the repo
# already standardises these channels on gp_ai_bot. It also kept the
# `::warning::` downgrade, so an undeliverable alert stayed green — the half of
# the bug that made the original silence last three days.
#
# THE SELF-JOIN ABOVE STILL CANNOT SUCCEED, and it is worth knowing why before
# reading it as dead code to delete. Dispatching the sibling triage against a
# real failed run on 2026-09-17 answered:
#
#   Could not join C0C1JSUPPEX (missing_scope)
#   Slack rejected the disposition: not_in_channel
#
# #bot-urgent is a public channel, so `conversations.join` is the right call —
# but the gp_ai_bot app has not been granted `channels:join`, so it could
# neither be in the channel nor let itself in. The channel held eight members
# and every one was a human; no bot had ever been in it.
#
# Delivery was then fixed from the Slack side, by invite, and the identical
# dispatch twelve minutes later posted and went green. So the token, the
# channel id and this posting code are all proven end to end — what remains
# unproven is only the message this file assembles, which needs a real failed
# release to exercise.
#
# The join is kept because the scope is still ungranted: the next channel these
# alerts are pointed at will land in exactly the state #bot-urgent was in, and
# this branch is what fixes it without waiting to be noticed. Granting
# `channels:join` at api.slack.com is what makes it work.
#
# That episode also retires the earlier claim here that gp_ai_bot is "the one
# the humans' channels actually contain". It posts fine to GPBOT_PR_CHANNEL_ID
# with this same token (gpbot-stale-pr-alert.yml has been green for days), and
# that was the whole of the evidence the claim rested on.

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  actions: read

jobs:
  notify:
    name: Alert on failed release run
    # Every terminal conclusion that means the run did not succeed, except
    # 'cancelled' — that is the train coalescing a burst of merges
    # (release.yml's concurrency note) and is routine, not an incident.
    if: contains(fromJson('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          # gp_ai_bot, the app every gpbot workflow carries — and NOT
          # secrets.SLACK_APP_BOT_TOKEN, which is what this shipped with. That
          # one is the analytics app: a member of #product-analytics only, so
          # it cannot post here at all. The two secrets differ by one word and
          # the wrong one is the one whose name reads like "the Slack app",
          # which is how this was picked; gpbot-pr-triage.yml has carried a
          # comment warning about precisely this swap since August.
          SLACK_TOKEN: ${{ secrets.GPBOT_SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.SLACK_URGENT_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_TOKEN" ] || [ -z "$CHANNEL_ID" ]; then
            echo "::error::GPBOT_SLACK_BOT_TOKEN or SLACK_URGENT_CHANNEL_ID unset — cannot alert on a failed release run. Failing loudly."
            exit 1
          fi

          # timed_out jobs conclude "timed_out", not "failure" — both count.
          failed=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")')

          # Phase, in pipeline order: a failed dev deploy skips the E2E shards,
          # so it wins the classification even though the "E2E" gate job also
          # reports failure in that case. A startup_failure run schedules no
          # jobs at all, so the job-name case has nothing to match on.
          if [ "$CONCLUSION" = "startup_failure" ]; then
            phase="runner startup failure (no jobs ran)"
          else
            # "Dev " before "Verify dev serving": verify-dev only needs
            # gp-api + gp-webapp, so it can fail alongside another parallel
            # Dev job — and the deploy failure is then the real story.
            case "$failed" in
              *"Await checks"*) phase="checks gate (pre-deploy checks failed)" ;;
              *"Dev "*)    phase="dev deploy (E2E shards were skipped, not run)" ;;
              *"Verify dev serving"*) phase="dev serving verification (dev did not converge to the deployed SHA)" ;;
              *"E2E"*)     phase="E2E against dev" ;;
              *"Promote"*|*"Record prod"*|*"Check gp-ai"*) phase="prod promotion" ;;
              *)           phase="unknown — read the run" ;;
            esac
          fi

          text=$(jq -rn \
            --arg phase "$phase" \
            --arg failed "${failed:-none reported}" \
            --arg url "$RUN_URL" \
            --arg title "$RUN_TITLE" \
            --arg sha "${HEAD_SHA:0:9}" \
            '":red_circle: Release train failed at: \($phase). Prod is not shipping until a run goes green.\nRun: <\($url)|\($title)> (\($sha))\nFailed jobs: \($failed)"')

          payload=$(jq -n --arg c "$CHANNEL_ID" --arg t "$text" '{channel: $c, text: $t}')

          # `-sS` rather than the `-sf` this used to carry: every Slack refusal
          # worth reading arrives as HTTP 200 with `ok:false`, and `-f` throws
          # the body away on the ones that do not — which is the error string
          # the decision below is made on.
          #
          # ALWAYS PRINTS ONE JSON OBJECT, so nothing downstream has to wonder.
          # A proxy error page or a dropped connection is not JSON, and feeding
          # it to jq kills this step under `set -e` with a parse error for its
          # only output — red, correctly, but saying nothing about the alert it
          # just failed to deliver. Normalising here is what lets the checks
          # below be written once and read as the reasons they are.
          slack() {
            local resp
            resp=$(curl -sS --max-time 20 -X POST "https://slack.com/api/$1" \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-type: application/json; charset=utf-8" \
              --data @-) || resp=''
            if jq -e . <<<"$resp" >/dev/null 2>&1; then
              printf '%s' "$resp"
            else
              # jq assembles the stand-in so a body carrying quotes or
              # backslashes cannot break the one object this promises to print.
              jq -nc --arg ep "$1" --arg body "${resp:0:200}" \
                '{ok: false, error: ($ep + " answered something that is not JSON: " + $body)}'
            fi
          }
          error_of() { jq -r 'if .ok then "" else (.error // "unknown") end' <<<"$1"; }

          resp=$(printf '%s' "$payload" | slack chat.postMessage)
          err=$(error_of "$resp")

          # THE ONE FAILURE THIS CAN FIX ITSELF. `not_in_channel` on a public
          # channel needs no invitation — joining is a call this app can make —
          # and waiting for a human to notice is what cost three days. Reactive
          # rather than an unconditional join before the post, because the alert
          # is the fast half of the pair and the healthy path should stay one
          # round trip. (gpbot-dev-test-triage.yml joins up front instead: it
          # also has to READ the channel, so it needs membership before its
          # first call rather than after a refused one.)
          if [ "$err" = "not_in_channel" ]; then
            join=$(jq -nc --arg c "$CHANNEL_ID" '{channel: $c}' | slack conversations.join)
            if [ "$(jq -r '.ok // false' <<<"$join")" != "true" ]; then
              echo "::error::Not in $CHANNEL_ID and could not join it ($(error_of "$join")). Grant the app the channels:join scope, or invite it to #bot-urgent by hand. THE ALERT WAS NOT SENT and prod is not shipping."
              exit 1
            fi
            echo "::notice::The app was not in $CHANNEL_ID; joined it and re-sent the alert."
            resp=$(printf '%s' "$payload" | slack chat.postMessage)
            err=$(error_of "$resp")
          fi

          # Everything else — a bad token, a deleted channel, a rate limit, a
          # join that Slack accepted but that did not take — is a human who was
          # never told about a train that is not shipping. A red run here is the
          # only remaining signal that this alert exists at all.
          if [ -n "$err" ]; then
            echo "::error::Slack rejected the alert: $err. THE ALERT WAS NOT SENT and prod is not shipping."
            exit 1
          fi
