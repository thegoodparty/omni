name: release-failure-alert

# The release train (release.yml) is the only path to prod, so a failed run
# means prod is not shipping — and the Sep 2026 incident (ENG-11106/11107)
# showed a red train can sit unnoticed for days: ~20 consecutive failed runs
# before a human happened to look. This posts one Slack message to #bot-urgent
# per failed run.
#
# A separate workflow_run listener rather than a job inside release.yml: the
# train's job graph changes often (the autopilot roots alone added several
# jobs in one week), and a notify job wired via `needs:` silently stops
# observing any job someone forgets to list. Listening for the run's terminal
# conclusion can't drift.
#
# The message names the phase that died because the train's failure shape is
# easy to misread: a failed "Dev <service>" job SKIPS the E2E shards and the
# run's red gate job is still named "E2E" — during the Sep incident that got
# a deploy-role IAM failure triaged as an e2e problem.

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  actions: read

jobs:
  notify:
    name: Alert on failed release run
    # Every terminal conclusion that means the run did not succeed, except
    # 'cancelled' — that is the train coalescing a burst of merges
    # (release.yml's concurrency note) and is routine, not an incident.
    if: contains(fromJson('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_APP_BOT_TOKEN: ${{ secrets.SLACK_APP_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.SLACK_URGENT_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_APP_BOT_TOKEN" ] || [ -z "$CHANNEL_ID" ]; then
            echo "::error::SLACK_APP_BOT_TOKEN or SLACK_URGENT_CHANNEL_ID unset — cannot alert on a failed release run. Failing loudly."
            exit 1
          fi

          failed=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')

          # Phase, in pipeline order: a failed dev deploy skips the E2E shards,
          # so it wins the classification even though the "E2E" gate job also
          # reports failure in that case.
          case "$failed" in
            *"Dev "*)    phase="dev deploy (E2E shards were skipped, not run)" ;;
            *"E2E"*)     phase="E2E against dev" ;;
            *"Promote"*|*"Record prod"*|*"Check gp-ai"*) phase="prod promotion" ;;
            *)           phase="unknown — read the run" ;;
          esac

          text=$(jq -rn \
            --arg phase "$phase" \
            --arg failed "${failed:-none reported}" \
            --arg url "$RUN_URL" \
            --arg title "$RUN_TITLE" \
            --arg sha "${HEAD_SHA:0:9}" \
            '":red_circle: Release train failed at: \($phase). Prod is not shipping until a run goes green.\nRun: <\($url)|\($title)> (\($sha))\nFailed jobs: \($failed)"')

          resp=$(jq -n --arg c "$CHANNEL_ID" --arg t "$text" '{channel: $c, text: $t}' | \
            curl -sf -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_APP_BOT_TOKEN" \
              -H "Content-type: application/json; charset=utf-8" \
              --data @-)
          if [ "$(echo "$resp" | jq -r .ok)" != "true" ]; then
            echo "::error::Slack rejected the alert: $(echo "$resp" | jq -r .error). If not_in_channel, invite the goodparty app to #bot-urgent."
            exit 1
          fi
