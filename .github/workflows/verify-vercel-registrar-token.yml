name: Verify Vercel registrar token

# Answers one question: can gp-api's configured VERCEL_TOKEN actually mint
# domain transfer auth codes?
#
# The registrar API rejects tokens without Owner scope on the team, and nothing
# else exercises that path — the token works fine for the deploy and DNS calls
# we make every day, so a scope regression stays invisible until a candidate is
# waiting on a transfer. This runs in CI rather than on a laptop because the
# deploy role can already read the secret, which means nobody has to copy a
# production credential to their machine to answer the question.
#
# The token is read from Secrets Manager, masked immediately, and never
# printed. The registrar probe deliberately targets a domain we do not own, so
# a real auth code is never requested or returned.
#
# Deliberately no `pull_request` trigger, though it had one so that edits here
# could be exercised before merging. The handling below is careful, but on a
# pull request the job definition is whatever the branch says it is, so that
# care is not a property of the run. `vars.AWS_ROLE_ARN` grants Secrets
# Manager broadly, and a job that reads a production secret should not be
# reachable from an event that also supplies its own body. Test an edit by
# dispatching it against `main` after it merges; the weekly schedule catches
# anything missed.

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which gp-api secret to check
        type: choice
        options: [prod, dev]
        default: prod
  schedule:
    # Weekly. The failure mode is someone's Vercel team role changing, which
    # has nothing to do with our deploys, so there is no event to hook onto.
    - cron: '0 14 * * 1'

jobs:
  verify:
    name: Verify ${{ inputs.environment || 'prod' }} token
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Check token scope
        env:
          # Scheduled runs have no inputs, so this falls through to PROD.
          SECRET_NAME: GP_API_${{ inputs.environment == 'dev' && 'DEV' || 'PROD' }}
        run: |
          set -euo pipefail

          # The secret holds every gp-api credential — CLERK_SECRET_KEY,
          # DATABASE_URL, STRIPE_SECRET_KEY, the Peerly keys. Only the two
          # values this check needs are pulled out, and the blob exists only
          # inside this pipe, never in a variable something could later echo.
          # Masking the whole blob instead would not work anyway: `add-mask`
          # is line-oriented and a JSON document is one long line whose
          # individual values it would not redact.
          {
            read -r TOKEN
            read -r TEAM_ID
          } < <(
            aws secretsmanager get-secret-value \
              --secret-id "$SECRET_NAME" \
              --query SecretString --output text \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('VERCEL_TOKEN',''));print(d.get('VERCEL_TEAM_ID',''))"
          )

          # Values read at runtime are not auto-redacted the way `secrets.*`
          # are, so register them before the first request can surface one in
          # an error message.
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$TEAM_ID"

          # Nothing is written to $GITHUB_ENV or $GITHUB_OUTPUT, so neither
          # value outlives this step.

          if [ -z "$TOKEN" ]; then
            echo "FAIL: VERCEL_TOKEN is not set in $SECRET_NAME"
            exit 1
          fi
          if [ -z "$TEAM_ID" ]; then
            echo "FAIL: VERCEL_TEAM_ID is not set in $SECRET_NAME"
            exit 1
          fi

          # Two independent signals, both required. Vercel's ordering of
          # auth-vs-existence checks is not documented, so a 404 on a domain
          # we do not own is not by itself proof that scope is fine — it may
          # simply 404 before looking at the token. Treating either signal as
          # sufficient risks a silent false pass on the one thing this exists
          # to catch, so a non-Owner role fails even when the probe is happy.
          ROLE_NOTE=""
          PROBE_NOTE=""

          # --- 1. What role does the token hold on the team? ----------------
          # The direct answer to "does it have Owner". Reported even when the
          # probe below passes, because it is what someone fixing this needs.
          TEAM_BODY=$(curl -sS \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.vercel.com/v2/teams/$TEAM_ID")

          # Read each field on its own, rather than eval-ing a line built from
          # the response: command substitution does not re-interpret its
          # output as shell, so a team name containing a quote is inert here.
          # Only the display name and our own role are ever echoed, never the
          # body — a team response carries other members' details.
          field() {
            printf '%s' "$TEAM_BODY" | python3 -c \
              "import sys,json;d=json.load(sys.stdin);print($1 or 'unknown')" \
              2>/dev/null || echo unparseable
          }

          TEAM_NAME=$(field "d.get('name') or d.get('slug')")
          TEAM_ROLE=$(field "(d.get('membership') or {}).get('role')")

          echo "Team:  $TEAM_NAME"
          echo "Role:  $TEAM_ROLE"

          # `unknown` covers a team endpoint that does not report our own
          # membership, in which case the probe is all we have to go on.
          if [ "$TEAM_ROLE" != "OWNER" ] && [ "$TEAM_ROLE" != "unknown" ]; then
            echo "  ^ not OWNER — the registrar API requires it"
            ROLE_NOTE="team role is $TEAM_ROLE, not OWNER"
          fi

          # --- 2. Can the token actually reach the registrar? ---------------
          # Probing a domain we do not own separates the two failure modes
          # without ever requesting a real credential:
          #   403 -> the token cannot use the registrar API at all
          #   404 -> the token can; this domain just isn't ours
          # `-o /dev/null` discards the body, so even an unexpected 200 cannot
          # leak an auth code into the run log.
          PROBE_DOMAIN="gp-registrar-scope-probe-$(date +%s)-$RANDOM.com"
          PROBE_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.vercel.com/v1/registrar/domains/$PROBE_DOMAIN/auth-code?teamId=$TEAM_ID")

          echo "Registrar probe: HTTP $PROBE_STATUS"

          case "$PROBE_STATUS" in
            404|400)
              echo "  ^ reached the registrar; the probe domain is not ours"
              ;;
            403)
              echo "  ^ registrar refused the token. This is exactly what"
              echo "    GET /v1/domains/auth-code surfaces as a 502."
              PROBE_NOTE="registrar returned 403"
              ;;
            401)
              echo "  ^ token rejected outright — expired or revoked"
              PROBE_NOTE="token rejected (401)"
              ;;
            200)
              # Would mean we own a randomly generated name. Not a scope
              # failure, but worth a human look.
              echo "  ^ unexpected 200 for a random domain; investigate"
              ;;
            *)
              echo "  ^ unexpected status"
              PROBE_NOTE="unexpected status $PROBE_STATUS"
              ;;
          esac

          echo
          if [ -n "$ROLE_NOTE" ] || [ -n "$PROBE_NOTE" ]; then
            echo "RESULT: $SECRET_NAME likely cannot issue domain transfer auth codes."
            [ -n "$ROLE_NOTE" ] && echo "  - $ROLE_NOTE"
            [ -n "$PROBE_NOTE" ] && echo "  - $PROBE_NOTE"
            if [ -n "$ROLE_NOTE" ] && [ -z "$PROBE_NOTE" ]; then
              echo
              echo "The probe reached the registrar, but on a domain we do not"
              echo "own — which Vercel may reject before it considers scope."
              echo "The role is the signal to trust here."
            fi
            echo
            echo "Fix: in the Vercel dashboard, give the account owning this"
            echo "token the Owner role on the team, or reissue the token from"
            echo "an Owner account and update VERCEL_TOKEN in $SECRET_NAME."
            echo "Redeploy gp-api afterwards — it reads the secret at boot."
            exit 1
          fi

          echo "RESULT: $SECRET_NAME can issue domain transfer auth codes."
