name: gpbot CI drive

# Keeps driving a [GP-Bot] PR after it is opened, instead of walking away from it.
#
# PR #1306 was opened 2026-08-18, approved by delegate-reviewer[bot], and then sat
# for two days on a red `E2E` check because the run that opened it had already
# exited. The implement instruction ends at "Post the PR link to ClickUp when
# done", and nothing came after that.
#
# TWO THINGS ARE DRIVEN, not one. The same PR also carried a correct
# high-severity Cursor Bugbot finding that nobody ever answered: Bugbot posts a
# COMMENTED review rather than CHANGES_REQUESTED so it never blocks, and
# delegate's approval satisfies the ruleset on its own. The PR merged with the
# thread still open and the regression reached main (fixed later in #1431). So a
# green board is not the end of this workflow's job — an unanswered finding is
# work too, on the same budget. See clickup_bot/ci_triage.py.
#
# WHY THIS IS AN EVENT AND NOT PART OF THE AGENT RUN: `E2E` waits on a full gp-api
# preview deploy before its suite starts and routinely takes ~45 minutes, which is
# the agent's entire DEFAULT_DEADLINE_SECONDS (engineer_agent/agent/config.py).
# "Poll until the checks finish" would spend the whole run idling on Fargate and
# have nothing left for the fix.
#
# WHY `workflow_run` AND NOT `check_suite`: `check_suite` cannot work here at all.
# GitHub does not deliver it "if the check suite was created by GitHub Actions",
# and every check on an omni PR is created by GitHub Actions, so the workflow
# would simply never fire. `workflow_run` has no such restriction, carries secrets
# and a write token, and is the only one of the two that is actually delivered.
#
# THIS WORKFLOW MUST NEVER MERGE ANYTHING — same contract as gpbot-pr-triage.yml.
# delegate-reviewer approves every PR, which satisfies the ruleset's one-approval
# requirement, so the only thing keeping a human in the loop is that nothing calls
# merge. Do not add `gh pr merge` and do not add `--auto`. Getting CI green is the
# end of this workflow's job; a human still decides what lands.

on:
  workflow_run:
    # Only workflows that contribute a merge-gating check. This list is a latency
    # optimisation, not the correctness boundary — whichever watched workflow
    # finishes last is the one that sees a fully-resolved board, and the schedule
    # below covers anything this list misses.
    #
    # gpbot-* workflows are deliberately absent: watching itself would recurse.
    workflows:
      - agents-md
      - candidate-sites
      - contracts
      - dependency-review
      - election-api
      - gp-admin
      - gp-ai
      - gp-api
      - gp-sdk
      - gp-webapp
      - prototypes
      - styleguide
      - Publish PMF experiments
    types: [completed]
  schedule:
    # BACKSTOP, and load-bearing rather than decorative — the same lesson the
    # reconciliation sweep learned (see clickup_bot/README.md, "The sweep"):
    # subscribing to events does not catch everything.
    #
    # Three known gaps it covers. GitHub suppresses events triggered by actions
    # taken with GITHUB_TOKEN, so the re-run this workflow requests may not
    # produce a `workflow_run` event when it finishes. The concurrency group below
    # keeps only one queued run per group and cancels the rest. And a workflow
    # added later that is not in the list above contributes a check nobody is
    # watching for.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Drive a single PR (leave blank to sweep every open bot PR)'
        required: false

permissions:
  contents: read
  # Re-running the failed jobs of an existing run, which is the cheap action this
  # whole design is built around reaching for first.
  actions: write
  # The marker comment that makes the attempt counters durable.
  pull-requests: write
  # OIDC for the Lambda invoke that launches a fix run.
  id-token: write

concurrency:
  # One drive at a time, repo-wide. The marker comment is read-modify-written, so
  # two concurrent drives on one PR could both read the same pre-write counters
  # and each spend a round against it. Serialising removes that race outright, and
  # a pass is only a handful of API calls.
  group: gpbot-ci-drive
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  # Terminal statuses that mean a check produced no usable verdict or a bad one.
  # Spans both rollup shapes: CheckRun conclusions and the Commit Statuses API's
  # states, whose failure spelling is ERROR as well as FAILURE — without ERROR a
  # crashed Vercel deployment is dropped from the failing set and the PR is
  # reported "all checks green".
  # NEUTRAL and SKIPPED are absent on purpose: an advisory or skipped check is not
  # a merge gate, and treating one as a failure would drive every PR forever.
  # Everything else GitHub can conclude with belongs here, including STALE, which
  # is a run the platform abandoned: a conclusion missing from this list is
  # dropped from the failing set entirely and the PR is reported "all checks
  # green", which is the one wrong answer this workflow must never give.
  FAILED_CONCLUSIONS: 'FAILURE,ERROR,CANCELLED,TIMED_OUT,STARTUP_FAILURE,ACTION_REQUIRED,STALE'

jobs:
  drive:
    name: Drive bot PRs to green
    runs-on: ubuntu-latest
    # Bounds a stall. cancel-in-progress is false, so a job hung on a slow API
    # would otherwise hold the group for GitHub's default six hours and stop every
    # bot PR being driven at all.
    timeout-minutes: 15
    env:
      # gp_ai_bot — see the same note in gpbot-pr-triage.yml. All three gpbot
      # workflows post to the same channel, so they must carry the same app.
      SLACK_TOKEN: ${{ secrets.GPBOT_SLACK_BOT_TOKEN }}
      CHANNEL: ${{ vars.GPBOT_PR_CHANNEL_ID }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: packages/gp-ai/clickup_bot/ci_triage.py
          sparse-checkout-cone-mode: false

      # AWS is only needed for the fix action, but credentials cannot be acquired
      # conditionally mid-script. Assuming the role costs nothing when unused.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      # Which PRs to look at. A workflow_run event names one commit, which may
      # belong to no PR at all (a push to main) — that is the common case and must
      # exit silently.
      - name: Resolve candidate PRs
        id: candidates
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_PR:-}" ]; then
            prs="$INPUT_PR"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            # Resolved from the commit rather than read off
            # event.workflow_run.pull_requests, which is empty for a fork PR and
            # has been observed empty otherwise.
            prs="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[] | select(.state == "open") | .number' || true)"
          else
            # Schedule: every open bot PR. Gated on the same two signals as
            # gpbot-pr-triage.yml, because the two come from different places (the
            # agent's git commands vs. its gh call) and either alone has been
            # wrong before.
            prs="$(gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,title,headRefName \
              --jq '.[] | select((.title | startswith("[GP-Bot]")) or (.headRefName | contains("/gp-bot_"))) | .number' || true)"
          fi

          echo "candidates: ${prs:-<none>}"
          {
            echo 'prs<<PRS_EOF'
            printf '%s\n' "${prs:-}"
            echo 'PRS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Triage and drive
        if: steps.candidates.outputs.prs != ''
        env:
          PR_NUMBERS: ${{ steps.candidates.outputs.prs }}
          LAMBDA_FUNCTION: clickup-bot-prod
        # THE SHELL IS OVERRIDDEN TO DROP `-e`, which the body below has always
        # assumed and never actually had: GitHub's default for `run:` is
        # `bash -e {0}`, and `set -uo pipefail` cannot turn `-e` back off. Every
        # scheduled pass that found a real PR died at the first unguarded
        # assignment — see the log-fetch guard below — before writing state or
        # telling anyone, so the drive reported success while doing nothing.
        shell: bash --noprofile --norc {0}
        run: |
          # Deliberately not `-e`. One unreadable PR must not strand every PR
          # behind it — the next one may be the bot PR that has been red for two
          # days, which is the whole point of this workflow.
          set -uo pipefail
          triage=packages/gp-ai/clickup_bot/ci_triage.py

          # Set when an action was decided, its slot spent, and it then failed to
          # happen. Raised at the end of the loop rather than exiting on the
          # spot, so one PR whose fix run would not launch cannot stop the
          # remaining PRs from being driven.
          action_failed=0

          # Fetched once rather than per check. This is the signal behind the hard
          # rule that a breakage already red on main is not this PR's problem, so
          # an empty result here (an API blip) must fail toward "not pre-existing"
          # — which costs a re-run, not a wrong fix.
          #
          # BOTH APIs, because the rollup below reads both shapes. check-runs
          # covers GitHub Actions jobs; external reporters (Vercel and friends)
          # post to the Commit Statuses API and are invisible to it, so without
          # the second call a StatusContext red on main reads as UNKNOWN here and
          # could buy a fix run for a breakage the PR did not introduce.
          #
          # The COMBINED /status endpoint, not /statuses: /statuses returns every
          # status ever posted for the commit, so a context that failed and was
          # later re-reported green would still show up as failing and wrongly
          # excuse a genuine regression. /status returns the latest per context.
          # Every non-green terminal conclusion counts, not just "failure". A
          # check that consistently times out or is killed on main is exactly the
          # broken-infrastructure case this signal exists to catch, and matching
          # only "failure" would let it burn a PR's whole budget. Reading a
          # superseded (cancelled) run on main as pre-existing is the acceptable
          # side of that trade: it reports the check to a human instead of
          # spending ~$10 to rediscover that main is red.
          #
          # Both branches are filtered by FAILED_CONCLUSIONS rather than by a
          # list written out here, because the two lists drifting is a silent
          # bug in the direction that costs money: a conclusion this side misses
          # is a check red on main that reads as the PR's own problem and buys
          # it re-runs, or a fix run, to rediscover that main is broken.
          main_failing="$({ \
            gh api "repos/$REPO/commits/main/check-runs" --paginate \
              --jq '.check_runs[] | {name: .name, state: .conclusion}' 2>/dev/null; \
            gh api "repos/$REPO/commits/main/status" \
              --jq '.statuses[] | {name: .context, state: .state}' 2>/dev/null; \
          } | jq -r --arg bad "$FAILED_CONCLUSIONS" \
                'select(((.state // "") | ascii_upcase) as $c | ($bad | split(",")) | index($c)) | .name' \
            | sort -u)"
          echo "failing on main: ${main_failing:-<none>}"

          for pr in $PR_NUMBERS; do
            echo "::group::PR #$pr"

            pr_json="$(gh pr view "$pr" --repo "$REPO" \
              --json number,title,state,url,headRefName,statusCheckRollup)" || { echo "::endgroup::"; continue; }

            # Same two-signal bot gate as gpbot-pr-triage.yml. The schedule path
            # already filtered on it; the workflow_run path has not.
            if ! jq -e '(.title | startswith("[GP-Bot]")) or (.headRefName | contains("/gp-bot_"))' <<<"$pr_json" >/dev/null; then
              echo "not a bot PR"; echo "::endgroup::"; continue
            fi
            if [ "$(jq -r .state <<<"$pr_json")" != "OPEN" ]; then
              echo "not open"; echo "::endgroup::"; continue
            fi

            # Normalise both rollup shapes into one list. GitHub Actions jobs
            # arrive as CheckRun (status + conclusion); external reporters such as
            # Vercel arrive as StatusContext (a single state field).
            checks="$(jq -c '[.statusCheckRollup[] |
              if .__typename == "CheckRun" then
                {name: .name, pending: (.status != "COMPLETED"), conclusion: (.conclusion // "" | ascii_upcase), url: .detailsUrl}
              else
                {name: (.context // .name // "status"), pending: ((.state // "") | ascii_upcase | . == "PENDING" or . == "EXPECTED"),
                 conclusion: ((.state // "") | ascii_upcase), url: (.targetUrl // "")}
              end]' <<<"$pr_json")"

            # A board with anything still running has no verdict yet. Exiting here
            # is what makes this workflow self-limiting: it fires once per watched
            # workflow completion, and only the last one to finish gets past this.
            if [ "$(jq '[.[] | select(.pending)] | length' <<<"$checks")" != "0" ]; then
              echo "checks still running"; echo "::endgroup::"; continue
            fi

            failing="$(jq -c --arg bad "$FAILED_CONCLUSIONS" \
              '[.[] | select(.conclusion as $c | ($bad | split(",")) | index($c))]' <<<"$checks")"
            echo "failing checks: $(jq 'length' <<<"$failing")"

            # A GREEN BOARD IS NO LONGER AN EXIT. Review threads are gathered on
            # every pass, and the triage decides which of the two — checks or
            # findings — is this pass's work.
            #
            # `comments(first: 1)` identifies the thread: the author of the
            # FIRST comment is who raised it, which is what the author filter
            # judges. The second selection is a separate question — whether a
            # person has since joined the thread, in which case the bot must not
            # talk over them. __typename is used rather than a name pattern
            # because it is the only reliable way to tell a Bot account from a
            # User.
            #
            # `first: 100` on that second selection, GitHub's maximum, because
            # it is the ONLY defence against answering into a live conversation
            # and truncation fails in the wrong direction: a human reply past
            # the cap reads as no human at all, and nothing downstream would
            # catch it.
            #
            # FAILS TOWARD "NOTHING FOUND": a GraphQL error yields an empty list,
            # so an API blip costs a pass of latency rather than a fix run
            # launched against evidence nobody gathered. The 30-minute schedule
            # comes back.
            # The $owner/$name/$pr inside the query below are GraphQL variables
            # bound by the -f/-F flags, not shell expansions. Letting the shell
            # interpolate them is exactly the bug the single quotes prevent.
            # shellcheck disable=SC2016
            threads="$(gh api graphql -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$pr" -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        isOutdated
                        raisedBy: comments(first: 1) { nodes { author { login } body } }
                        participants: comments(first: 100) { nodes { author { __typename } } }
                      }
                    }
                  }
                }
              }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | {
                        id: .id,
                        resolved: .isResolved,
                        outdated: .isOutdated,
                        author: (.raisedBy.nodes[0].author.login // ""),
                        excerpt: (.raisedBy.nodes[0].body // ""),
                        human_replied: ([.participants.nodes[].author.__typename] | index("User") != null)
                      }]' 2>/dev/null || echo '[]')"
            echo "review threads: $(jq 'length' <<<"${threads:-[]}")"

            # Enrich each failure with the two things the classifier judges on:
            # whether main is red for the same check, and the tail of the job log.
            enriched='[]'
            while read -r row; do
              [ -n "$row" ] || continue
              name="$(jq -r .name <<<"$row")"
              url="$(jq -r .url <<<"$row")"
              job_id="${url##*/job/}"

              log=""
              if [ "$job_id" != "$url" ] && [ -n "$job_id" ]; then
                # Only the tail: every signature in INFRA_LOG_SIGNATURES appears
                # near the end of a failed job, and the classifier caps what it
                # reads anyway.
                #
                # --allow-escape-sequences IS LOAD-BEARING. Job logs are full of
                # ANSI colour, and from gh 2.98.0 (on the runner since
                # 2026-08-20) gh refuses to print such a response and exits 1
                # rather than printing it. Under pipefail that fails the
                # assignment, which is what every scheduled pass was dying on.
                #
                # Guarded as well as fixed, because the classifier treats a
                # missing excerpt as UNKNOWN, which costs a re-run rather than a
                # fix run. A log we cannot read is worth one cheap re-run; it is
                # never worth stranding every other PR in the sweep.
                log="$(gh api --allow-escape-sequences \
                  "repos/$REPO/actions/jobs/${job_id}/logs" 2>/dev/null | tail -c 20000)" || log=""
              fi

              on_main=false
              if [ -n "$main_failing" ] && grep -Fxq "$name" <<<"$main_failing"; then
                on_main=true
              fi

              enriched="$(jq -c --argjson acc "$enriched" --arg n "$name" --arg l "$log" --argjson m "$on_main" \
                --arg c "$(jq -r .conclusion <<<"$row")" \
                '$acc + [{name: $n, conclusion: ($c | ascii_downcase), failing_on_main: $m, log_excerpt: $l}]' <<<'null')"
            done < <(jq -c '.[]' <<<"$failing")

            # The marker comment is the durable half of the caps: it is the only
            # thing that stops a fix run that failed from re-triggering itself for
            # the life of the PR.
            # AUTHOR-SCOPED, not just marker-scoped. The body is public and
            # anyone who can comment on the repo could otherwise post a forged
            # `gpbot-ci-state` block; because the newest match wins, that would
            # reset the counters to zero and let the same PR be cycled through a
            # fresh budget on demand. Only this workflow's own comments count,
            # and it posts as github-actions[bot].
            #
            # FAILS CLOSED, and it is the one read here that must. The counters
            # live only in this comment, so a fetch that failed and was allowed
            # through would read as "no state yet" and hand the PR a fresh
            # budget on every pass — an unbounded spend that looks identical to
            # a first visit. Skipping the PR costs one 30-minute pass.
            marker="$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- gpbot-ci-drive -->")))] | last')" || {
              echo "::error::could not read the state comment for #$pr; not driving it this pass"
              action_failed=1
              echo "::endgroup::"; continue
            }
            comment_id="$(jq -r 'if . == null then "" else .id end' <<<"${marker:-null}")"

            decision="$(jq -n --argjson checks "$enriched" --argjson findings "${threads:-[]}" \
              --arg body "$(jq -r 'if . == null then "" else .body end' <<<"${marker:-null}")" \
              '{checks: $checks, findings: $findings, state_comment: (if $body == "" then null else $body end)}' \
              | python3 "$triage")" || { echo "::error::triage failed for #$pr"; echo "::endgroup::"; continue; }

            action="$(jq -r .action <<<"$decision")"
            echo "decision: $action — $(jq -r .reason <<<"$decision")"

            if [ "$action" = "none" ]; then echo "::endgroup::"; continue; fi

            # EVERYTHING THE ACTION NEEDS IS RESOLVED BEFORE THE COUNTER IS
            # WRITTEN, because an attempt we cannot actually make must not cost
            # one. Both branches below can fail to produce their prerequisite,
            # and in each case the budget would otherwise drain silently until
            # the PR escalated to a human having done nothing at all.
            #
            # These are pure lookups with no side effect, so resolving them here
            # does not weaken the write-state-before-acting ordering below.
            run_ids=''
            task_id=''
            case "$action" in
              rerun)
                # A StatusContext failure (a Vercel deploy) has no
                # /actions/runs/<id>/ in its URL, so nothing here is re-runnable.
                run_ids="$(jq -r '.[] | .url' <<<"$failing" | sed -n 's#.*/actions/runs/\([0-9]*\)/.*#\1#p' | sort -u)"
                if [ -z "$run_ids" ]; then
                  echo "::warning::#$pr has no re-runnable run for its failing checks; not spending an attempt"
                  echo "::endgroup::"; continue
                fi
                ;;
              fix|fix-findings)
                # The ClickUp task is recovered from the branch's custom_id
                # prefix (ENG-1234/gp-bot_...), the same route
                # gpbot-pr-triage.yml uses.
                custom_id="$(jq -r '.headRefName | split("/")[0]' <<<"$pr_json")"
                if [[ "$custom_id" =~ ^[A-Za-z]+-[0-9]+$ ]] && [ -n "${CLICKUP_API_TOKEN:-}" ]; then
                  task_id="$(curl -sS --max-time 20 -H "Authorization: $CLICKUP_API_TOKEN" \
                    "https://api.clickup.com/api/v2/task/${custom_id}?custom_task_ids=true&team_id=90132012119" \
                    | jq -r '.id // empty')"
                fi
                if [ -z "$task_id" ]; then
                  # FAIL CLOSED on the expensive action, unlike the triage
                  # workflow's fail-open reviewer lookup: a run launched without
                  # its ticket cannot report back anywhere a human will look.
                  echo "::error::cannot resolve the ClickUp task for #$pr; not launching a fix run"
                  echo "::endgroup::"; continue
                fi
                ;;
            esac

            # STATE IS WRITTEN BEFORE THE ACTION IS TAKEN, and the order is the
            # cap. If this job dies between the two, the round is recorded as
            # spent and at worst the PR loses one attempt; recording it after
            # would let a crash-looping drive spend the same round forever.
            #
            # AND THE ACTION IS ABANDONED IF THE WRITE FAILS. This block runs
            # under `set -uo pipefail` without `-e`, so a failed gh call would
            # otherwise be swallowed and the case below would act anyway: the
            # round spent, nothing recorded, and the next pass reading the
            # pre-increment counters and deciding the same thing again. The
            # ordering above is only a cap while a failed write stops the
            # action, so the guard is what makes the comment above true.
            body="$(jq -r .comment_body <<<"$decision")"
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
            fi || {
              # RED, like the other two failure paths. Skipping the action is
              # the safe half; without this the step still exits 0, so a GitHub
              # API failure that persists would have the drive skip every PR on
              # every pass while reporting success and telling nobody.
              echo "::error::could not record state for #$pr; not spending the round"
              action_failed=1
              echo "::endgroup::"; continue
            }

            case "$action" in
              rerun)
                # --failed, not a full re-run: the passing shards on #1306 cost
                # ~4 minutes each and re-running them proves nothing.
                while read -r run_id; do
                  [ -n "$run_id" ] || continue
                  echo "re-running failed jobs in run $run_id"
                  gh run rerun "$run_id" --repo "$REPO" --failed || \
                    echo "::warning::could not re-run $run_id"
                done <<<"$run_ids"
                ;;

              fix|fix-findings)
                # Launching goes through the Lambda so the fix run reuses the one
                # audited path to Fargate — trigger_fargate_task — rather than a
                # second, less-scrutinised one wired straight to ECS from CI.
                # task_id was resolved above, before the counter was spent.
                #
                # Only an integer, a validated id and a fixed enum cross this
                # boundary. Check names, step names, log text and review-comment
                # bodies are all deliberately left out: they come from CI output
                # or from another model, and would otherwise reach a system
                # prompt. The agent fetches its own evidence with `gh`.
                mode=checks
                [ "$action" = "fix-findings" ] && mode=findings
                aws lambda invoke \
                  --function-name "$LAMBDA_FUNCTION" \
                  --cli-binary-format raw-in-base64-out \
                  --payload "$(jq -nc --arg t "$task_id" --argjson p "$pr" --arg m "$mode" \
                      '{gpbot_ci_fix: true, clickup_task_id: $t, pr_number: $p, mode: $m}')" \
                  --cli-read-timeout 120 \
                  /tmp/ci-fix-response.json > /tmp/ci-fix-meta.json
                cat /tmp/ci-fix-meta.json /tmp/ci-fix-response.json

                # A handled exception inside the function still returns HTTP 200,
                # so checking the status code alone would report a run that never
                # launched as a launched one.
                if grep -q '"FunctionError"' /tmp/ci-fix-meta.json ||
                   [ "$(jq -r '.statusCode // empty' /tmp/ci-fix-response.json)" != "200" ]; then
                  # THE STEP MUST GO RED. The slot is already spent, so a green
                  # step here means the PR quietly lost a fix run that never
                  # ran, twice over, and then escalated with nothing to show a
                  # human for the budget.
                  echo "::error::fix run for #$pr did not launch"
                  action_failed=1
                fi
                ;;

              report|escalate|hold)
                # The established route to the humans who triage these bugs.
                # Degrades quietly when the channel or token is unset so this
                # workflow can land before that wiring is confirmed.
                if [ -n "${SLACK_TOKEN:-}" ] && [ -n "${CHANNEL:-}" ]; then
                  # jq assembles the text so a summary containing quotes or
                  # backslashes cannot break out of the JSON, and so no line of
                  # it has to sit at column 0 inside this block scalar.
                  # One neutral headline for all three terminal actions. The
                  # summary immediately under it already says whether the PR is
                  # red, broken on main, or carrying an unanswered finding, and
                  # a headline that guessed wrong would be worse than none.
                  jq -n --arg channel "$CHANNEL" \
                    --arg url "$(jq -r .url <<<"$pr_json")" \
                    --arg pr "$pr" \
                    --arg summary "$(jq -r .summary <<<"$decision")" \
                    '{channel: $channel,
                      text: ("*gpbot stopped driving <" + $url + "|#" + $pr + ">.*\n" + $summary
                             + "\nClosing the PR is a fine outcome if the fix is not worth it.")}' \
                    | curl -sSf -X POST https://slack.com/api/chat.postMessage \
                        -H "Authorization: Bearer $SLACK_TOKEN" \
                        -H 'Content-type: application/json; charset=utf-8' \
                        --data @- \
                    | tee /dev/stderr | jq -e '.ok' > /dev/null \
                    || {
                      # THE STEP MUST GO RED, for the same reason the fix branch
                      # does. The marker comment is already written and marks the
                      # PR escalated, so the next pass decides `none` and never
                      # tries again: a swallowed failure here is a human who is
                      # never told, on a PR the bot has stopped driving.
                      echo "::error::could not announce #$pr in Slack"
                      action_failed=1
                    }
                fi
                ;;
            esac

            echo "::endgroup::"
          done

          exit "$action_failed"
