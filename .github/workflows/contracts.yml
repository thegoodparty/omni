name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs: a new push makes the in-flight result irrelevant,
# and while cancel was off the new run also queued behind it. Never on main.
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKSPACE: packages/contracts

jobs:
  build:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: contracts

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Typecheck
        run: npm run typecheck -w ${{ env.WORKSPACE }}

      - name: Build contracts
        run: npm run build -w ${{ env.WORKSPACE }}
