name: Universal Judge request

# Two of the three ways to ask for a sweep. Both are thin: they decide what was
# asked for and hand it to judge.yml, which owns the guards.
#
# `workflow_dispatch` is the manual entry point: this file is on the default
# branch, so GitHub offers the Run workflow button.
#
# THERE IS NO `pull_request` TRIGGER, and that is a decision rather than an
# omission. A sweep costs money and names an agent, so it is asked for — by a
# `/judge` comment or by a dispatch — never fired by opening a PR. An earlier
# version did carry one, scoped to the judge's own integration branch and
# hard-wired to a plan, purely so the trigger was exercised before the file
# reached the default branch and the dispatch button existed. Pointing that at
# `main` instead would put a plan job and a comment on every PR in the
# monorepo, which is noise on hundreds of PRs that touch no agent at all.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to judge
        required: true
        type: string
      agents:
        description: >-
          One agent id, a comma-separated subset, `all`, or `auto` (whichever
          agents the branch touched — the normal case, and usually one agent).
          `all` is the expensive exception for a change to shared code.
        required: false
        default: auto
        type: string
      live:
        # Affirmative and default-false, matching the reusable input. A
        # negative switch ("dry_run") has to be cleared to spend, and GitHub's
        # `==` coerces, so an empty or garbled value reads as `false` and
        # therefore as "go live". Asking for the spend by name means anything
        # this box is not is a plan.
        description: Actually run the sweep and spend on model calls
        required: false
        default: false
        type: boolean

# GUARD 2 of 3, and the half of it that is unambiguously in force.
#
# Keyed per PR with cancel-in-progress. Workflow-level concurrency covers the
# whole run, `sweep` included, so a second request for the same PR really does
# cancel a sweep that is already spending rather than running a second one
# beside it. Concurrency groups are repository-wide, so a `/judge` comment and
# a manual dispatch contend for one slot per PR instead of one slot per entry
# point — which is what lets a second request cancel a sweep already running.
#
# THE INVARIANT EVERY ENTRY POINT MUST PRESERVE: resolve to
# `universal-judge-pr-<pr number>`. The expression differs from
# judge-comment.yml's because that one has to gate on who is commenting; what
# has to match is the key, not the text.
#
# What it does NOT do is refund. Cancellation stops further model calls; the
# tokens the cancelled sweep already burned are already billed.
#
# It is here, on the caller, as well as on judge.yml's jobs on purpose.
# Workflow-level concurrency on an ordinary triggered workflow is documented and
# unambiguous; job-level concurrency inside a CALLED reusable workflow is
# neither documented as working nor as not working, and this is not a guard to
# leave resting on an inference. The groups inside judge.yml stay as the layer
# that survives a future caller that forgets this block.
#
# The run_id fallback mirrors judge.yml's jobs and exists for the same reason:
# the REST dispatch API does not enforce a non-empty string input, and a
# `pr_number` of "" would otherwise collapse every dispatch into one shared
# `universal-judge-pr-` group where unrelated runs cancel each other. The gate
# in judge.yml skips such a run anyway, so this costs nothing and removes a
# way for one bad dispatch to take out a good one.
concurrency:
  group: universal-judge-pr-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  judge:
    name: Judge
    # No fork gate here. A dispatch can only be started by someone with write
    # access to this repository, so there is no capped-token case for this
    # entry point to guard — judge.yml's own fork gate still covers the PR the
    # dispatch names, and it skips green with a reason.
    # GRANTED HERE BECAUSE judge.yml CANNOT GRANT IT TO ITSELF. A called
    # workflow is capped by what its caller holds, so the sweep job's
    # `id-token: write` — what it exchanges for the AWS credentials that
    # stage a background config and send a dispatch — has to be granted on
    # this job too. Without it the whole run fails at STARTUP, before any job
    # exists to report it: no log, no annotation, just `startup_failure` and
    # 'This run likely failed because of a workflow file issue.' That takes
    # the chat half down with it, since neither job ever starts.
    #
    # Repeated rather than moved to the workflow level on purpose: the parse
    # job in judge-comment.yml reads an untrusted comment body and has no
    # business holding a token that can assume an AWS role.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/judge.yml
    with:
      # The reusable input is declared as a string and so is this one, but the
      # REST dispatch API does not enforce a non-empty value. judge.yml's gate
      # is what refuses an empty one, with a sentence.
      pr_number: ${{ inputs.pr_number }}
      agents: ${{ inputs.agents || 'auto' }}
      live: ${{ inputs.live }}
      requested_by: ${{ github.actor }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
