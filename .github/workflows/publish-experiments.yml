name: Publish PMF experiments

on:
  # No path filters: this is a required check for prod promotion (promote.yml gates
  # on it), so it must run on every PR and every push to main. Publishing the full
  # manifest set is idempotent, so re-running on unrelated changes is harmless.
  pull_request:
  # push to main → publishes to the dev S3 bucket. Prod publishing is handled by
  # promote.yml, not here.
  push:
    branches: [main]
  # workflow_dispatch with no inputs — env is derived from the branch you ran
  # this workflow against (main → dev). Always publishes the FULL set under
  # `experiments/<id>/`; partial publishes are intentionally not supported
  # (see publish_experiments.py docstring).
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC: assume AWS role without long-lived creds
  contents: read # Checkout the repo
  pull-requests: read

jobs:
  validate:
    name: Validate manifests against meta-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install dev deps
        working-directory: packages/runbooks/scripts/python
        run: uv sync --frozen

      - name: Run meta-schema tests (locks the contract)
        working-directory: packages/runbooks/scripts/python
        run: uv run pytest test_experiment_manifests.py -v

  publish:
    # Triggered on push to main, or manual workflow_dispatch from main. Env is
    # derived from the branch — no choice input — because OIDC trust is
    # per-branch. Prod publishing lives in promote.yml.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    name: Publish manifests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install runtime deps
        working-directory: packages/runbooks/scripts/python
        run: uv sync --frozen

      - name: Resolve target env from branch
        id: target
        run: |
          case "${{ github.ref }}" in
            refs/heads/main)  ENV="dev"  ;;
            *)
              echo "::error::Refusing to publish from ${{ github.ref }} — only the main branch maps to an env here."
              exit 1
              ;;
          esac
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "Target env: $ENV (from branch ${{ github.ref }})"

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333022194791:role/github-actions-pulumi-deploy
          aws-region: us-west-2

      - name: Publish manifests to S3
        working-directory: packages/runbooks/scripts/python
        run: uv run python publish_experiments.py --env=${{ steps.target.outputs.env }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Experiment publish failed: env=${{ steps.target.outputs.env }} commit=${{ github.sha }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Experiment publish failed*\n*Env:* `${{ steps.target.outputs.env }}`\n*Commit:* `${{ github.sha }}`\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_AI_SERVICE_FAILURES_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
