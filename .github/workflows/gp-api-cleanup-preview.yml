name: gp-api cleanup preview

permissions:
  contents: read
  id-token: write
  pull-requests: read

on:
  workflow_dispatch:
  schedule:
    # Run every 3 hours
    - cron: "0 */3 * * *"

env:
  WORKSPACE: packages/gp-api

jobs:
  discover-stale-stacks:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.find-stale.outputs.stacks }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
        with:
          pulumi-version: "^3"

      - name: Find stale PR stacks
        id: find-stale
        # npx in an npm workspace chdirs to the package root before running,
        # so this must run from the package root with a package-root-relative
        # script path
        working-directory: ${{ env.WORKSPACE }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pulumi login s3://goodparty-iac-state
          npx tsx scripts/find-stale-preview-stacks.ts /tmp/stale-stacks.json
          echo "stacks=$(cat /tmp/stale-stacks.json)" >> $GITHUB_OUTPUT

  destroy:
    needs: discover-stale-stacks
    if: needs.discover-stale-stacks.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    # Serialize on the preview stack name (shared with the deploy job in
    # gp-api.yml and gp-api-teardown-preview.yml) so this never runs `pulumi
    # cancel`/`destroy` against a stack a PR-close teardown is already
    # destroying — concurrent cancels would clear each other's locks and both
    # could fail, stranding the ALB.
    concurrency:
      group: gp-api-preview-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        stack: ${{ fromJson(needs.discover-stale-stacks.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-api

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Destroy stack
        uses: ./.github/actions/destroy-preview-stack
        with:
          stack-name: ${{ matrix.stack }}
          working-directory: ${{ env.WORKSPACE }}/deploy

      # fail-fast: false already lets the other matrix legs finish, but a
      # failed destroy is otherwise only visible to whoever opens the run.
      # Surface it so a stranded ALB doesn't silently sit against the quota.
      - name: Notify Slack on destroy failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,workflow,job
          text: >-
            gp-api preview cleanup failed to destroy `${{ matrix.stack }}`.
            Its load balancer may still be holding ELB quota — check the run.

  check-elb-quota:
    # Run after the destroys (always(), so it still runs when destroy is
    # skipped for an empty stale set or when a leg fails) so the count
    # reflects post-cleanup reality — and so it still fires when a failed
    # destroy leaves an ALB stranded.
    needs: [destroy]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Check ALB count against quota
        id: check
        # L-53DA6B97 is the per-region "Application Load Balancers" quota.
        run: |
          QUOTA=$(aws service-quotas get-service-quota \
            --service-code elasticloadbalancing --quota-code L-53DA6B97 \
            --region us-west-2 --query 'Quota.Value' --output text)
          QUOTA=${QUOTA%.*}
          COUNT=$(aws elbv2 describe-load-balancers --region us-west-2 \
            --query 'length(LoadBalancers)' --output text)
          THRESHOLD=$(( QUOTA * 80 / 100 ))
          echo "Load balancers in use: $COUNT / $QUOTA (warn at >= $THRESHOLD)"
          {
            echo "count=$COUNT"
            echo "quota=$QUOTA"
            echo "threshold=$THRESHOLD"
            echo "near_quota=$([ "$COUNT" -ge "$THRESHOLD" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack when near quota
        if: steps.check.outputs.near_quota == 'true' && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": ":warning: AWS ELB usage in us-west-2 is ${{ steps.check.outputs.count }}/${{ steps.check.outputs.quota }} (>= ${{ steps.check.outputs.threshold }}). New PR-preview deploys may fail with TooManyLoadBalancers — clear stale preview stacks or request a quota increase."
            }

  drop-orphaned-dbs:
    # Backstop for databases whose PR-close teardown dropped the ECS stack
    # before the DB drop step could run (e.g. because the teardown workflow
    # predates this change, or because the run-task step was non-fatal).
    # Runs after check-elb-quota (always()) so it still fires on an empty
    # stale-stack run — orphaned DBs outlive their stacks.
    #
    # The drop is a SQL op against the shared Aurora cluster, whose SG admits
    # 5432 only from the app SG + the VPC CIDR — the GitHub runner is NOT in
    # the VPC, so the sweep runs in-VPC via `aws ecs run-task`. There is no
    # per-PR stack to borrow a task def from here, so it uses the stable dev
    # task def (gp-develop-fargateCluster-gp-api-develop), which carries the
    # same DB_USER (gpuser) and DB_PASSWORD secret (GP_API_DEV — the shared
    # cluster's master password). The runner only resolves the cluster
    # endpoint and the open-PR list and passes them as env overrides.
    needs: [check-elb-quota]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Sweep orphaned gpdb_pr_* databases in-VPC
        run: |
          CLUSTER_ENDPOINT=$(aws rds describe-db-clusters \
            --db-cluster-identifier gp-api-preview-shared \
            --query 'DBClusters[0].Endpoint' \
            --output text 2>/dev/null || true)

          if [ -z "$CLUSTER_ENDPOINT" ] || [ "$CLUSTER_ENDPOINT" = "None" ]; then
            echo "Shared preview cluster not found; skipping DB sweep."
            exit 0
          fi

          # Fetch open PRs. If this fails we must NOT proceed: an empty list
          # would make the sweep treat every gpdb_pr_* as orphaned and drop
          # active previews' databases. Skip the run instead.
          PR_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&per_page=100") || {
            echo "Failed to fetch open PRs; skipping sweep to avoid dropping active databases."
            exit 0
          }
          OPEN_PRS=$(echo "$PR_JSON" | python3 -c \
            "import sys,json; prs=json.load(sys.stdin); print(' '.join(str(p['number']) for p in prs))")

          ECS_CLUSTER="gp-develop-fargateCluster"
          TASK_DEF_FAMILY="gp-develop-fargateCluster-gp-api-develop"

          echo "Running drop-orphaned-preview-dbs against ${CLUSTER_ENDPOINT}..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF_FAMILY" \
            --launch-type FARGATE \
            --network-configuration \
              "awsvpcConfiguration={
                subnets=[subnet-053357b931f0524d4,subnet-0bb591861f72dcb7f],
                securityGroups=[sg-01de8d67b0f0ec787],
                assignPublicIp=DISABLED
              }" \
            --overrides "{
              \"containerOverrides\": [{
                \"name\": \"gp-api-develop\",
                \"command\": [
                  \"npx\",\"tsx\",\"scripts/drop-orphaned-preview-dbs.ts\"
                ],
                \"environment\": [
                  {\"name\":\"DB_HOST\",\"value\":\"${CLUSTER_ENDPOINT}\"},
                  {\"name\":\"OPEN_PRS\",\"value\":\"${OPEN_PRS}\"}
                ]
              }]
            }" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Waiting for sweep task ${TASK_ARN} to complete..."
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query \
              "tasks[0].containers[?name=='gp-api-develop'].exitCode" \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "drop-orphaned-preview-dbs exited ${EXIT_CODE}; check ECS logs."
            exit 1
          fi
