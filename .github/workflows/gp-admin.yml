name: gp-admin

on:
  pull_request:
    paths:
      - "packages/gp-admin/**"
      - "packages/gp-sdk/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gp-admin.yml"
      - ".github/actions/**"
  push:
    branches: [develop, qa, master]
    paths:
      - "packages/gp-admin/**"
      - "packages/gp-sdk/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gp-admin.yml"
      - ".github/actions/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gp-admin-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKSPACE: packages/gp-admin

jobs:
  ci:
    name: Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-admin
          build-contracts: "true"

      - name: Build SDK
        run: npm run build -w packages/gp-sdk

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Test with coverage
        run: npm run test:coverage -w ${{ env.WORKSPACE }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-admin-coverage-report
          path: packages/gp-admin/coverage/
          retention-days: 30

  # gp-admin is a single deployment that targets dev/qa/prod at runtime via
  # Clerk org switch, so it has no per-branch env vars or domains: PRs get a
  # preview, master deploys to production. No develop/qa env deploys.
  deploy:
    name: Vercel deploy
    needs: ci
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref_name == 'master')
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-admin
          build-contracts: "true"

      - name: Build SDK
        run: npm run build -w packages/gp-sdk

      - name: Deploy to Vercel
        id: vercel
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_GP_ADMIN }}
          target: ${{ github.ref_name == 'master' && 'production' || 'preview' }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.vercel.outputs.url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `gp-admin Vercel preview: ${url}`
            });
