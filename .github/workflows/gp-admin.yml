name: gp-admin

on:
  pull_request:
    paths:
      - 'packages/gp-admin/**'
      - 'packages/gp-sdk/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gp-admin.yml'
      - '.github/actions/**'
  push:
    branches: [develop, qa, master]
    paths:
      - 'packages/gp-admin/**'
      - 'packages/gp-sdk/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gp-admin.yml'
      - '.github/actions/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gp-admin-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKSPACE: packages/gp-admin

jobs:
  ci:
    name: Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-admin
          build-contracts: 'true'

      - name: Build SDK
        run: npm run build -w packages/gp-sdk

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}

      - name: Test with coverage
        run: npm run test:coverage -w ${{ env.WORKSPACE }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-admin-coverage-report
          path: packages/gp-admin/coverage/
          retention-days: 30

  vercel-deploy:
    name: Vercel deploy
    needs: ci
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref_name == 'develop')
      || (github.event_name == 'push' && github.ref_name == 'master')
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_GP_ADMIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: gp-admin
          build-contracts: 'true'

      - name: Build SDK
        run: npm run build -w packages/gp-sdk

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build and deploy with Vercel CLI
        id: deploy
        shell: bash
        run: |
          PULL_ENV=preview
          BUILD_ARGS=()
          DEPLOY_ARGS=(--target=preview)

          if [ "$GITHUB_REF_NAME" = "master" ]; then
            PULL_ENV=production
            BUILD_ARGS=(--prod)
            DEPLOY_ARGS=(--prod)
          fi

          vercel pull --cwd "$WORKSPACE" --environment="$PULL_ENV" --yes --token "$VERCEL_TOKEN"
          vercel build --cwd "$WORKSPACE" "${BUILD_ARGS[@]}" --token "$VERCEL_TOKEN"
          DEPLOY_URL="$(vercel deploy --prebuilt --cwd "$WORKSPACE" "${DEPLOY_ARGS[@]}" --token "$VERCEL_TOKEN" | awk 'NF { line=$0 } END { print line }')"
          case "$DEPLOY_URL" in
            http*) ;;
            *) DEPLOY_URL="https://${DEPLOY_URL}" ;;
          esac
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "gp-admin Vercel URL: ${DEPLOY_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `gp-admin Vercel preview: ${url}`
            });
