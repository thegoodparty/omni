name: election-api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

# Scoped per-PR only. On main this resolves to github.run_id — unique per run,
# so pushes never serialize here: validate shares no state across commits, and a
# shared group made every merge wait a full CI cycle for the previous one before
# it even checked out. Deploys are still serialized, by the deploy job's own
# election-api-deploy-<ref> group.
concurrency:
  group: election-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  IMAGE_URI: 333022194791.dkr.ecr.us-west-2.amazonaws.com/election-api:${{ github.sha }}
  WORKSPACE: packages/election-api

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-workspace
        with:
          app: election-api
          workspace: ${{ env.WORKSPACE }}
          build-contracts: 'true'
          build-nest-common: 'true'
          prisma-generate-script: generate:prisma:election-api

      - name: Lint
        run: npm run lint -w ${{ env.WORKSPACE }}
        # election-api's eslint.config.js asserts DATABASE_URL is set; lint
        # never connects, so a placeholder is enough to load the config.
        env:
          DATABASE_URL: postgresql://lint:lint@localhost:5432/lint

      - name: Typecheck
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc --noEmit

      # The Pulumi program under deploy/ is excluded from the main tsconfig and
      # is only otherwise compiled at deploy time — this catches type errors in
      # it before they reach the (irreversible) Deploy step.
      - name: Typecheck deploy
        working-directory: ${{ env.WORKSPACE }}
        run: npx tsc -p tsconfig.deploy.json

      - name: Test
        run: npm run test -w ${{ env.WORKSPACE }}
