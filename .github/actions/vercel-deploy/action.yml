name: Vercel deploy
description: >-
  Deploy a Vercel project imperatively with the Vercel CLI using a remote
  build (Vercel builds on its own servers, so system + integration-injected
  env vars are present and the build runs against the project's full env). For
  env deploys (develop/qa) it deploys to the preview target with branch-scoped
  env vars and aliases the result to a stable domain; for prod it deploys to
  production. The remote build uses the project's configured rootDirectory, so
  the caller does not need to build the app first.

inputs:
  vercel-token:
    description: Vercel access token.
    required: true
  vercel-org-id:
    description: Vercel org/team id (sets VERCEL_ORG_ID).
    required: true
  vercel-project-id:
    description: Vercel project id (sets VERCEL_PROJECT_ID).
    required: true
  target:
    description: 'Deploy target: "preview" or "production".'
    required: true
  git-branch:
    description: >-
      Git branch to scope the deployment to (preview target only). Passed to
      the remote build as git metadata (githubCommitRef) so Vercel applies
      branch-scoped preview env vars to the build. Leave empty for generic PR
      previews and for the production target.
    required: false
    default: ""
  alias-domain:
    description: >-
      Stable domain to alias the deployment to (preview target only, e.g.
      dev.goodparty.org). Leave empty to keep only the generated preview URL.
    required: false
    default: ""
  pr-alias:
    description: >-
      Deterministic *.vercel.app subdomain to alias a PR preview deployment to
      (e.g. gp-ui-pr-123-good-party.vercel.app). Must end in the team scope
      slug. Leave empty for non-PR deploys. This is independent of alias-domain
      so a single deploy can carry both a stable env domain and a PR alias.
    required: false
    default: ""

outputs:
  url:
    description: The resulting deployment URL.
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: Install Vercel CLI
      shell: bash
      run: npm install --global vercel@latest

    - name: Deploy with Vercel CLI (remote build)
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        TARGET: ${{ inputs.target }}
        GIT_BRANCH: ${{ inputs.git-branch }}
        ALIAS_DOMAIN: ${{ inputs.alias-domain }}
        PR_ALIAS: ${{ inputs.pr-alias }}
      run: |
        set -euo pipefail

        DEPLOY_ARGS=(--token "$VERCEL_TOKEN")

        if [ "$TARGET" = "production" ]; then
          DEPLOY_ARGS+=(--prod)
        elif [ -n "$GIT_BRANCH" ]; then
          # Remote builds run on Vercel and ignore any locally-pulled env, so
          # branch-scoped preview env vars are applied from the deployment's
          # git branch metadata. githubDeployment=1 identifies the provider;
          # githubCommitRef is the branch Vercel scopes env vars to.
          # https://vercel.com/guides/branch-variables-and-domains-not-linked-to-cli-deployments
          DEPLOY_ARGS+=(--meta githubDeployment=1 --meta "githubCommitRef=$GIT_BRANCH")
        fi

        DEPLOY_URL="$(vercel deploy "${DEPLOY_ARGS[@]}" | awk 'NF { line=$0 } END { print line }')"
        case "$DEPLOY_URL" in
          http*) ;;
          *) DEPLOY_URL="https://${DEPLOY_URL}" ;;
        esac

        if [ -n "$ALIAS_DOMAIN" ]; then
          vercel alias set "$DEPLOY_URL" "$ALIAS_DOMAIN" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          echo "Aliased to https://${ALIAS_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -n "$PR_ALIAS" ]; then
          vercel alias set "$DEPLOY_URL" "$PR_ALIAS" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          echo "PR alias: https://${PR_ALIAS}" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        echo "Deployment URL: ${DEPLOY_URL}" >> "$GITHUB_STEP_SUMMARY"
