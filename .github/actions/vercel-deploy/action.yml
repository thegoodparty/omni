name: Vercel deploy
description: >-
  Build and deploy a Vercel project imperatively with the Vercel CLI (no git
  integration). For dev/PR deploys it deploys to the preview target with
  branch-scoped env vars; dev is aliased to a stable domain, and a PR deploy
  writes its generated URL into the PR's preview comment. For prod
  (driven by the release train, release.yml) it deploys to production. Caller
  must install workspace deps (and build any prerequisites like the SDK) before
  invoking this action.

inputs:
  vercel-token:
    description: Vercel access token.
    required: true
  vercel-org-id:
    description: Vercel org/team id (sets VERCEL_ORG_ID).
    required: true
  vercel-project-id:
    description: Vercel project id (sets VERCEL_PROJECT_ID).
    required: true
  target:
    description: 'Deploy target: "preview" or "production".'
    required: true
  git-branch:
    description: >-
      Git branch to pull env vars for (preview target only). Vercel resolves
      branch-scoped preview env vars when this is set. Leave empty for generic
      PR previews and for the production target.
    required: false
    default: ''
  alias-domain:
    description: >-
      Stable domain to alias the deployment to (preview target only, e.g.
      dev.goodparty.org). Leave empty to keep only the generated preview URL.
    required: false
    default: ''
  preview-name:
    description: >-
      App name for this deploy's row in the PR preview comment (the table
      pr-preview-comment.yml creates). PR deploys get no alias: the preview
      token's Developer role cannot assign one, so the generated URL is
      written there instead. Leave empty for non-PR deploys.
    required: false
    default: ''
  api-base:
    description: >-
      Override NEXT_PUBLIC_API_BASE for this build (full-stack PR previews point
      it at the per-PR gp-api stack). NEXT_PUBLIC_* is baked at build time, so
      this is written into the pulled Vercel env before `vercel build`. Leave
      empty to use the project's configured value.
    required: false
    default: ''

outputs:
  url:
    description: The resulting deployment URL.
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    # A registry fetch that drops mid-install is the same ECONNRESET that #3099
    # retried for the lambda builds; the install is idempotent.
    - name: Install Vercel CLI
      shell: bash
      run: |
        for attempt in 1 2 3; do
          npm install --global vercel@59.25.0 && exit 0
          if [ "$attempt" -lt 3 ]; then
            echo "::warning::Vercel CLI install attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          fi
        done
        exit 1

    - name: Build and deploy with Vercel CLI
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        TARGET: ${{ inputs.target }}
        GIT_BRANCH: ${{ inputs.git-branch }}
        ALIAS_DOMAIN: ${{ inputs.alias-domain }}
        API_BASE: ${{ inputs.api-base }}
        # next build peaks near Node's default ~4GB heap and OOMs
        # intermittently on the 16GB runners (first seen 2026-06-12, exit
        # 134 in `vercel build`). The cap is per process and NODE_OPTIONS
        # propagates to every worker next spawns, so keep it modest —
        # several workers at 8GB each could trip the kernel OOM killer
        # instead.
        NODE_OPTIONS: --max-old-space-size=6144
      run: |
        set -euo pipefail

        # Bounded retries for the calls that only talk to Vercel's API and are
        # safe to repeat: pull (a read), deploy of the already-built output,
        # and alias (sets the same alias again). On 2026-10-02 a dev deploy
        # uploaded its whole output and then died on `Error: fetch failed`
        # (release 36955818655), which held prod for a run. A deploy retried
        # after a failure Vercel had actually accepted creates a second
        # deployment of the same prebuilt output; the alias and the
        # production target then point at identical content. `vercel build`
        # is not retried: it is local, slow, and its past failures were code,
        # tokens and heap, not network. Neither is the upload quota (Aug 25),
        # which no retry within a job outlasts.
        retry() {
          local attempt
          for attempt in 1 2 3; do
            "$@" && return 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::'$1 ${2:-}' attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          return 1
        }

        PULL_ARGS=(--yes --token "$VERCEL_TOKEN")
        BUILD_ARGS=(--token "$VERCEL_TOKEN")
        # --archive=tgz uploads .vercel/output as one compressed file instead
        # of thousands of individual ones. Vercel's `api-upload-paid` quota
        # counts files, not deploys, and a Next.js build output (function
        # bundles carry their own traced node_modules) is tens of thousands of
        # them — enough parallel PRs exhausted the 40k/24h account ceiling on
        # 2026-08-25 and blocked every preview deploy in the repo.
        DEPLOY_ARGS=(--prebuilt --archive=tgz --token "$VERCEL_TOKEN")

        if [ "$TARGET" = "production" ]; then
          PULL_ARGS+=(--environment=production)
          BUILD_ARGS+=(--prod)
          DEPLOY_ARGS+=(--prod)
          ENV_FILE=.vercel/.env.production.local
        else
          PULL_ARGS+=(--environment=preview)
          if [ -n "$GIT_BRANCH" ]; then
            PULL_ARGS+=(--git-branch="$GIT_BRANCH")
          fi
          ENV_FILE=.vercel/.env.preview.local
        fi

        retry vercel pull "${PULL_ARGS[@]}"

        # Override the baked backend URL when asked (full-stack PR previews).
        # vercel build reads the pulled env file, so replace the line there.
        if [ -n "$API_BASE" ]; then
          touch "$ENV_FILE"
          grep -v '^NEXT_PUBLIC_API_BASE=' "$ENV_FILE" > "$ENV_FILE.tmp" || true
          echo "NEXT_PUBLIC_API_BASE=$API_BASE" >> "$ENV_FILE.tmp"
          mv "$ENV_FILE.tmp" "$ENV_FILE"
          echo "Building against NEXT_PUBLIC_API_BASE=$API_BASE" >> "$GITHUB_STEP_SUMMARY"
        fi

        vercel build "${BUILD_ARGS[@]}"
        # stdout to a file rather than a pipe, so a retried attempt's URL is
        # the one read and the retry warnings stay out of it.
        deploy() { vercel deploy "${DEPLOY_ARGS[@]}" > "$RUNNER_TEMP/vercel-deploy.out"; }
        retry deploy
        DEPLOY_URL="$(awk 'NF { line=$0 } END { print line }' "$RUNNER_TEMP/vercel-deploy.out")"
        case "$DEPLOY_URL" in
          http*) ;;
          *) DEPLOY_URL="https://${DEPLOY_URL}" ;;
        esac

        if [ -n "$ALIAS_DOMAIN" ]; then
          retry vercel alias set "$DEPLOY_URL" "$ALIAS_DOMAIN" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          echo "Aliased to https://${ALIAS_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        echo "Deployment URL: ${DEPLOY_URL}" >> "$GITHUB_STEP_SUMMARY"

    # The three app deploys finish close together and share one comment, so
    # a write can be lost to another job's read-modify-write. Re-read after
    # each write and retry until this app's row shows this deploy.
    - name: Update PR preview comment
      if: inputs.preview-name != '' && github.event_name == 'pull_request'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        APP: ${{ inputs.preview-name }}
        URL: ${{ steps.deploy.outputs.url }}
        SHA: ${{ github.event.pull_request.head.sha }}
      with:
        script: |
          const pr = context.issue.number
          const marker = '<!-- vercel-previews -->'
          const apps = ['gp-api', 'gp-webapp', 'gp-admin', 'candidate-sites']
          const app = process.env.APP
          const url = process.env.URL
          const sha = process.env.SHA.slice(0, 7)

          const parseRows = (body) =>
            Object.fromEntries(
              (body || '')
                .split('\n')
                .map((line) => line.match(/^\| ([\w-]+) \| (.*?) \| (.*?) \|$/))
                .filter(Boolean)
                .map((m) => [m[1], { url: m[2], sha: m[3] }]),
            )

          const render = (rows) =>
            [
              marker,
              '## Preview deploys',
              '',
              '| App | Preview | Commit |',
              '|-----|---------|--------|',
              ...apps.map(
                (a) =>
                  `| ${a} | ${rows[a]?.url || '_not deployed yet_'} | ${rows[a]?.sha || ''} |`,
              ),
              '',
              '> Each push gets new Vercel preview URLs. This table shows the latest deploy of each app.',
            ].join('\n')

          const findComment = async () => {
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                per_page: 100,
              },
            )
            return comments.find((c) => c.body && c.body.includes(marker))
          }

          for (let attempt = 1; attempt <= 6; attempt++) {
            const existing = await findComment()
            const rows = parseRows(existing?.body)
            if (existing && rows[app]?.url === url) return
            rows[app] = { url, sha }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: render(rows),
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: render(rows),
              })
            }
            await new Promise((r) => setTimeout(r, 2000 + Math.random() * 3000))
          }
          core.warning(`Could not confirm ${app}'s row in the preview comment`)
