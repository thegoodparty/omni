name: Configure AWS credentials
description: >-
  Assume the shared GitHub Actions Pulumi deploy role via OIDC for ECR pushes
  and Pulumi deploys. Requires `permissions: id-token: write` on the job.

inputs:
  role-to-assume:
    description: IAM role ARN to assume via OIDC.
    required: false
    default: arn:aws:iam::333022194791:role/github-actions-pulumi-deploy
  aws-region:
    description: AWS region.
    required: false
    default: us-west-2

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
