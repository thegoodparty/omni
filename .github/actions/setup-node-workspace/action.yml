name: Setup Node workspace
description: >-
  Install the monorepo root npm-workspaces dependencies on Node 22, with shared
  workspace node_modules caching, optional contracts build, and optional
  root-aware Prisma generation.

inputs:
  app:
    description: >-
      App name the calling job serves. Labelling only: the dependency cache is
      shared across apps because the root workspace install is identical for
      every one of them.
    required: true
  workspace:
    description: Workspace path, for app-local follow-up commands.
    required: false
    default: ''
  build-contracts:
    description: Build the shared contracts package before app validation/build.
    required: false
    default: 'false'
  build-nest-common:
    description: >-
      Build the shared @goodparty_org/nest-common package before app
      validation/build. Its dist/ is gitignored, so the backends that import it
      need it built (and present in the Docker build context) before typecheck,
      test, or image build.
    required: false
    default: 'false'
  prisma-generate-script:
    description: >-
      Root package.json script to run for Prisma generation, for example
      generate:prisma:gp-api. Leave empty for non-Prisma workspaces.
    required: false
    default: ''
  route-types:
    description: Generate gp-api route types after Prisma generation.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: Restore node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: workspace-node-modules-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Restore npm cache
      id: npm-cache
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.npm
        key: npm-cache-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-cache-v1-${{ runner.os }}-

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

    # Save ~/.npm only after a real install populated it. Letting the cache
    # action save unconditionally lets a node_modules-hit job write an empty
    # ~/.npm under the lockfile-hashed key, which is then immutable and forces
    # every later miss to refetch the whole registry.
    - name: Save npm cache
      if: steps.node-modules-cache.outputs.cache-hit != 'true' && steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.npm
        key: npm-cache-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Build contracts
      if: inputs.build-contracts == 'true'
      shell: bash
      run: npm run build -w packages/contracts

    - name: Build nest-common
      if: inputs.build-nest-common == 'true'
      shell: bash
      run: npm run build -w packages/nest-common

    - name: Resolve Prisma version
      id: prisma-version
      if: inputs.prisma-generate-script != ''
      shell: bash
      run: echo "version=$(node -p "require('prisma/package.json').version")" >> "$GITHUB_OUTPUT"

    # The schemas' musl binaryTarget (the engine the images run on) is only in
    # the restored node_modules if whichever job saved that cache happened to
    # run generate first. Otherwise every generate downloads it into
    # ~/.cache/prisma, and one dropped connection crashes the CLI even though
    # its downloader reports retries left. Keyed per script because the
    # gp-api and election-api schemas name different musl targets.
    - name: Restore Prisma engines
      id: prisma-engines-cache
      if: inputs.prisma-generate-script != ''
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/prisma
        key: prisma-engines-v1-${{ runner.os }}-${{ steps.prisma-version.outputs.version }}-${{ inputs.prisma-generate-script }}

    # Retried for a cache miss, where the engine download still happens.
    - name: Generate Prisma client
      if: inputs.prisma-generate-script != ''
      shell: bash
      env:
        PRISMA_GENERATE_SCRIPT: ${{ inputs.prisma-generate-script }}
      run: |
        for attempt in 1 2 3; do
          if npm run "$PRISMA_GENERATE_SCRIPT"; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "::warning::prisma generate attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          fi
        done
        echo "::error::prisma generate failed after 3 attempts"
        exit 1

    # When node_modules already carried the musl engine, generate never wrote
    # it to ~/.cache/prisma, and saving that would pin an engine-less cache
    # under an immutable key.
    - name: Check Prisma engine cache
      id: prisma-engines-check
      if: inputs.prisma-generate-script != '' && steps.prisma-engines-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if compgen -G "$HOME/.cache/prisma/master/*/linux-musl*/*" > /dev/null; then
          echo "complete=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Prisma engines
      if: steps.prisma-engines-check.outputs.complete == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/prisma
        key: ${{ steps.prisma-engines-cache.outputs.cache-primary-key }}

    - name: Generate gp-api route types
      if: inputs.route-types == 'true'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        if [ -z "${{ inputs.workspace }}" ]; then
          echo "::error::setup-node-workspace: route-types=true requires 'workspace'"
          exit 1
        fi
        npx tsx scripts/generate-route-types.ts
