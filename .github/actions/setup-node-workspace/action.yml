name: Setup Node workspace
description: >-
  Install the monorepo root npm-workspaces dependencies on Node 22, with
  app-scoped node_modules caching, optional contracts build, and optional
  root-aware Prisma generation.

inputs:
  app:
    description: App name used to scope the node_modules cache key.
    required: true
  workspace:
    description: Workspace path, for app-local follow-up commands.
    required: false
    default: ''
  build-contracts:
    description: Build the shared contracts package before app validation/build.
    required: false
    default: 'false'
  prisma-generate-script:
    description: >-
      Root package.json script to run for Prisma generation, for example
      generate:prisma:gp-api. Leave empty for non-Prisma workspaces.
    required: false
    default: ''
  route-types:
    description: Generate gp-api route types after Prisma generation.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Restore node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ inputs.app }}-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Build contracts
      if: inputs.build-contracts == 'true'
      shell: bash
      run: npm run build -w packages/contracts

    - name: Generate Prisma client
      if: inputs.prisma-generate-script != ''
      shell: bash
      run: npm run ${{ inputs.prisma-generate-script }}

    - name: Generate gp-api route types
      if: inputs.route-types == 'true'
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        if [ -z "${{ inputs.workspace }}" ]; then
          echo "::error::setup-node-workspace: route-types=true requires 'workspace'"
          exit 1
        fi
        npx tsx scripts/generate-route-types.ts
