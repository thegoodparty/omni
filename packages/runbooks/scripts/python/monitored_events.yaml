  # ---- Serve · activation: polls ----
  - {event: "Polls - Poll Results Overview Viewed",     product: serve, family: serve, floor: null, owner: TBD}
  - {event: "Polls - Create Poll Clicked",              product: serve, family: serve, floor: null, owner: TBD}
