    question_ref: 86akjza5w
    product: win
    asked_by: bryan@goodparty.org
    headline: >-
      Treat conversions as a floor. Stripe is the number of record, and the people who saw the
      offer are only counted on the dashboard.
    caveats: >-
      The best-instrumented flow in the product, with two reasons the number is a floor rather than
      exact. Both terminal events fire from the Stripe webhook inside try/catch that logs and
      continues, so a Segment outage loses the conversion while the upgrade succeeds, and the two
      can disagree because they fail independently — Stripe is the count of record. And the
      denominator rests on `Pro Upgrade - Banner Viewed`, seen firing on the dashboard only; if the
      banner renders elsewhere without firing, conversion looks better than it is. Step events also
      repeat on funnel re-entry, so count distinct users per step.
