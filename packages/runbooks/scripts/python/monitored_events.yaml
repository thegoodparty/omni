    question: "What share of new candidates reach their first real piece of value, and how long does it take?"
    question_ref: 86akjz9b3
    product: win
    asked_by: bryan@goodparty.org
    headline: >-
      Nothing is missing from the data. Nobody has decided what first value means, and until
