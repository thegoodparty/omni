# Behaviors (DATA-2316): what we are trying to measure, and which events instrument it.
# Absorbs the events: key above over time — a watchlist row is the degenerate case of a
# behavior with one surface and one instrument. Coverage is derived, never written here.
#
# Every instrumented_by below is monitored exactly as an events: row is (DATA-2290): the
# monitor unions the two keys, and a behavior's metric: names the semantic-layer metric it
# answers, with OKR status derived from that metric's anchored_on. So never add an events:
# row for an event named here — validation rule 8 rejects it, and it would be redundant
# anyway.
#
#   id:            stable snake_case key
#   question:      the plain-English thing this behavior lets us answer
#   question_ref:  ClickUp task id in the Analytics Questions list (the intake identity)
#   answers:       optional extra questions this behavior contributes to (composite questions)
#   product:       win | serve | both
#   metric:        optional sem metric name(s) this behavior answers (string or list). A
#                  foreign key into gp-data-platform's sem_*.yml; the events that count are
#                  that metric's anchored_on, never anything written here.
#   page_path:     optional, on a surface: the URL path that qualifies a site-wide page
#                  event (instrumented_by: Viewed, page_path: /dashboard).
#   surfaces[]:    path (repo-relative), label (stable, used in per-surface reporting),
#                  instrumented_by (event name, or explicit null for a known gap)
#   superseded[]:  historical instruments, for successor lineage
#   headline:      what the caveat means for the number, in one plain sentence; this is what
#                  a non-engineer reads, so no event internals, file names or ticket ids
#   caveats:       optional note that travels with the answer (a known data-quality defect)
#   asked_by:      who wants this answered; review nudges route here
#   review:        interval_days, last_reviewed, reviewed_by
behaviors:
  - id: voter_file_exported
    question: "How many candidates export a voter file each week, and is that growing?"
    question_ref: 86ak207a4
    answers:
      - "Are people creating and downloading lists but never doing outreach on our platform?"
    product: win
    asked_by: nate@goodparty.org
    headline: >-
      Count exports from Voter Data - List Exported alone. A second event fires on the same
      download, so counting both doubles the number.
    caveats: >-
      Two events fire per download and they are not duplicates: `Contacts - Download` fires at
      click time and always fires, `Voter Data - List Exported` only from the cookie-confirmed
      success branch and only once the isWinContextReady and listSize gates pass. Count exports
      off List Exported alone; a union double-counts. The gap between the two is a free health
      signal (failed downloads plus the readiness race), not a demand signal.
    surfaces:
      # The only export surface in the product as of 2026-09-16. The outreach-wizard and
      # outreach-table download surfaces were deleted in the v2 rewrite, not silenced —
      # their entries are gone rather than declared gaps (DATA-2343 sweep).
      - path: packages/gp-webapp/app/dashboard/contacts/crm/lists/ListDetailSheet.tsx
        label: crm_list_detail
        instrumented_by: "Voter Data - List Exported"
    superseded:
      - "Download Voter File Success"
    review: {interval_days: 90, last_reviewed: 2026-08-13, reviewed_by: tristan@goodparty.org}

  - id: voter_file_created
    question: "How many candidates create a voter file, across every path that creates one?"
    question_ref: 86ak209gc
    answers:
      - "Are people creating and downloading lists but never doing outreach on our platform?"
    product: win
    asked_by: nate@goodparty.org
    headline: >-
      Treat this as a floor. Six paths create a voter file and only one of them is counted here.
    caveats: >-
      No single event answers this question as asked. `Voter Data - List Created` covers the
      wizard's voter-file branch only; five other paths create a real saved list and emit a
      different event or nothing, so a count off one event is a narrower question than the one
      posed (DATA-2343 sweep). Two further defects: the outreach flow may create a list on every
      abandoned attempt, so a raw count overstates intent (DATA-2308); and both wizard events sit
      behind an `isWinContextReady` gate that DROPS the event rather than misattributing it when
      the mode has not settled, so the wizard's own count has an unmeasured loss rate.
    surfaces:
      # Every path that produces a saved list, enumerated 2026-09-16. Four different events and
      # one silence — the inventory is the answer to "across every path", not any one row.
      - path: packages/gp-webapp/app/dashboard/contacts/crm/wizard/CreateListWizard.tsx
        label: crm_wizard_voter_file
        instrumented_by: "Voter Data - List Created"
      - path: packages/gp-webapp/app/dashboard/contacts/crm/wizard/CreateListWizard.tsx
        label: crm_wizard_activity
        instrumented_by: "Voter Data - Activity List Created"
      - path: packages/gp-webapp/app/dashboard/contacts/crm/lists/useDuplicateList.ts
        label: crm_list_duplicate
        instrumented_by: "Contacts - Segment Created"
      # DATA-2307, relocated: the ticket names components/tasks/flows/AudienceStep.tsx, which the
      # v2 rewrite deleted. The gap moved with the surface and got worse — building an audience is
      # mandatory in every v2 channel flow, so this is now the majority creation path. A
      # recommendation-driven create fires Outreach - Recommended List Accepted; a hand-built one
      # fires nothing.
      - path: packages/gp-webapp/app/dashboard/outreach/v2/audience/useOutreachAudience.ts
        label: outreach_v2_audience_step
        instrumented_by: null          # DATA-2307
      - path: packages/gp-webapp/app/dashboard/door-knocking/native/createFlow/CreateListFlow.tsx
        label: door_knocking_list
        instrumented_by: "Door Knocking - List Created"
      - path: packages/gp-webapp/app/dashboard/outreach/v2/phone-banking/PhoneBankingFlow.tsx
        label: phone_banking_call_list
        instrumented_by: "Voter Outreach - Phone Banking Call List Created"
    superseded:
      - "Custom Voter file created"
    review: {interval_days: 90, last_reviewed: 2026-08-13, reviewed_by: tristan@goodparty.org}

  - id: voter_outreach_scheduled
    question: "How many candidates schedule voter outreach, by channel?"
    question_ref: 86ak20ac5
    answers:
      - "Are people creating and downloading lists but never doing outreach on our platform?"
    product: win
    metric: win_activated_users
    asked_by: nate@goodparty.org
    headline: >-
      Every channel that has a send now records one. Phone banking records nothing, on
      purpose — nothing is ever sent through us on that channel.
    caveats: >-
      `Voter Outreach - Campaign Scheduled` (DATA-2526) is the send terminal for the three
      channels that have one, keyed by `channel` (sms | robocall | social). It is emitted
      server-side from the point where the payment commits — the pending_payment -> pending
      claim for sms, the placement/covered-run CAS for robocall, the save transaction for
      social — so a webhook or pay-step replay cannot double-count. COUNT DISTINCT
      `outreachId`, not rows: the event is not exactly-once per outreach, because a robocall
      whose hold lapses before dial can be re-authorized with a new card and commits a second
      time under the same messageId, days apart and so past Segment's ~24h dedup window. That
      is one send commitment retried, and it must count once. Win only: the
      `Voter Outreach -` prefix classifies to the win_voter_outreach family, so the Serve
      social route deliberately stays silent. Phone banking is excluded by definition, not
      by omission (see its surface below). `win_activated_users` declares this event as a leg
      alongside `Voter Outreach - Campaign Completed`, which since the outreach/v2 rewrite
      survives only on a completed door-knocking walk and the manual self-report modal
      (DATA-2343 sweep). `Robocall - Scheduled` is deliberately NOT a leg of that metric: it
      is a live instrument and stays on the behavior, but it fires at draft-create on an
      unpaid row, so counting it would activate a candidate who built a draft and never
      paid. That scope call is recorded as a dismissal below, not as a gap.
      Outreach Intensity has no governed declaration yet and is not tracked as an OKR here.
    surfaces:
      # Per-channel. Robocall keeps its earlier draft-create milestone AND emits the shared
      # terminal at the pay commit; the two are different moments, not a double-fire. Only
      # the pay-commit terminal is an activation leg; see the dismissal for the other.
      - path: packages/gp-api/src/outreach/services/outreachRobocall.service.ts
        label: robocall_draft_created
        instrumented_by: "Robocall - Scheduled"
      - path: packages/gp-api/src/outreach/services/outreachRobocallHold.service.ts
        label: robocall_scheduled
        instrumented_by: "Voter Outreach - Campaign Scheduled"
      - path: packages/gp-api/src/outreach/services/outreach.service.ts
        label: sms_scheduled
        instrumented_by: "Voter Outreach - Campaign Scheduled"
      - path: packages/gp-api/src/outreach/services/outreachSocial.service.ts
        label: social_scheduled
        instrumented_by: "Voter Outreach - Campaign Scheduled"
      # NOT a gap — a definitional exclusion, settled 2026-09-24. Activation means an action
      # taken through our product. Phone banking has no send: the candidate builds a call list
      # here and then dials it himself or herself, off-platform, over days. List creation and
      # call-sheet download are preparation and are already instrumented as such, so there is
      # nothing further to add and nothing here to fix. Do not re-file this as missing
      # instrumentation; changing it means changing the definition of activation first.
      - path: packages/gp-webapp/app/dashboard/outreach/v2/phone-banking/PhoneBankingFlow.tsx
        label: phone_banking_no_send_terminal
        instrumented_by: null
      - path: packages/gp-webapp/app/dashboard/door-knocking/native/useWalkSession.ts
        label: door_knocking_walk_completed
        instrumented_by: "Voter Outreach - Campaign Completed"
      - path: packages/gp-webapp/app/dashboard/door-knocking/native/createFlow/CreateListFlow.tsx
        label: door_knocking_list_created
        instrumented_by: "Door Knocking - List Created"
    review: {interval_days: 90, last_reviewed: 2026-08-13, reviewed_by: tristan@goodparty.org}

  - id: campaign_plan_viewed
    question: "Do candidates open their campaign plan, and do they read it to the end?"
    question_ref: 86ak20ama
    product: win
    asked_by: nate@goodparty.org
    headline: >-
      Treat this as a floor. A candidate looking at a plan that has not been generated yet is
      not counted.
    caveats: >-
      One thing makes a plan-open number a floor rather than a count. The tracker event returns
      early unless a generated strategy exists, so a candidate looking at an ungenerated plan fires
      nothing — "opened their campaign plan" means "opened a plan that exists".
    surfaces:
      # Cold entry confirmed 2026-09-16: the tracker event fires from a useEffect keyed on the
      # strategy resolving, latched per campaign id — not from a navigation event — so direct and
      # email-link arrivals are counted. The legacy-checklist pointer was removed: the file was
      # deleted and its event is a constant nothing fires, so it is lineage now, not a surface.
      - path: packages/gp-webapp/app/dashboard/campaign-plan/components/campaignStrategy/CampaignStrategySection.tsx
        label: campaign_plan_tracker
        instrumented_by: "Campaign Plan - Campaign Tracker Viewed"
      - path: packages/gp-webapp/app/dashboard/campaign-plan/components/campaignStrategy/CampaignStrategySection.tsx
        label: campaign_plan_read_through
        instrumented_by: null          # no scroll-depth instrument; Nate asked for this
    superseded:
      - "Dashboard - Campaign Plan Viewed"
    review: {interval_days: 90, last_reviewed: 2026-08-13, reviewed_by: tristan@goodparty.org}

  # ---- DATA-2343 walkthrough, 2026-09-15/16 ----
  # Fifteen questions the coverage audit walked on production and then checked against the
  # code. Surfaces and instruments come from that sweep, not from guesswork: where a surface
  # is `null` it was confirmed uninstrumented by reading the code, and where it names an event
  # the fire site was located. Verdict detail lives on each question's ClickUp task.

  - id: signup_onboarding_funnel
    question: "Of the people who start signup, how many complete signup, how many complete onboarding, and where do the rest stop?"
    question_ref: 86akjz92p
    product: win
    asked_by: bryan@goodparty.org
    headline: >-
      Nothing marks onboarding as finished, so the last step is a stand-in. Count people rather
      than events: the steps fire again when someone resumes.
    caveats: >-
      There is no terminal onboarding event. Completion exists only as the user property
      `onboardingCompleted`, so the last funnel step has to be proxied by Pledge Completed or a
      first-dashboard event — the DATA-2337 failure. Two further traps: signup and onboarding are
      separate funnels with a save point between them, so "account with no campaign" and "campaign
      stuck at step N" are different populations a single definition will conflate; and step events
      re-fire on resume, so count distinct users per step, not events.
    surfaces:
      - path: packages/gp-webapp/app/sign-up
        label: signup_entry
        instrumented_by: "Onboarding - Registration Completed"
      - path: packages/gp-webapp/app/onboarding/[slug]/[step]
        label: onboarding_steps
        instrumented_by: "Onboarding V2 - Welcome Completed"
      - path: packages/gp-webapp/app/onboarding/success
        label: onboarding_terminal
        instrumented_by: null
    review: {interval_days: 90, last_reviewed: 2026-09-16, reviewed_by: tristan@goodparty.org}

  - id: acquisition_source_to_activation
    question: "Which acquisition sources produce candidates who actually activate, not just sign up?"
    question_ref: 86akjz989
    product: win
    asked_by: bryan@goodparty.org
    headline: >-
      The tracking is in place but has never been seen working end to end. Watch one real signup
      arrive with campaign tags before trusting a source breakdown.
    caveats: >-
      Capture is in the code but has never been observed end to end: the walked signup arrived with
      no UTMs on the URL, so the profile carried only initial_referrer/referrer. Closing this needs
      one walk with UTM params present, not new instrumentation.
    surfaces:
      - path: packages/gp-webapp/helpers/analyticsHelper.ts
        label: utm_capture
        instrumented_by: "Onboarding - Registration Completed"
      - path: packages/gp-webapp/app/shared/layouts/navigation/SegmentIdentify.tsx
        label: first_last_touch
        instrumented_by: null
    review: {interval_days: 90, last_reviewed: 2026-09-16, reviewed_by: tristan@goodparty.org}

