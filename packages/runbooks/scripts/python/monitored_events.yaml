# Proposals a human reviewed and rejected (DATA-2152). The self-healing proposal queue
# skips these permanently — a dismissed event never re-proposes (it would otherwise keep
# surfacing every run while it is still inside the 90-day first-seen proposal window). Set
# via the /triage-instrumentation-gaps skill; hand-editable. The `date` is informational
# (an audit note); dismissal is not time-bounded.
#   event:  exact Amplitude event_type
#   reason: why it was dismissed (e.g. "UI micro-interaction, not a funnel milestone")
#   date:   YYYY-MM-DD the decision was made
#
# A row carrying `cause:` instead of `event:` dismisses a whole digest cluster in one
# decision -- the deploy, not each event it stranded. The string is the cause key the
# digest prints (e.g. "call_site_removed@2026-09-01", "orphaned_firing"). Dismissed
# causes are struck through and still counted in the digest, never dropped, so a cluster
# that keeps growing after someone waved it through stays visible.
#   cause:  digest cause key
#   reason: why the whole cluster is settled
#   date:   YYYY-MM-DD the decision was made
# `okr_anchor_dormant` and `counter_blind_spot` are refused: a latched OKR anchor clears
# on recovery or on an upstream anchored_on change, and a counter blind spot is our own
# tooling. A row naming either is ignored and reported in the digest.
dismissed:
  - {metric: win_activated_users, event: "Door Knocking - List Created", reason: "building a walk list is preparation to reach voters, not outreach; the completed walk fires Voter Outreach - Campaign Completed with method native, which is the leg", date: "2026-09-24"}
  - {metric: win_activated_users, event: "Robocall - Scheduled", reason: "fires at robocall draft-create on an unpaid row; activation counts the pay commit, which the shared Voter Outreach - Campaign Scheduled terminal emits", date: "2026-09-24"}
