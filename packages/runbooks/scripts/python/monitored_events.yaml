  - {event: "Pro Upgrade - EIN: Click continue", product: win, family: win_pro_upgrade, floor: null, owner: TBD}
  - {event: "Pro Upgrade - Banner: Click Get Pro", product: win, family: win_pro_upgrade, floor: null, owner: TBD}
