# Analytics event-health watchlist (DATA-1952)
#
# Curated set of key Win + Serve events to monitor for flatlines / hard drops.
# Seeded from dbt.int__amplitude_event_taxonomy (watched families) on 2026-06-16.
#
# This list is intentionally a curated SUBSET of each family. The monitor is
# self-healing: analytics_event_health.py surfaces newly-instrumented events in
# the watched families (see watched_families below) so they can be promoted here
# after a human confirms them in code.
#
# Row schema:
#   event:       exact Amplitude event_type (what we count in amplitude_events)
#   code_string: literal string to grep for in the omni repo (defaults to event)
#   product:     win | serve
#   family:      taxonomy family the event belongs to
#   floor:       optional absolute daily floor; null = use only zero + median checks
#   owner:       team/person, TBD until assigned
#   okr:         optional OKR metric name(s) anchored on this event (string or list).
#                Marks the event as top-tier for the governance digest (DATA-2174):
#                a breaking signal on an okr: row renders as 🔴 needs-action.

# Families the monitor treats as "in scope" for coverage-drift / new-event detection.
watched_families:
  - win_onboarding
  - win_dashboard
  - win_pro_upgrade
  - win_outreach_scheduling
  - win_voter_outreach
  - win_voter_data
  - serve

events:
  # ---- Win · onboarding funnel ----
  - {event: "Sign Up Clicked",                          product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Candidate Office Searched",   product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Office Step: Office Selected", product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Candidate Office Completed",  product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Registration Completed",      product: win, family: win_onboarding, floor: null, owner: TBD, okr: "Onboarded"}
  - {event: "Onboarding - User Created",                product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Candidate Affiliation Completed", product: win, family: win_onboarding, floor: null, owner: TBD}
  # Pledge-union okr flags are doc-level confidence (knowledge-doc definition, no dbt model).
  - {event: "Onboarding - Candidate Pledge Completed",  product: win, family: win_onboarding, floor: null, owner: TBD, okr: "Onboarding Completed (pledge)"}
  - {event: "onboarding_complete",                      product: win, family: win_onboarding, floor: null, owner: TBD, okr: "Onboarding Completed (legacy)"}
  # Win onboarding V2 (first seen 2026-05-07)
  - {event: "Onboarding - Welcome Completed",           product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Ballot Status Completed",     product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Party Selection Completed",   product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Office Selection Completed",  product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Pledge Completed",            product: win, family: win_onboarding, floor: null, owner: TBD, okr: "Onboarding Completed (pledge)"}
  - {event: "Onboarding - Path To Victory Completed",   product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Know Your Voters Completed",  product: win, family: win_onboarding, floor: null, owner: TBD}
  # Magic-link auth funnel (replaced Serve/Win Onboarding - Magic Link *; first seen 2026-06)
  - {event: "Onboarding - Magic Link Sent",             product: win, family: win_onboarding, floor: null, owner: TBD}
  - {event: "Onboarding - Magic Link Clicked",          product: win, family: win_onboarding, floor: null, owner: TBD}

  # ---- Win · activation: dashboard ----
  # Candidate Dashboard Viewed is code-retired (PR #732) but still anchors the OKR until
  # DATA-2173 re-anchors it — the okr flag documents the (currently broken) dependency.
  - {event: "Dashboard - Candidate Dashboard Viewed",   product: win, family: win_dashboard, floor: null, owner: TBD, okr: "Active Candidates"}
  - {event: "Dashboard - Campaign Plan Generation Completed", product: win, family: win_dashboard, floor: null, owner: TBD}

  # ---- Win · activation: voter outreach (campaign sent) ----
  - {event: "Schedule Text Campaign - Audience: Enter Audience Request", product: win, family: win_outreach_scheduling, floor: null, owner: TBD}
  - {event: "Schedule Text Campaign: Submit",           product: win, family: win_outreach_scheduling, floor: null, owner: TBD}
  - {event: "Voter Outreach - 10DLC Compliance Completed", product: win, family: win_voter_outreach, floor: null, owner: TBD}
  - {event: "Voter Outreach - 10DLC Compliance PIN Sent", product: win, family: win_voter_outreach, floor: null, owner: TBD}

  # ---- Win · activation: pro upgrade ----
