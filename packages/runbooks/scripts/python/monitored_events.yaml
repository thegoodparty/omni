    question_ref: 86akjzat6
    product: win
    asked_by: zak@goodparty.org
    headline: >-
      Expect a positive result whether or not it is real. Only candidates who come back after
      election day report an outcome, and coming back is itself the thing being measured.
    caveats: >-
      Use the event, not the column: campaigns.service.ts clears Campaign.didWin when a re-running
      candidate moves their election date (ENG-10954), so the column is current-race-only and a
      multi-cycle cohort loses its history. That is the storage problem. The reason this stays
      caveated is selection, which no event fixes — only candidates who return after election day
      report an outcome, returning correlates with having won, and returning also correlates with
      product usage, the independent variable. The bias runs with the hypothesis, so a positive
      correlation is the expected result whether or not the effect is real. An external results feed
      joined on race id is the only fix.
    surfaces:
      - path: packages/gp-webapp/app/dashboard/election-result/components/ElectionResultPage.tsx
        label: self_reported_outcome
        instrumented_by: "Candidacy - Did You Win Modal Completed"
