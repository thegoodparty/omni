resources:
  schemas:
    typed:
      catalog_name: ${var.catalog}
      name: ${var.mirror_schema}_typed
      comment: >-
        Views over ${var.mirror_schema} with timestamp-without-time-zone
        columns cast back to TIMESTAMP (src/typed_views.py).

  jobs:
    typed_views:
      name: gp-api-mirror-${var.env}-typed-views
      max_concurrent_runs: 1
      # New columns and tables reach the views at the next run; run it by
      # hand after a migration to skip the wait.
      schedule:
        quartz_cron_expression: 0 0 7 * * ?
        timezone_id: UTC
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: typed_views
          spark_python_task:
            python_file: ../src/typed_views.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.mirror.name}
              - ${resources.schemas.typed.name}
              - ${var.connection_name}
              - ${var.source_database}
          # Classic compute, because it reads the source through the
          # connection and only the workspace VPC is peered to gp-api's.
          # remote_query needs Databricks Runtime 18.3 or later.
          new_cluster:
            spark_version: 18.x-scala2.13
            node_type_id: m5.large
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: local[*, 4]
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
