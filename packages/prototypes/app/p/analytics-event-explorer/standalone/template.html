<meta charset="utf-8" />
<title>Analytics Events Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>
<style>
  :root {
    --bg: #f4f6f7;
    --surface: #ffffff;
    --surface-2: #eef1f3;
    --ink: #14181b;
    --ink-2: #4b555d;
    --ink-3: #78848c;
    --line: #dde3e6;
    --line-2: #c6d0d5;
    --accent: #0f5f61;
    --accent-ink: #ffffff;
    --good: #1c6b45;
    --good-bg: #dff0e6;
    --warn: #8a5a09;
    --warn-bg: #fbeed3;
    --crit: #a32c22;
    --crit-bg: #fadedb;
    --shadow:
      0 1px 2px rgba(20, 24, 27, 0.06), 0 1px 1px rgba(20, 24, 27, 0.04);
    --sans:
      'Public Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
      sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0f1315;
      --surface: #171c1f;
      --surface-2: #1f262a;
      --ink: #e8edef;
      --ink-2: #aeb9bf;
      --ink-3: #7d8a91;
      --line: #2a3338;
      --line-2: #3a464c;
      --accent: #4bb3b0;
      --accent-ink: #07211f;
      --good: #6fd39b;
      --good-bg: #123024;
      --warn: #e0b45c;
      --warn-bg: #362a10;
      --crit: #f08a7e;
      --crit-bg: #3a1a17;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme='dark'] {
    --bg: #0f1315;
    --surface: #171c1f;
    --surface-2: #1f262a;
    --ink: #e8edef;
    --ink-2: #aeb9bf;
    --ink-3: #7d8a91;
    --line: #2a3338;
    --line-2: #3a464c;
    --accent: #4bb3b0;
    --accent-ink: #07211f;
    --good: #6fd39b;
    --good-bg: #123024;
    --warn: #e0b45c;
    --warn-bg: #362a10;
    --crit: #f08a7e;
    --crit-bg: #3a1a17;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  * {
    box-sizing: border-box;
  }
  .wrap {
    max-width: 1140px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 0 56px;
  }

  /* ---- sticky header ------------------------------------------------------ */
  header.bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin-inline: -16px;
    padding: 12px 16px 10px;
  }
  .titlerow {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .freshness {
    font-size: 12px;
    color: var(--ink-3);
    font-family: var(--mono);
  }
  .freshness b {
    color: var(--ink-2);
    font-weight: 500;
  }

  .searchwrap {
    position: relative;
    margin-top: 10px;
  }
  #q {
    width: 100%;
    padding: 9px 34px 9px 34px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 8px;
  }
  #q:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .searchwrap svg.mag {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-3);
  }
  #clearq {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: 0;
    color: var(--ink-3);
    cursor: pointer;
    padding: 4px;
    line-height: 0;
  }

  .filterrow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 9px;
  }
  .filterlabel {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-right: 2px;
  }
  .pill {
    font: inherit;
    font-size: 12px;
    padding: 3px 11px;
    border-radius: 999px;
    cursor: pointer;
    background: var(--surface);
    color: var(--ink-2);
    border: 1px solid var(--line-2);
  }
  .pill:hover {
    border-color: var(--ink-3);
  }
  .pill[aria-pressed='true'] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .pill .n {
    font-family: var(--mono);
    opacity: 0.75;
    margin-left: 4px;
  }
  select.pill {
    padding-right: 24px;
  }
  .linkbtn {
    font: inherit;
    font-size: 12px;
    background: none;
    border: 0;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
  }

  /* ---- sections ----------------------------------------------------------- */
  section {
    margin-top: 26px;
  }
  .sechead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    margin-bottom: 10px;
  }
  .sectoggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-2);
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0;
  }
  .sectoggle:hover {
    color: var(--ink);
  }
  .sectoggle .caret {
    transition: transform 0.15s ease;
  }
  .sectoggle[aria-expanded='false'] .caret {
    transform: rotate(-90deg);
  }
  .seccount {
    font-family: var(--mono);
    font-weight: 400;
    color: var(--ink-3);
    text-transform: none;
    letter-spacing: 0;
  }

  /* ---- area grid ---------------------------------------------------------- */
  .areagrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 8px;
  }
  .areacard {
    text-align: left;
    font: inherit;
    cursor: pointer;
    padding: 10px 11px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .areacard:hover {
    border-color: var(--line-2);
  }
  .areacard[aria-pressed='true'] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .areacard .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .areacard .nm {
    font-weight: 600;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .areacard .tot {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
  }
  .dots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-2);
  }
  .dot {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .dot i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }
  .i-good {
    background: var(--good);
  }
  .i-warn {
    background: var(--warn);
  }
  .i-crit {
    background: var(--crit);
  }
  .i-mute {
    background: var(--line-2);
  }
  .areacard .alarm {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--crit);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 11px;
    color: var(--ink-3);
  }

  /* ---- question cards ----------------------------------------------------- */
  .qcard {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .qcard[data-sel='1'] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .qhead {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: start;
    justify-content: space-between;
  }
  .qtext {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    max-width: 60ch;
    text-wrap: balance;
  }
  .qblurb {
    color: var(--ink-2);
    margin: 6px 0 0;
  }
  .caveat {
    display: flex;
    gap: 9px;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--warn-bg);
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
  }
  .caveat .ct {
    font-weight: 600;
    color: var(--warn);
  }
  .caveat p {
    margin: 3px 0 0;
  }
  .caveat details {
    margin-top: 6px;
  }
  .caveat summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--ink-3);
  }
  .caveat details p {
    font-size: 12px;
    color: var(--ink-3);
  }
  .surfaces {
    margin-top: 11px;
  }
  .surfaces .lbl,
  .fieldlbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
  }
  .surf {
    display: flex;
    gap: 7px;
    align-items: baseline;
    margin-top: 3px;
  }
  .surf .mark {
    font-family: var(--mono);
    font-weight: 500;
  }
  .m-live {
    color: var(--good);
  }
  .m-dead {
    color: var(--crit);
  }
  .m-gap {
    color: var(--ink-3);
  }
  .qmeta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 11px;
    font-size: 12px;
    color: var(--ink-3);
  }
  .qmeta a {
    color: var(--accent);
  }

  .btn {
    font: inherit;
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 7px;
    cursor: pointer;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-2);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }
  .btn:hover {
    border-color: var(--ink-3);
  }
  .btn.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .btn[disabled] {
    opacity: 0.5;
    cursor: default;
  }

  /* ---- table -------------------------------------------------------------- */
  .tablewrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    background: var(--surface-2);
    padding: 8px 10px;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  tbody td {
    padding: 8px 10px;
    border-top: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr.row {
    cursor: pointer;
  }
  tbody tr.row:hover {
    background: var(--surface-2);
  }
  .evname {
    font-weight: 600;
  }
  .evdesc {
    font-size: 12px;
    color: var(--ink-3);
    max-width: 46ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .num {
    font-family: var(--mono);
    text-align: right;
    white-space: nowrap;
  }
  .date {
    font-family: var(--mono);
    white-space: nowrap;
    color: var(--ink-2);
    font-size: 12px;
  }
  .chev {
    color: var(--ink-3);
    transition: transform 0.15s ease;
    display: inline-block;
  }
  tr.row[aria-expanded='true'] .chev {
    transform: rotate(90deg);
  }
  .lineagehint {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 3px;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .b-good {
    background: var(--good-bg);
    color: var(--good);
  }
  .b-warn {
    background: var(--warn-bg);
    color: var(--warn);
  }
  .b-crit {
    background: var(--crit-bg);
    color: var(--crit);
  }
  .b-mute {
    background: var(--surface-2);
    color: var(--ink-2);
  }

  /* ---- detail ------------------------------------------------------------- */
  .detail {
    background: var(--surface-2);
    padding: 14px 12px 18px;
  }
  .verdictrow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .lineage {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  .field .v {
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 14px;
  }
  .prov {
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 11px;
  }
  .mono {
    font-family: var(--mono);
    font-size: 12px;
  }
  .muted {
    color: var(--ink-3);
  }

  /* ---- whats next --------------------------------------------------------- */
  .next {
    margin-top: 30px;
    border: 1px dashed var(--line-2);
    border-radius: 10px;
    padding: 14px;
    background: var(--surface);
  }
  .nextgrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 9px;
    margin-top: 10px;
  }
  .nextcard {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px;
  }
  .nextcard .h {
    font-weight: 600;
  }
  .nextcard p {
    margin: 4px 0 9px;
    font-size: 12px;
    color: var(--ink-3);
  }

  .empty {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
  }
  .partial {
    border: 1px dashed var(--line-2);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--ink-3);
  }
  .note {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 8px;
  }
  .qintro {
    font-size: 13px;
    color: var(--ink-2);
    margin: 0 0 10px;
    max-width: 64ch;
  }
  #usage {
    margin-top: 30px;
  }
  .usagegrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 10px;
  }
  .try {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 12px;
  }
  /* multi-select dropdown */
  details.dd {
    position: relative;
  }
  details.dd > summary {
    list-style: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    border: 1px solid var(--line-2);
    white-space: nowrap;
  }
  details.dd > summary::-webkit-details-marker {
    display: none;
  }
  details.dd[data-on='1'] > summary {
    border-color: var(--accent);
    color: var(--ink);
  }
  details.dd > .menu {
    position: absolute;
    z-index: 40;
    margin-top: 4px;
    min-width: 210px;
    max-height: 280px;
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 4px;
  }
  details.dd .opt {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 12px;
    padding: 5px 7px;
    border: 0;
    background: none;
    color: var(--ink);
    cursor: pointer;
    border-radius: 6px;
  }
  details.dd .opt:hover {
    background: var(--surface-2);
  }
  details.dd .opt .box {
    width: 14px;
    height: 14px;
    border: 1px solid var(--line-2);
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    font-size: 10px;
  }
  details.dd .opt[aria-selected='true'] .box {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  details.dd .opt .cnt {
    margin-left: auto;
    font-family: var(--mono);
    color: var(--ink-3);
  }
  .numin,
  .datein {
    height: 26px;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 7px;
    padding: 0 7px;
  }
  .numin {
    width: 74px;
  }
  .inlabel {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--ink-3);
  }
  thead th button.sorter {
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  thead th button.sorter:hover {
    color: var(--ink);
  }
  thead th button.sorter[data-on='1'] {
    color: var(--ink);
  }
  .answeredby {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 7px;
    color: var(--ink);
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<div class="wrap">
  <header class="bar">
    <div class="titlerow">
      <h1>Analytics Events Explorer</h1>
      <span class="freshness" id="freshness"></span>
    </div>
    <div class="searchwrap">
      <svg
        class="mag"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input
        id="q"
        type="search"
        autocomplete="off"
        placeholder="How do we measure…?  An event name, a question, or a product area."
      />
      <button id="clearq" hidden aria-label="Clear search">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="filterrow" id="prodrow">
      <span class="filterlabel">Product</span>
    </div>
  </header>

  <div class="try" id="tryrow">Try:</div>

  <div id="results"></div>

  <section class="next" id="whatsnext"></section>

  <section id="usage" hidden></section>
</div>

<script id="snapshot" type="application/json">
  __DATA__
</script>
<script>
  ;(function () {
    'use strict'
    var DATA = JSON.parse(document.getElementById('snapshot').textContent)
    var SLACK = 'https://goodpartyorg.slack.com/archives/C0BECEK0603'
    var FORM = DATA.request_form_url || ''
    var EVENTS = DATA.events,
      QUESTIONS = DATA.questions,
      AREAS = DATA.areas,
      WEEKS = DATA.series_weeks || []

    // ---- product: the tag is authoritative, the code path only fills gaps ----------
    // CreateListWizard.tsx fires a Win event and a Serve event from the same file, so a
    // directory can never override a human's explicit tag.
    var PATH_RULES = [
      ['packages/gp-webapp/app/serve', 'serve'],
      ['packages/gp-webapp/app/polls', 'serve'],
      ['packages/gp-webapp/app/dashboard/polls', 'serve'],
      ['packages/gp-webapp/app/dashboard/briefings', 'serve'],
      ['packages/gp-webapp/app/dashboard/ordinances', 'serve'],
      ['packages/gp-webapp/app/dashboard/community-issues', 'serve'],

    function usedBy(e) {
      var qs = e.questions || [],
        ub = e.used_by || []
      if (!qs.length && !ub.length) return ''
      var out =
        '<div style="margin-top:14px"><div class="fieldlbl">Used by</div>'

              )

            .join('') +

      }
      ;[

    }

    var SORT_COLS = [
      ['name', 'Event'],
      ['area', 'Area'],
      ['added', 'Added'],
      ['state', 'State'],
      ['count', '30d'],
    ]
    var STATE_ORDER = {
      orphaned_firing: 0,
      instrumented_never_observed: 1,
      dormant: 2,
      deprecating: 3,
      code_unknown: 4,
      active: 5,
      retired: 6,
      system: 7,
    }
    function sortVal(e, k) {
      if (k === 'name') return e.display_name.toLowerCase()
      if (k === 'area') return e.area.toLowerCase()
      if (k === 'added') return (e.provenance || {}).instrumented_date || ''
      if (k === 'state')
        return STATE_ORDER[e.status] == null ? 9 : STATE_ORDER[e.status]
      return e.count_30d || 0
    }
    function sortList(list) {
      if (!state.sortKey) return list
      var out = list.slice()
      out.sort(function (a, b) {
        var av = sortVal(a, state.sortKey),
          bv = sortVal(b, state.sortKey)
        // An unknown date sorts last both ways rather than posing as the oldest event.
        if (av === '' && bv === '') return 0
        if (av === '') return 1
        if (bv === '') return -1
        if (av === bv) return 0
        return (av < bv ? -1 : 1) * (state.sortDir === 'asc' ? 1 : -1)
      })
      return out
    }

    function eventTable(list) {
      if (!list.length)
        return '<div class="empty">No events match these filters.</div>'
      var rows = sortList(list)
        .slice(0, 200)
        .map(function (e) {
          var v = verdict(e),
            l = lineage(e),
            open = !!state.open[e.event_type]
          var hint = l.replacedBy
            ? '→ ' + l.replacedBy.display_name
            : l.replacedByArea
              ? '→ ' + l.replacedByArea + ' family'
              : l.deadEnd
                ? 'no replacement'
                : ''
          return (
            '<tr class="row" data-ev="' +
            esc(e.event_type) +
            '" aria-expanded="' +
            open +
            '">' +
            '<td style="width:22px"><span class="chev">›</span></td>' +
            '<td><div class="evname">' +
            esc(e.display_name) +
            '</div>' +
            (e.description
              ? '<div class="evdesc">' + esc(e.description) + '</div>'
              : '') +
            '</td>' +
            '<td class="muted">' +
            esc(e.area) +
            '</td>' +
            '<td class="date">' +
            esc((e.provenance || {}).instrumented_date || '—') +
            '</td>' +
            '<td>' +
            badge(v[0], v[1]) +
            (hint ? '<div class="lineagehint">' + esc(hint) + '</div>' : '') +
            '</td>' +
            '<td class="num">' +
            fmt(e.count_30d) +
            '</td>' +
            '<td>' +
            sparkline(e.series) +
            '</td></tr>' +
            (open
              ? '<tr><td colspan="7" style="padding:0">' +
                detail(e) +
                '</td></tr>'
              : '')
          )
        })
        .join('')
      var heads = SORT_COLS.map(function (c) {
        var on = state.sortKey === c[0]
        var glyph = !on
          ? '\u21c5'
          : state.sortDir === 'asc'
            ? '\u2191'
            : '\u2193'
        return (
          '<th' +
          (c[0] === 'count' ? ' class="num"' : '') +
          ' aria-sort="' +
          (on
            ? state.sortDir === 'asc'
              ? 'ascending'
              : 'descending'
            : 'none') +
          '">' +
          '<button class="sorter" data-sort="' +
          c[0] +
          '" data-on="' +
          (on ? 1 : 0) +
          '">' +
          c[1] +
          ' <span aria-hidden="true">' +
          glyph +
          '</span></button></th>'
        )
      }).join('')
      return (
        '<div class="tablewrap"><table><thead><tr><th></th>' +
        heads +
        '<th>Trend</th></tr></thead><tbody>' +
        rows +
        '</tbody></table></div>' +
        (list.length > 200
          ? '<div class="note">Showing the first 200 of ' +
            list.length +
            '. Narrow with search or a filter.</div>'
          : '')
      )
    }

    function dropdown(key, label, selected, opts, attr) {
      var summary =
        selected.length === 0
          ? 'All ' + label.toLowerCase()
          : selected.length === 1
            ? (opts.filter(function (o) {
                return o[0] === selected[0]
              })[0] || [0, label])[1]
            : label + ': ' + selected.length
      var body =
        (selected.length
          ? '<button class="opt" data-clear="' +
            attr +
            '"><span class="box"></span>Clear ' +
            label.toLowerCase() +
            '</button>'
          : '') +
        opts
          .map(function (o) {
            var on = selected.indexOf(o[0]) >= 0
            return (
              '<button class="opt" aria-selected="' +
              on +
              '" data-' +
              attr +
              '="' +
              esc(o[0]) +
              '">' +
              '<span class="box">' +
              (on ? '\u2713' : '') +
              '</span><span>' +
              esc(o[1]) +
              '</span>' +
              (o[2] != null ? '<span class="cnt">' + o[2] + '</span>' : '') +
              '</button>'
            )
          })
          .join('')
      return (
        '<details class="dd" data-dd="' +
        key +
        '" data-on="' +
        (selected.length ? 1 : 0) +
        '"' +
        (state.dd === key ? ' open' : '') +
        '><summary>' +
        esc(summary) +
        ' \u25be</summary><div class="menu">' +
        body +
        '</div></details>'
      )
    }

    function section(key, title, count, asideHtml, bodyHtml, defaultOpen) {
      var open =
        key in state.sections ? state.sections[key] : defaultOpen !== false
      return (
        '<section><div class="sechead">' +
        '<button class="sectoggle" data-sec="' +
        key +
        '" aria-expanded="' +
        open +
        '"><span class="caret">▾</span>' +
        esc(title) +
        (count != null
          ? ' <span class="seccount">(' + count + ')</span>'
          : '') +
        '</button>' +
        (open ? asideHtml || '' : '') +
        '</div>' +
        (open ? bodyHtml : '') +
        '</section>'
      )
    }

    // ---- filtering -------------------------------------------------------------------
    function narrow(list) {
      return list.filter(function (e) {
        if (state.area && e.area !== state.area) return false
        if (state.products.length && state.products.indexOf(e._p) < 0)
          return false
        if (state.origins.length && state.origins.indexOf(e._fires) < 0)
          return false
        if (state.statuses.length) {
          var ok = STATUS_GROUPS.some(function (g) {
            return (
              state.statuses.indexOf(g[0]) >= 0 && g[2].indexOf(e.status) >= 0
            )
          })
          if (!ok) return false
        }
        // An event with no attributable commit has no date to compare, so a date filter
        // necessarily drops it rather than guessing that it is old.
        if (
          state.addedAfter &&
          ((e.provenance || {}).instrumented_date || '') < state.addedAfter
        )
          return false
        if (
          state.minVolume !== '' &&
          (e.count_30d || 0) < Number(state.minVolume)
        )
          return false
        return true
      })
    }

    function renderNext() {
      // No "request an event" exit on purpose: nobody arrives wanting an event, they

    function render() {
      // header bits
      var fresh = document.getElementById('freshness')
      fresh.innerHTML =
        EVENTS.length +
        ' events · ' +
        QUESTIONS.length +
        ' questions · ' +
        AREAS.length +
        ' areas · data as of <b>' +
        esc(fmtWhen(DATA.refreshed_at)) +
        '</b> · next refresh <b>' +
        esc(fmtWhen(nextRun())) +
        '</b>'

      var counts = {}
      EVENTS.forEach(function (e) {
        counts[e._p] = (counts[e._p] || 0) + 1
      })
      var prow = document.getElementById('prodrow')
      prow.innerHTML =
        '<span class="filterlabel">Product</span>' +
        PRODUCTS.map(function (p) {
          return (
            '<button class="pill" aria-pressed="' +
            (state.products.indexOf(p[0]) >= 0) +
            '" data-prod="' +
            p[0] +
            '">' +
            esc(p[1]) +
            '<span class="n">' +

          ? '<button class="linkbtn" id="clearf">Clear filters</button>'
          : '')

      document.getElementById('tryrow').hidden = !!state.q
      document.getElementById('clearq').hidden = !state.q

      var out = '',
        res = search(state.q),
        searching = !!state.q.trim()
      var activeQ = state.question
        ? QUESTIONS.filter(function (q) {
            return q.id === state.question
          })[0]
        : null

      if (searching && res.total === 0) {
        out +=
          '<div class="empty"><b>Nothing matches &ldquo;' +
          esc(state.q) +
          '&rdquo;.</b>' +
          '<p class="note">That may mean we do not measure it yet.</p><div class="links">' +
          (FORM
            ? '<a class="btn primary" href="' +
              esc(FORM) +
              '" target="_blank" rel="noreferrer">Ask for it to be measured</a>'
            : '') +
          (USAGE.canComment()
            ? '<button class="btn" data-feedback="empty">Tell me what you were looking for</button>'
            : '') +
          '<a class="btn" href="' +

          '" target="_blank" rel="noreferrer">Ask in #product-analytics</a></div></div>'
      }
      if (searching && res.partial) {
        out +=
          '<div class="partial">Nothing matches every word of &ldquo;' +
          esc(state.q) +
          '&rdquo;. These are the closest matches.</div>'
      }
      if (searching && res.questions.length) {
        out += section(
          'sq',
          'Questions',
          res.questions.length,
          '',
          res.questions
            .slice(0, 4)
            .map(function (h) {
              return questionCard(h.it)
            })
            .join(''),
        )
      }
      if (searching && res.areas.length) {
        out += section(
          'sa',
          'Product areas',
          res.areas.length,
          '',
          '<div class="areagrid">' +
            res.areas
              .slice(0, 8)
              .map(function (h) {
                return areaCard(h.it)
              })
              .join('') +
            '</div>',
        )
      }
      if (!searching) {
        var legend =
          '<span class="legend"><span class="dot"><i class="i-good"></i>active</span><span class="dot"><i class="i-warn"></i>dormant</span><span class="dot"><i class="i-crit"></i>orphaned or never seen</span><span class="dot"><i class="i-mute"></i>retired</span></span>'
        out += section(
          'areas',
          'By product area',
          AREAS.length,
          legend,
          '<div class="areagrid">' +
            AREAS.slice(0, 20).map(areaCard).join('') +
            '</div>',
        )
        var qs = state.products.length
          ? QUESTIONS.filter(function (q) {
              return state.products.indexOf(q.product) >= 0
            })
          : QUESTIONS
        var broken = qs.filter(function (q) {
          return q.coverage !== 'covered'
        }).length
        out += section(
          'questions',
          'By business question',
          qs.length,
          '<span class="badge b-mute">' +
            broken +
            ' not fully answerable</span>',
          '<p class="qintro">What people have asked to be able to answer. Each one shows what we can measure ' +
            'today and what is missing.</p>' +
            qs.map(questionCard).join(''),
          false,
        )
      }

      // events
      var scope
      if (activeQ) {
        var named = {}
        ;(activeQ.surfaces || []).forEach(function (s) {
          if (s.instrumented_by) named[s.instrumented_by] = 1
        })
        var answering = EVENTS.filter(function (e) {
          return named[e.display_name]
        })
        var areasIn = {}
        answering.forEach(function (e) {
          areasIn[e.area] = 1
        })
        var ansT = {}
        answering.forEach(function (e) {
          ansT[e.event_type] = 1
        })
        scope = {
          answering: answering,
          related: EVENTS.filter(function (e) {
            return areasIn[e.area] && !ansT[e.event_type]
          }),
          areas: Object.keys(areasIn),
        }
      }
      var base = scope
        ? scope.answering
        : searching
          ? res.events.map(function (h) {

          : EVENTS
      var shown = narrow(base)

      var areaOpts =
        '<select class="pill" id="areasel"><option value="">All areas</option>' +

            '"' +
            (state.area === a.name ? ' selected' : '') +
            '>' +
            esc(a.name) +
            ' (' +
            a.total +
            ')</option>'
          )
        }).join('') +
        '</select>'
      var statusCounts = {}
      STATUS_GROUPS.forEach(function (g) {

          return g[2].indexOf(e.status) >= 0
        }).length
      })
      var stateDD = dropdown(
        'states',
        'States',
        state.statuses,
        STATUS_GROUPS.map(function (g) {
          return [g[0], g[1], statusCounts[g[0]]]
        }),
        'status',
      )
      var prodDD = dropdown(
        'products',
        'Products',
        state.products,
        PRODUCTS.map(function (p) {
          return [p[0], p[1], counts[p[0]] || 0]
        }),
        'prod',
      )
      var firesDD = dropdown(
        'fires',
        'Fires in',
        state.origins,

        'fires',

        '<label class="inlabel">Added after <input class="datein" type="date" id="addedafter" value="' +

      var volIn =

      var aside =

        stateDD +
        firesDD +

        dateIn +
        volIn +
        (activeQ
          ? '<button class="linkbtn" id="clearq2">clear question</button>'
          : '') +
        '</span>'

      out += section(
        'events',
        activeQ
          ? 'Events answering this question'

      if (scope && scope.related.length) {

        out += section(

          rel.length,
          '<span class="note" style="margin:0">not named by this question, but in the same part of the product</span>',
          eventTable(rel),

      document.getElementById('results').innerHTML = out

    function filtersOn() {
      return !!(
        state.area ||
        state.products.length ||
        state.origins.length ||
        state.statuses.length ||
        state.question ||
        state.addedAfter ||
        state.minVolume
      )
    }
    function fmtWhen(iso) {
      if (!iso) return 'unknown'
      var d = new Date(iso)
      return isNaN(d)
        ? iso
        : d.toLocaleString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            timeZone: 'UTC',
          }) + ' UTC'
    }
    // The republish, not the cron: the page moves an hour after the pipeline runs.
    function nextRun() {
      var d = new Date()
      d.setUTCHours(12, 0, 0, 0)
      if (d <= new Date()) d.setUTCDate(d.getUTCDate() + 1)
      while ([1, 4].indexOf(d.getUTCDay()) < 0) d.setUTCDate(d.getUTCDate() + 1)
      return d.toISOString()
    }

    // ---- usage and feedback (DATA-2506) ---------------------------------------------
    // This page is the trial's only instrument. It has no server of its own, so what
    // people do here goes to the artifact's own store, one document per visit, and is
    // read back later. Rows carry the viewer's opaque id and never a name: names differ
    // per viewer and go stale, so they are resolved at render time instead.
    var USAGE = (function () {
      var udb = null,
        uuser = null,
        ucomments = null
      var me = null,
        owner = false,
        ref = null,
        doc = null
      var timer = null,
        saving = false,
        again = false,
        dead = false,
        lastQ = ''

      function newId() {
        return (
          new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) +
          '-' +
          Math.random().toString(36).slice(2, 8)
        )
      }

      function schedule() {
        if (dead || !ref) return
        clearTimeout(timer)
        timer = setTimeout(flush, 1500)
      }

      // One write at a time per document. Memory is the source of truth and the document
      // is its projection, so a full set() never has to read-modify-write a counter.
      function flush() {
        if (dead || !ref) return
        if (saving) {
          again = true
          return
        }
        saving = true
        doc.last_at = new Date().toISOString()
        ref.set(doc).then(
          function () {
            saving = false
            if (again) {
              again = false
              schedule()
            }
          },
          function (e) {
            saving = false
            // quota_exceeded means the store is full: stop writing rather than retry.
            if (e && e.code !== 'unavailable') dead = true
          },
        )
      }

      function capped(arr, n, v) {
        if (arr.length < n) arr.push(v)
      }

      function init() {
        if (!window.claude || !claude.use) return
        Promise.all([
          claude.use('user'),
          claude.use('db'),
          claude.use('comments'),
        ]).then(
          function (caps) {
            uuser = caps[0]
            udb = caps[1]
            ucomments = caps[2]
            if (ucomments) {
              renderNext()
              render()
            }
            var who = uuser
              ? Promise.all([uuser.id(), uuser.isOwner()])
              : Promise.resolve([null, false])
            return who.then(function (r) {
              me = r[0]
              owner = r[1]
              if (udb) {
                ref = udb.collection('sessions').doc(newId())
                doc = {
                  viewer: me || '',
                  started_at: new Date().toISOString(),
                  last_at: new Date().toISOString(),
                  snapshot: DATA.refreshed_at || '',
                  searches: [],
                  events: [],
                  questions: [],
                  clicks: {},
                  feedback: 0,
                }
                flush() // a visit with no interaction is still a visit
              }
              if (owner && udb) panel()
            })
          },
          function () {
            /* no viewer answered; the page is unchanged */
          },
        )
      }

      // ---- what gets recorded ----
      function search(q, total, question, partial) {
        q = (q || '').trim()
        if (!doc || q.length < 2 || q === lastQ) return
        lastQ = q
        capped(doc.searches, 150, {
          q: q,
          total: total,
          question: !!question,
          partial: !!partial,
        })
        schedule()
      }
      function opened(name) {
        if (!doc || doc.events.indexOf(name) >= 0) return
        capped(doc.events, 200, name)
        schedule()
      }
      function picked(qid) {
        if (!doc || doc.questions.indexOf(qid) >= 0) return
        capped(doc.questions, 60, qid)
        schedule()
      }
      // Classify by destination rather than by tagging every builder: a link added later
      // is counted without anyone remembering to mark it.
      function kindOf(href) {
        if (href.indexOf('amplitude.com') >= 0) return 'amplitude'
        if (href.indexOf('github.com') >= 0) return 'github'
        if (href.indexOf('/v/fm/') >= 0) return 'form'
        if (href.indexOf('clickup.com') >= 0) return 'ticket'
        if (href.indexOf('slack.com') >= 0) return 'slack'
        if (href.indexOf('claude.ai') >= 0) return 'answer'
        if (href.indexOf('goodparty.org') >= 0) return 'product'
        return 'other'
      }
      function clicked(href) {
        if (!doc) return
        var k = kindOf(href)
        doc.clicks[k] = (doc.clicks[k] || 0) + 1
        schedule()
      }

      // ---- feedback: the shell's own composer, so nothing is posted by the page ----
      function feedback(el) {
        if (!ucomments) return
        if (doc) {
          doc.feedback = (doc.feedback || 0) + 1
          schedule()
        }
        ucomments.openComposer({ element: el }).then(
          function (r) {
            if (!r || r.opened) return
            el.setAttribute(
              'data-note',
              'finish the comment you already started',
            )
          },
          function () {
            ucomments = null
            renderNext()
            render()
          },
        )
      }

      // ---- owner-only read-out ----
      function panel() {
        var host = document.getElementById('usage')
        if (!host) return
        host.hidden = false
        host.innerHTML =
          '<div class="sechead"><span class="sectoggle">Usage</span>' +
          '<span class="note" style="margin:0">only you see this panel</span></div><p class="note">reading…</p>'
        udb
          .collection('sessions')
          .orderBy('started_at', 'desc')
          .limit(300)
          .get()
          .then(function (snap) {
            var rows = snap.docs.map(function (d) {
              return d.data()
            })
            var people = {},
              queries = {},
              clicks = {},
              feedback = 0
            rows.forEach(function (r) {
              var v = r.viewer || 'unknown'
              var p =
                people[v] ||
                (people[v] = { visits: 0, searches: 0, events: 0, last: '' })
              p.visits++
              p.searches += (r.searches || []).length
              p.events += (r.events || []).length
              if ((r.last_at || '') > p.last) p.last = r.last_at || ''
              feedback += r.feedback || 0
              Object.keys(r.clicks || {}).forEach(function (k) {
                clicks[k] = (clicks[k] || 0) + (r.clicks[k] || 0)
              })
              ;(r.searches || []).forEach(function (s) {
                var key = (s.q || '').toLowerCase()
                var q =
                  queries[key] ||
                  (queries[key] = { q: s.q, n: 0, empty: 0, partial: 0 })
                q.n++
                if (!s.total) q.empty++
                if (s.partial) q.partial++
              })
            })
            var ids = Object.keys(people).filter(function (v) {
              return v !== 'unknown'
            })
            var profs = uuser ? uuser.profiles(ids) : Promise.resolve({})
            return profs.then(function (ps) {
              var order = Object.keys(people).sort(function (a, b) {
                return people[b].visits - people[a].visits
              })
              var who = order
                .map(function (v) {
                  var pr = ps[v] || {},
                    p = people[v]
                  var label =
                    pr.name || (v === 'unknown' ? 'not signed in' : 'someone')
                  return (
                    '<tr><td>' +
                    esc(label) +
                    (pr.email
                      ? ' <span class="muted mono">' + esc(pr.email) + '</span>'
                      : '') +
                    '</td><td class="num">' +
                    p.visits +
                    '</td><td class="num">' +
                    p.searches +
                    '</td><td class="num">' +
                    p.events +
                    '</td><td class="date">' +
                    esc(shortDate(p.last)) +
                    '</td></tr>'
                  )
                })
                .join('')
              var qs = Object.keys(queries)
                .map(function (k) {
                  return queries[k]
                })
                .sort(function (a, b) {
                  return b.empty - a.empty || b.n - a.n
                })
                .slice(0, 40)
                .map(function (q) {
                  var flag = q.empty
                    ? badge('crit', 'found nothing')
                    : q.partial
                      ? badge('warn', 'closest matches')
                      : ''
                  return (
                    '<tr><td>' +
                    esc(q.q) +
                    '</td><td class="num">' +
                    q.n +
                    '</td><td>' +
                    flag +
                    '</td></tr>'
                  )
                })
                .join('')
              var ck =
                Object.keys(clicks)
                  .sort(function (a, b) {
                    return clicks[b] - clicks[a]
                  })
                  .map(function (k) {
                    return esc(k) + ' ' + clicks[k]
                  })
                  .join(' · ') || 'none yet'
              host.innerHTML =
                '<div class="sechead"><span class="sectoggle">Usage</span>' +
                '<span class="note" style="margin:0">only you see this panel</span></div>' +
                '<p class="note" style="margin-top:0">' +
                rows.length +
                ' visits · ' +
                order.length +
                ' people · ' +
                feedback +
                ' feedback comments opened · links out: ' +
                ck +
                '</p>' +
                '<div class="usagegrid">' +
                '<div class="tablewrap"><table><thead><tr><th>Who</th><th>Visits</th><th>Searches</th><th>Events opened</th><th>Last seen</th></tr></thead><tbody>' +
                (who ||
                  '<tr><td colspan="5" class="muted">nobody yet</td></tr>') +
                '</tbody></table></div>' +
                '<div class="tablewrap"><table><thead><tr><th>What they searched</th><th>Times</th><th></th></tr></thead><tbody>' +
                (qs ||
                  '<tr><td colspan="3" class="muted">no searches yet</td></tr>') +
                '</tbody></table></div>' +
                '</div>' +
                '<p class="note">Stored with the page, so anyone here who opens it could read these rows. ' +
                'Names are resolved as you view them and are never written down.</p>'
            })
          })
          .then(null, function () {
            host.innerHTML =
              '<div class="sechead"><span class="sectoggle">Usage</span></div>' +
              '<p class="note">could not read the usage store</p>'
          })
      }

      return {
        init: init,
        search: search,
        opened: opened,
        picked: picked,
        clicked: clicked,
        feedback: feedback,
        canComment: function () {
          return !!ucomments
        },
      }
    })()

    // ---- events ----------------------------------------------------------------------
    document.addEventListener(
      'click',
      function (ev) {
        var fb = ev.target.closest('[data-feedback]')
        if (fb) {
          ev.preventDefault()
          USAGE.feedback(fb)
          return
        }
        var a = ev.target.closest('a[href^="http"]')
        if (a) USAGE.clicked(a.getAttribute('href'))
      },
      true,
    )

    document.addEventListener('click', function (ev) {
      var sum = ev.target.closest('details.dd > summary')
      if (sum) {
        var d = sum.parentElement
        state.dd = d.hasAttribute('open') ? null : d.dataset.dd
        return // let <details> toggle itself; no re-render, so the menu stays put
      }
      var t = ev.target.closest(
        '[data-sec],[data-area],[data-prod],[data-fires],[data-status],[data-qsel],[data-ev],[data-clear],[data-sort],#clearf,#clearq,#clearq2',
      )
      if (!t) return
      ev.preventDefault()
      if (t.id === 'clearq') {
        state.q = ''
        document.getElementById('q').value = ''
      } else if (t.id === 'clearf') {
        state.area = null
        state.products = []
        state.origins = []
        state.statuses = []
        state.question = null
        state.addedAfter = ''
        state.minVolume = ''
      } else if (t.id === 'clearq2') state.question = null
      else if (t.dataset.sec) {
        var k = t.dataset.sec
        state.sections[k] = t.getAttribute('aria-expanded') !== 'true'
      } else if (t.dataset.area)
        state.area = state.area === t.dataset.area ? null : t.dataset.area
      else if (t.dataset.prod) toggleIn(state.products, t.dataset.prod)
      else if (t.dataset.fires) toggleIn(state.origins, t.dataset.fires)
      else if (t.dataset.status) toggleIn(state.statuses, t.dataset.status)
      else if (t.dataset.qsel) {
        state.question =
          state.question === t.dataset.qsel ? null : t.dataset.qsel
        if (state.question) USAGE.picked(state.question)
      } else if (t.dataset.ev) {
        state.open[t.dataset.ev] = !state.open[t.dataset.ev]
        if (state.open[t.dataset.ev]) USAGE.opened(t.dataset.ev)
      } else if (t.dataset.clear) {
        if (t.dataset.clear === 'status') state.statuses = []
        else if (t.dataset.clear === 'fires') state.origins = []
        else state.products = []
      } else if (t.dataset.sort) {
        if (state.sortKey !== t.dataset.sort) {
          state.sortKey = t.dataset.sort
          state.sortDir =
            t.dataset.sort === 'count' || t.dataset.sort === 'added'
              ? 'desc'
              : 'asc'
        } else if (state.sortDir === 'asc') state.sortDir = 'desc'
        else state.sortKey = null
      }
      render()
    })
    document.addEventListener('change', function (ev) {
      if (ev.target.id === 'areasel') {
        state.area = ev.target.value || null
        render()
      } else if (ev.target.id === 'addedafter') {
        state.addedAfter = ev.target.value
        render()
      } else if (ev.target.id === 'minvol') {
        state.minVolume = ev.target.value
        render()
      }
    })
    var qEl = document.getElementById('q'),
      tmr,
      logTmr
    function logSearch() {
      var r = search(state.q)
      USAGE.search(state.q, r.total, r.questions.length, r.partial)
    }
    qEl.addEventListener('input', function () {
      clearTimeout(tmr)
      clearTimeout(logTmr)
      tmr = setTimeout(function () {
        state.q = qEl.value
        state.question = null
        render()
      }, 120)
      // What someone typed matters, what they typed on the way to it does not.
      logTmr = setTimeout(logSearch, 1400)
    })
    document.getElementById('tryrow').innerHTML =
      'Try: ' +
      [
        'voter file export',
        'onboarding drop off',
        'pro upgrade',
        'campaign plan',
        'text campaign',
      ]
        .map(function (s) {
          return (
            '<button class="pill" data-try="' +
            esc(s) +
            '">' +
            esc(s) +
            '</button>'
          )
        })
        .join('')
    document.getElementById('tryrow').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-try]')
      if (!b) return
      qEl.value = b.dataset.try
      state.q = b.dataset.try
      state.question = null
      render()
      logSearch()
    })

    renderNext()
    render()
    USAGE.init()
  })()
</script>
