[project]
name = "gp-ai-projects"
version = "0.1.0"
description = "AI projects at goodparty - workspace root"
readme = "README.md"
requires-python = ">=3.11"

# Workspace root - for local development, install all dependencies
dependencies = [
    "python-dotenv>=1.1.1",
    "pydantic>=2.0.0",
    "tavily-python>=0.7.8",
    "openai>=1.93.1",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "reportlab>=4.4.2",
    "google-genai>=1.56.0",
    "databricks-sql-connector>=4.0.5",
    "pandas>=2.2.3",
    "pyarrow>=21.0.0",
    "tqdm>=4.67.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "faiss-cpu>=1.12.0",
    "numpy>=2.3.1",
    "tabulate>=0.9.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.6.1",
    "matplotlib>=3.10.0",
    "scipy>=1.15.0",
    "umap-learn>=0.5.7",
    "plotly>=5.27.0",
    "seaborn>=0.13.2",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.184.0",
    "hdbscan>=0.8.40",
    "aiohttp>=3.11.11",
    "boto3>=1.40.50",
    "spacy>=3.8.7",
    "pillow>=10.0.0",
    "braintrust>=0.12.1",
    "claude-agent-sdk==0.2.87",
    "slack-sdk>=3.39.0",
    "sqlglot>=30.4.3",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.workspace]
members = ["shared", "serve/v1_pipeline", "hubspot_ddhq_match", "clickup_bot", "engineer_agent", "pmf_engine", "broker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_generated_campaign_plan", "shared"]

[tool.ruff]
line-length = 120
target-version = "py311"

# Ruff has never run over this tree in CI — pre-commit only ever checked changed
# files — so a full-tree `ruff check .` reports ~3900 errors. Rather than bury a
# CI change under a 3900-line mechanical diff, the gate starts on the members it
# can actually keep clean and the rest is excluded as tracked debt.
#
# Each entry below is debt, not a permanent exemption. The number is the error
# count measured 2026-08-05; delete the line once that member is clean. Nothing
# here is deployed except the three marked DEPLOYED, which are the priority.
#
# Every entry is anchored: a pattern with no slash matches a directory of that
# name at ANY depth, so a bare "shared" would silently exempt a nested
# helpers package such as stitch_golden_data/prod_gold_data/shared/ while
# `ruff check .` still reported green. The `serve/*` entries already contain a
# slash and are anchored by that.
extend-exclude = [
    "./shared",                     # 623 (80 manual) — DEPLOYED, imported by every service; fix first
    "serve/hierarchical_discovery", # 469 (98 manual) — DEPLOYED, ships in the serve-analyze image
    "./hubspot_ddhq_match",         # 377 (24 manual) — DEPLOYED, the ddhq-matcher service
    "./ai_generated_campaign_plan", # 833 — not deployed, older module
    "./bronze_data",                # 478 — not deployed, data drop / config
    "serve/classify",               # 237 — not deployed, script-style
    "serve/analyze_texts",          # 150 — not deployed, script-style
    "./silver-to-gold-migration",   # 131 — not deployed, script-style
    "./braintrust_eval_sandbox",    # not deployed, experiment sandbox
    "./llm_deployment",             # not deployed
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

# These modules insert the repo root into sys.path before importing from it, so
# their imports genuinely cannot sit at the top of the file. Removing the
# bootstrap is a packaging refactor, not a lint fix — until then E402 is noise
# here rather than a finding.
"serve/v1_pipeline/adapters/clustering_adapter.py" = ["E402"]
"serve/v1_pipeline/pipeline/orchestrator.py" = ["E402"]
"serve/v1_pipeline/pipeline/sqs_publisher.py" = ["E402"]
"serve/v1_pipeline/scripts/run_pipeline.py" = ["E402"]
"serve/v1_pipeline/stages/llm_cluster_recommender.py" = ["E402"]
"campaign_plan_lambda/local_server.py" = ["E402"]
"campaign_plan_lambda/test_sqs_harness.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# clickup_bot/tests/ and campaign_plan_lambda/tests/ both ship a test_handler.py
# and neither tests/ dir is a package, so the default "prepend" import mode
# aborts collection on a basename clash the moment both are collected together.
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "braintrust[cli]>=0.12.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "types-pyyaml>=6.0.12.20250915",
    "moto[s3,sqs,dynamodb]>=5.0.0",
    "jsonschema>=4.20.0",
]
campaign-plan-lambda = [
    "google-genai>=1.56.0",
    "braintrust>=0.12.1",
    # Used by shared/braintrust.py for local dev .env loading; was a
    # transitive of braintrust<0.12 and stopped being one after the 0.16
    # bump, so we now declare it explicitly.
    "python-dotenv>=1.1.1",
]
